bbs.cgiの氏名の公開検索対象にする":"Jadikan semua target keluaran sebagai target pencarian publik untuk nama di sbbs.cgi","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Masukkan nama rumah tangga dan klik \"Hasilkan QR\" untuk menyimpannya bersama orang tersebut.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Silakan masukkan \"nama\" orang tersebut. Ini adalah bidang terpisah dari \"Nama rumah tangga\"","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Jumlah pengunjung: {0} orang / Pintu masuk: {1} kali / Keluar: {2} kali","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Mereka yang memasuki tempat acara disebut ``Masuk'' dan mereka yang meninggalkan tempat tersebut disebut ``Keluar.''","登録情報が見つかりません。同期やバックアップを確認してください":"Informasi pendaftaran tidak ditemukan. Periksa sinkronisasi dan cadangan","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Tempatkan QR yang dikeluarkan di bingkai. Baca dan bagikan rekaman dalam obrolan yang sama.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"QR hanya berisi ID pengunjung. Informasi pribadi akan ditampilkan dengan membandingkannya dengan informasi yang terdaftar.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"20 orang pertama akan dipratinjau, dan semua orang yang dipersempit akan ditampilkan ke file.","ID方式のQRではありません。登録情報からQRを再発行してください":"Ini bukan QR berbasis ID. Silakan terbitkan ulang QR dari informasi pendaftaran.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Gerai/persediaan ini telah dihapus. Silakan pilih tombol khusus lainnya","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Tidak dapat memulai kamera langsung. Silakan gunakan penjelasan layar dan pembacaan gambar.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Tidak dapat memuat file gambar. Silakan simpan di lokasi lain dan coba lagi","送信サイズ上限により共有できません。バックアップを保存してください":"Tidak dapat dibagikan karena batas ukuran pengiriman. Harap simpan cadangan","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"ID Pengeditan: {0}. Perubahan pada orang yang dipilih akan disimpan ke ID yang sama.","履歴の端末内保存に空きがありません。バックアップを保存してください":"Tidak ada ruang tersisa di penyimpanan riwayat perangkat. Harap simpan cadangan","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"200 item terbaru ditampilkan dalam riwayat, dan semua item dikeluarkan ke CSV dan laporan.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Tidak ada tombol khusus yang disetel. Silakan tambahkan dari \"Pengaturan Tombol Khusus\" di bawah.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Penerbitan/pemindaian QR orang yang masuk/keluar • Terminal anggota • Catatan pendaftaran/masuk/keluar QR","保存容量不足などにより取込を中止しました。既存データを保持しています":"Impor dibatalkan karena ruang penyimpanan tidak mencukupi. Mempertahankan data yang ada","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Jika Anda berencana untuk kembali. Mereka akan dimasukkan dalam jumlah orang yang terus diterima, dan ketika mereka kembali, mereka akan dicatat sebagai ``kembali''.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Tidak ada kamera yang tersedia ditemukan. Coba pilih gambar dan ambil foto.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Tidak dapat memulai kamera. Silakan coba lagi atau pilih gambar/ambil foto.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Ini adalah mode penerimaan dan registrasi. Agregasi dan laporan dapat digunakan dari terminal administrator.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Masukkan catatan, industri/perusahaan/departemen/posisi/telepon/email, klasifikasi masuk/keluar dan terminal pembacaan akhir","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Saya mendaftarkan ID saya dan membuat QR. Terminal lain dapat membaca informasi pendaftaran setelah menerimanya.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Harap simpan gambar di bawah 50MB. Memotong area sekitar QR akan memudahkan pembacaannya.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Jika Anda ingin menghentikan penerimaan. Mereka akan dikeluarkan dari jumlah orang yang akan terus diterima, dan akan dikeluarkan pada tanggal dan waktu keluar CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Saya tidak bisa membuka layar cetak. Silakan buka di browser Anda dari Simpan/Bagikan Laporan HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Pilih gambar QR seperti PNG atau JPEG. Anda dapat memilih gambar yang sama dan coba lagi.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Kamera langsung tidak tersedia di lingkungan tampilan ini. Coba pilih gambar dan ambil foto.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Cakupan berbagi: Semua peserta dalam obrolan yang sama. Mode manajemen adalah saklar tampilan di dalam terminal. Jumlah item yang belum terkirim:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Masukkan nama orang tersebut di kolom \"Nama\" di atas. QR akan diterbitkan dan dicatat untuk setiap orang di rumah yang sama.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Tidak dapat memulai kamera. Silakan tutup kamera aplikasi lain dan coba lagi, atau pilih gambar.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Klasifikasi tidak dikonfirmasi karena keluaran konvensional: orang {0}. Ini adalah rekor keadaan. Silakan periksa dengan absensi dan konfirmasi keselamatan.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Kamera langsung dihentikan untuk pemilihan gambar. Jika Anda ingin kembali, tekan \"Coba lagi kamera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Menunggu respons kamera. Silakan periksa layar izin atau gunakan opsi pemilihan gambar/pengambilan foto di bawah.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Kecualikan semua catatan agar tidak ditampilkan dalam riwayat berbagi. Data komunikasi sebelumnya, penyimpanan perangkat, dan CSV tidak akan dihapus.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Nomor duplikat dikecualikan berdasarkan ID orang. Kuantitas adalah total untuk setiap item dan unit. Tidak termasuk inventarisasi atau penentuan kelayakan.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Informasi pendaftaran tidak ditemukan. Pastikan untuk menyinkronkan aplikasi terlampir yang sama atau memulihkan cadangan JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR tidak ditemukan. Silakan pangkas agar seluruh QR dan margin putih terlihat, atau ambil foto yang lebih cerah dan pilih lagi.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Catat partisipasi stan dan penerimaan persediaan. Tombol yang Anda pilih akan disimpan di perangkat ini dan akan direkam secara terpisah dari masuk/keluar Anda.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Demo browser: rekaman akan disimpan di browser ini. Pemberitahuan tidak akan dikirim ke terminal Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Orang yang terdaftar: {0} / Masuk/keluar: {1} / Berpartisipasi/menerima: {2} / Peristiwa sejarah baru: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Saat memasuki dan meninggalkan venue, catat ID terminal ini, nama terminal dan venue pada saat itu. Nama terminal akan tercermin dalam catatan setelah konfigurasi.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"QR orang yang dikeluarkan/dicetak dipindai dan dicatat sebagai masuk/keluar. Bagikan dalam obrolan yang sama (penundaan dapat terjadi tergantung status komunikasi).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"ID ini tidak terdaftar atau informasi yang terdaftar tidak disinkronkan. Harap baca kembali setelah menerima informasi pendaftaran obrolan yang sama dengan terminal penerbit.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Tampilkan kembali QR dengan informasi terdaftar. Perubahan pengeditan tidak akan disimpan. QR yang hilang tidak akan dibatalkan meskipun diterbitkan ulang.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Tempat: {2} / Terminal: {3} / Tipe: {4} / Target: {5} / Pencarian: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maksimal 12 buah. Pendaftaran dan penghapusan jenis dapat dilakukan di bagian \"Booth/Persediaan\" administrator. Untuk partisipasi stan, satu pemindaian mencatat partisipasi satu orang.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Berdasarkan waktu, bulan, dan hari dalam seminggu, juga mengikuti kondisi periode, tempat, dan terminal bacaan. Grafik bulanan untuk periode yang mencakup tahun dijumlahkan dengan bulan yang sama.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Tergantung pada perangkat Anda dan kompatibilitas Delta Chat, Anda mungkin dapat mengambil foto atau memilih file. Ini adalah metode yang berbeda dari kamera langsung.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Format gambar ini tidak dapat ditampilkan. Silakan simpan sebagai PNG atau JPEG dan pilih lagi (HEIC/HEIF tidak didukung tergantung lingkungan)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Pilih untuk setiap perangkat. Peralihan ini berlaku pada tampilan tombol dan klasifikasi catatan saat ini, dan tidak mengubah catatan masa lalu, ID orang, rumah tangga, dan riwayat penerimaan material.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Masukkan industri, perusahaan, departemen, jabatan, nama, alamat, telepon, dan email untuk secara otomatis menghasilkan ID arbitrer dan menerbitkan QR hanya dengan ID tersebut. Cetak dan distribusikan kepada orang tersebut.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Jumlah penerimaan mengacu pada jumlah penerimaan dan pengembalian, dan jumlah keluar mengacu pada jumlah kasus yang secara tradisional dicatat sebagai keluar, keluar sementara, dan keluar resmi. Silakan periksa status pengungsi saat ini di bawah \"Evakuasi/Rumah Tangga\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Afiliasi seseorang disimpan di layar penerbitan QR. Sekalipun namanya sama, namun jika ID rumah tangganya berbeda, maka itu adalah rumah tangga yang berbeda. Perubahan afiliasi dilakukan untuk setiap orang. Informasi rumah tangga dalam sejarah masa lalu tidak akan ditulis ulang.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Biasanya, matikan dan gunakan ID perangkat baru. Jika Anda ingin menyalakannya, harap berhenti menggunakan perangkat aslinya. ID perangkat dari riwayat masa lalu disimpan seperti pada kedua kasus.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Tidak akan ditambah dengan jumlah orang yang masuk/keluar dan hadir. Jumlah orang sebenarnya akan dihitung dengan mengecualikan duplikat ID orang, dan jumlahnya akan dihitung berdasarkan bahan/unit. Tidak akan ada penentuan kelayakan, inventaris, atau distribusi duplikat secara otomatis.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Masukkan industri, perusahaan, departemen, jabatan, nama, alamat, telepon, dan email untuk secara otomatis menghasilkan ID arbitrer dan menerbitkan QR hanya dengan ID tersebut. Cetak, distribusikan, pindai di venue, dan kelola masuk dan keluar sekaligus.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Bagikan daftar dalam aplikasi terlampir yang sama. Item yang dihapus tidak dapat direkam baru menggunakan tombol khusus, tetapi riwayat partisipasi dan penerimaan sebelumnya akan tetap ada. Di perangkat lain, perubahan akan terlihat setelah diterima.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Cari orang yang terdaftar berdasarkan nama, ID orang, nama rumah tangga, perusahaan, telepon, dan email, konfirmasi identitas, dan tekan \"Terbitkan ulang QR dengan ID yang sama\". Informasi pribadi, masuk/keluar, partisipasi, penerimaan perbekalan, dan riwayat rumah tangga akan diwariskan.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Akses ke kamera ditolak. Silakan periksa izin kamera perangkat Anda. Ini juga akan ditolak karena pembatasan di sisi Delta Chat/Webxdc, jadi jika Anda memiliki izin, silakan coba pilih gambar atau ambil foto.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Grafik menunjukkan hingga 12 klasifikasi dan total sisanya. Semua klasifikasi tercantum dalam tabel di bawah dan dalam laporan tercetak. Label untuk setiap grafik terminal adalah 8 karakter terakhir dari ID terminal, dan ID resmi serta nama terminal dapat ditemukan pada tabel di bawah. Catatan lama tidak dapat mengidentifikasi terminal sebenarnya.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"Pengaturan awal adalah OFF. Silakan aktifkan hanya bagi mereka yang telah mengonfirmasi izin untuk mempublikasikan. Sesuai dengan spesifikasi penilaian CGI terlampir, ketika MATI, kata-kata penilaian publik seperti catatan diubah menjadi referensi karakter untuk ditampilkan, dan ketika AKTIF, tanda eksplisit untuk publikasi ditambahkan.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Identitas dengan catatan masuk pada periode/tempat yang ditentukan akan dihitung sebagai satu orang. Atribut adalah titik masuk terakhir dalam periode tersebut. Riwayat yang usia dan jenis kelaminnya tidak didaftarkan akan dianggap \"tidak terjawab\". Nomor duplikat untuk setiap venue dan terminal tidak termasuk. Tidak termasuk rekaman yang tidak disinkronkan.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Orang, masuk/keluar, partisipasi/tanda terima, riwayat pendaftaran stan/persediaan/tempat, informasi yang belum terkirim, nama perangkat, mode penggunaan, dan pengaturan tombol khusus disimpan dalam JSON. Silakan periksa tujuan penyimpanan dan berbagi karena berisi informasi pribadi. Tidak termasuk kata sandi administratif dan status login.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV memiliki UTF-8 BOM, baris pertama adalah nama kolom, dan baris kedua adalah tag HXL. Impor kategori pengungsi esbbs.cgi. ZIP adalah format bagi administrator server untuk mengekstrak dan menempatkan TXT di lokasi penyimpanan pengungsi umum untuk kedua CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Keluarkan pengunjung sebagai pengungsi. Mendukung impor HXL \"evacuee\" esbbs.cgi dan format penyimpanan TXT email yang umum untuk sbbs.cgi dan esbbs.cgi. Catatan akan mencakup semua partisipasi stan dan riwayat penerimaan materi (tanggal/waktu, nama, jumlah, tempat, terminal) untuk setiap orang. Itu tidak akan secara otomatis dikirim ke CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Karena sisi CGI menganalisis satu baris \"nama item: nilai\", jeda baris dalam catatan untuk CGI dikelompokkan menjadi \"/\". Karakter khusus dibuat aman untuk tampilan CGI. Jeda baris dan string karakter dalam catatan asli biasanya dipertahankan dalam CSV dan JSON. Impor HXL tidak memiliki penghapusan duplikat di sisi CGI, jadi jika Anda mengimpor CSV yang sama berulang kali, maka akan terduplikasi.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON terintegrasi dengan data yang ada berdasarkan ID, dan data tambahan dibagikan ke aplikasi terlampir yang sama. Riwayat tidak akan bertambah dengan mengimpor ulang file yang sama. Silakan pilih cadangan dengan operasi yang sama. Riwayat penyetelan ulang juga tercermin. CSV masuk/keluar versi lama hanya dapat mengimpor orang dan masuk/keluar. Pengaturan perangkat dan daftar materi tidak dapat dipulihkan dengan CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Jumlah penerimaan termasuk kembali ke fasilitas, dan jumlah pintu keluar termasuk keberangkatan sementara dan pintu keluar resmi. Hitung jumlah orang dengan mengecualikan duplikat ID penerimaan dalam periode tersebut. Atribut adalah entri terakhir dalam periode tersebut. Usia mencaku Выход: {2}, Официальный выход: {3}","カメラを再試行しています。画像を選び直すこともできます。":"Повторная попытка камеры. Вы также можете повторно выбрать изображение.","端末内保存に失敗しました。記録をCSVで退避してください":"Не удалось сохранить на устройство. Пожалуйста, сохраните записи в формате CSV.","端末名・会場・音・利用モード・専用ボタンの設定も引き継ぐ":"Также переносятся настройки имени устройства, места проведения, звука, режима использования и специальных кнопок.","登録 {0}人 ／ {1}世帯 ／ 世帯未設定 {2}人":"Зарегистрированные люди {0} / Домохозяйства {1} / Домохозяйства, не установленные люди {2}","カメラの許可・起動を待っています。画像選択も利用できます。":"Ожидание разрешения/активации камеры. Выбор изображения также доступен.","画像が大きすぎます。QR周辺を切り抜いて選び直してください":"Изображение слишком велико. Пожалуйста, вырежьте область вокруг QR и выберите ее заново.","出力対象者全員をsbbs.cgiの氏名の公開検索対象にする":"Сделать все цели вывода общедоступными целями поиска по именам в sbbs.cgi.","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Введите имя семьи и нажмите «Создать QR», чтобы сохранить его у этого человека.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Пожалуйста, введите «имя» человека. Это отдельное поле от «Имя семьи».","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Количество посетителей: {0} человек / Вход: {1} раз / Выход: {2} раз","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Тех, кто входит в место проведения мероприятия, называют «Входящим», а тех, кто покидает место проведения, называют «Выходом».","登録情報が見つかりません。同期やバックアップを確認してください":"Регистрационная информация не найдена. Проверьте синхронизацию и резервное копирование","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Поместите выданный QR-код в рамку. Читайте и делитесь записями в одном чате.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"QR содержит только идентификатор посетителя. Личная информация будет отображаться путем сравнения ее с зарегистрированной информацией.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"Первые 20 человек будут просмотрены, а все суженные люди будут выведены в файл.","ID方式のQRではありません。登録情報からQRを再発行してください":"Это не QR-код на основе идентификатора. Пожалуйста, повторно отправьте QR-код из регистрационной информации.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Этот стенд/предложение было удалено. Пожалуйста, выберите другую специальную кнопку","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Невозможно запустить прямую трансляцию с камеры. Пожалуйста, используйте объяснение экрана и чтение изображений.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Невозможно загрузить файл изображения. Пожалуйста, сохраните в другом месте и повторите попытку.","送信サイズ上限により共有できません。バックアップを保存してください":"Невозможно поделиться из-за ограничения размера отправки. Пожалуйста, сохраните резервную копию","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"Идентификатор редактирования: {0}. Изменения выбранного человека будут сохранены под тем же идентификатором.","履歴の端末内保存に空きがありません。バックアップを保存してください":"В памяти устройства не осталось места. Пожалуйста, сохраните резервную копию","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"Последние 200 элементов отображаются в истории, и все элементы выводятся в CSV и отчеты.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Специальная кнопка не установлена. Добавьте его из «Настройки выделенных кнопок» ниже.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Выдача/сканирование QR-кода въезда/выезда • Терминал участника • QR-запись регистрации/входа/выезда","保存容量不足などにより取込を中止しました。既存データを保持しています":"Импорт был отменен из-за недостаточного места для хранения. Сохраняет существующие данные","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Если вы планируете вернуться. Их включат в число людей, которых продолжат принимать, а когда они вернутся, их запишут как «вернувшихся».","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Доступные камеры не найдены. Попробуйте выбрать изображения и сделать фотографии.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Невозможно запустить камеру. Пожалуйста, повторите попытку или выберите изображение/сфотографируйте.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Это режим приема и регистрации. Агрегацию и отчеты можно использовать с терминала администратора.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Введите примечания, отрасль/компанию/отдел/должность/телефон/электронную почту, классификацию входа/выхода и терминал окончательного считывания.","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Я зарегистрировал свой идентификатор и создал QR. Другие терминалы могут прочитать регистрационную информацию после ее получения.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Пожалуйста, сохраняйте изображения размером не более 50 МБ. Вырезание области вокруг QR облегчит чтение.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Если вы хотите прекратить прием. Они будут исключены из числа людей, которые будут продолжать приниматься, и будут выведены в дату и время выезда CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Не могу открыть принтскрин. Откройте в браузере HTML-файл отчета «Сохранить/поделиться».","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Выберите изображение QR, например PNG или JPEG. Вы можете выбрать то же изображение и повторить попытку.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Камера в реальном времени недоступна в этой среде отображения. Попробуйте выбрать изображения и сделать фотографии.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Область общего доступа: все участники одного чата. Режим управления — это переключатель дисплея внутри терминала. Количество неотправленных товаров:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Введите имя человека в поле «Имя» выше. QR будет выдан и записан для каждого члена одного домохозяйства.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Невозможно запустить камеру. Закройте камеру другого приложения и повторите попытку или выберите изображение.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Классификация не подтверждена из-за условного выхода: люди {0}. Это состояние записи. Пожалуйста, сверьтесь с перекличкой и подтверждением безопасности.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Камера прямого эфира была остановлена для выбора изображения. Если вы хотите вернуться, нажмите «Повторить попытку камеры».","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Ждем ответа камеры. Пожалуйста, проверьте экран разрешений или воспользуйтесь опцией выбора изображения/фотосъемки ниже.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Исключить все записи из отображения в истории общего доступа. Данные прошлых коммуникаций, хранилище устройства и CSV-файлы не будут удалены.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Повторяющиеся номера исключаются по идентификатору человека. Количество – это общая сумма по каждому товару и единице. Не включает инвентаризацию или определение приемлемости.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Регистрационная информация не найдена. Обязательно синхронизируйте одно и то же прикрепленное приложение или восстановите резервную копию JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR не найден. Обрежьте его так, чтобы был виден весь QR-код и белое поле, или сделайте более яркую фотографию и выберите еще раз.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Зарегистрируйте участие стенда и получение материалов. Выбранная вами кнопка будет сохранена на этом устройстве и будет записана отдельно от вашего входа/выхода.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Демо-версия браузера: записи будут сохраняться в этом браузере. Уведомления не будут отправляться на терминалы Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Зарегистрированные люди: {0} / Въезд/выход: {1} / Участие/прием: {2} / Новые события истории: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"При входе и выходе из места проведения запишите этот идентификатор терминала, название терминала и место проведения в это время. Имя терминала будет отражено в записи после настройки.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"Выданный/распечатанный QR-код человека сканируется и регистрируется как вход/выход. Поделитесь в одном чате (могут возникать задержки в зависимости от статуса связи).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Этот идентификатор не зарегистрирован или зарегистрированная информация не синхронизирована. Пожалуйста, перечитайте после получения той же информации о регистрации в чате, что и на выдающем терминале.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Повторно отобразите QR с зарегистрированной информацией. Изменения редактирования не будут сохранены. Утерянный QR-код не будет признан недействительным, даже если он будет выпущен повторно.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Место проведения: {2} / Терминал: {3} / Тип: {4} / Цель: {5} / Поиск: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Максимум 12 штук. Регистрация и удаление типов осуществляется в администраторском разделе «Стенд/Расходные материалы». При участии на стенде одно сканирование фиксирует участие одного человека.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"По времени суток, месяцу и дню недели он также соответствует условиям периода, места и терминала чтения. Месячные графики за периоды, охватывающие годы, складываются в те же месяцы.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"В зависимости от вашего устройства и совместимости с Delta Chat у вас может быть возможность сделать фотографию или выбрать файл. Это другой метод, чем прямая камера.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Этот формат изображения не может быть отображен. Сохраните файл в формате PNG или JPEG и выберите еще раз (HEIC/HEIF не поддерживается в зависимости от среды).","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Выберите для каждого устройства. Переключение применяется к отображению кнопок и текущей классификации записей и не меняет прошлые записи, идентификаторы лиц, домохозяйства и историю поступления материалов.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Введите отрасль, компанию, отдел, должность, имя, адрес, телефон и адрес электронной почты, чтобы автоматически сгенерировать произвольный идентификатор и отправить QR-код только с этим идентификатором. Распечатайте его и раздайте человеку.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Под количеством госпитализаций понимается количество госпитализаций и возвратов, а под числом выездов понимается количество случаев, традиционно регистрируемых как выезды, временные выезды и официальные выезды. Пожалуйста, проверьте текущий статус эвакуированного в разделе «Эвакуация/Семья».","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Принадлежность человека сохраняется на экране выдачи QR. Даже если имя то же самое, если идентификатор домохозяйства другой, это другое домохозяйство. Изменения в принадлежности производятся для каждого человека. Бытовая информация из прошлой истории не будет переписана.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Обычно отключите его и используйте новый идентификатор устройства. Если вы хотите включить его, прекратите использование исходного устройства. Идентификатор устройства из прошлой истории сохраняется таким, каким он был в обоих случаях.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Оно не будет добавлено к количеству входящих/выходящих и присутствующих людей. Фактическое количество людей будет рассчитываться путем исключения повторяющихся идентификаторов людей, а количество будет рассчитываться по материалу/единице. Не будет автоматического определения приемлемости, инвентаря или дублированного распределения.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Введите отрасль, компанию, отдел, должность, имя, адрес, телефон и адрес электронной почты, чтобы автоматически сгенерировать произвольный идентификатор и отправить QR-код только с этим идентификатором. Распечатайте его, раздайте, отсканируйте на месте и одновременно управляйте входом и выходом.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Поделитесь списком в том же прикрепленном приложении. Удаленные элементы не могут быть заново записаны с помощью специальной кнопки, но история прошлых участия и получения останется. На другом устройстве изменения отразятся после их получения.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Найдите зарегистрированного человека по имени, идентификатору человека, имени семьи, компании, телефону и адресу электронной почты, подтвердите личность и нажмите «Повторно отправить QR с тем же идентификатором». Личная информация, вход/выход, участие, получение материалов и семейная история будут унаследованы.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Доступ к камере запрещен. Пожалуйста, проверьте разрешения камеры вашего устройства. В этом также будет отказано из-за ограничений на стороне Delta Chat/Webxdc, поэтому, если у вас есть разрешение, попробуйте выбрать изображение или сделать фотографию.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"На графике показано до 12 классификаций и оставшееся общее количество. Все классификации перечислены в таблице ниже и в печатном отчете. Метка для каждого графа терминала представляет собой последние 8 символов идентификатора терминала, а официальный идентификатор и имя терминала можно найти в таблице ниже. Старая запись не может идентифицировать настоящий терминал.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"Начальная настройка ВЫКЛ. Пожалуйста, включайте его только для тех, кто подтвердил свое разрешение на публикацию. В соответствии со спецификациями оценки прилагаемого CGI, когда ВЫКЛ, слова общественного мнения, такие как примечания, преобразуются в ссылки на символы для отображения, а когда ВКЛ, добавляется явная отметка для публикации.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Удостоверения личности с записью о допуске в указанный период/место будут засчитываться за одно лицо. Атрибут является последней точкой входа в течение периода. История, в которой не указаны возраст и пол, будет считаться «без ответа». Дублирующиеся номера для каждого объекта и терминала исключены. Не включает несинхронизированные записи.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Лица, вход/выход, участие/прием, история регистрации стенда/поставок/площадки, неотправленная информация, имя устройства, режим использования и настройки специальных кнопок сохраняются в формате JSON. Пожалуйста, проверьте места хранения и обмена, поскольку они содержат личную информацию. Не включает пароль администратора и статус входа.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV имеет спецификацию UTF-8, первая строка — это имя столбца, а вторая строка — тег HXL. Импортируйте в категорию эвакуированных в esbbs.cgi. ZIP — это формат, позволяющий администраторам серверов извлекать и помещать TXT в общее место хранения эвакуированных для обоих CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Выводить посетителей как эвакуированных. Поддерживает импорт HXL «эвакуированного» esbbs.cgi и формат хранения TXT электронной почты, общий для sbbs.cgi и esbbs.cgi. Примечания будут включать все данные об участии на стенде и историю получения материалов (дата/время, имя, количество, место проведения, терминал) для каждого человека. Он не будет автоматически отправлен в CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Поскольку сторона CGI анализирует одну строку «имя элемента: значение», разрывы строк в примечаниях для CGI группируются в «/». Специальные символы безопасны для отображения CGI. Разрывы строк и строки символов в исходных заметках обычно сохраняются в форматах CSV и JSON. Импорт HXL не предполагает удаления дубликатов со стороны CGI, поэтому, если вы импортируете один и тот же CSV повторно, он будет дублироваться.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON интегрируется с существующими данными по идентификатору, а дополнительные данные передаются в то же подключенное приложение. История не будет увеличена при повторном импорте того же файла. Пожалуйста, выберите резервную копию с той же операцией. Также отображается история сброса. Старая версия CSV для входа/выхода позволяет импортировать только людей и вход/выход. Настройки устройства и списки материалов невозможно восстановить с помощью CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"В число допусков входит возвращение в учреждение, а в число выездов – временные выезды и служебные выезды. Подсчитайте количество людей, исключив повторяющиеся идентификаторы приема за период. Атрибуты указаны по состоянию на последнюю запись за период. Возраст включает вопросы без ответа по возрастным группам. Количество людей по местам и устройствам — это фактическое количество людей в каждом из них. В каждой таблице показаны все категории, а на графике показаны 12 самых популярных категорий и оставшееся общее количество. Записи до синхронизации не учитываются.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Проверьте настройки Android → Приложения → Delta Chat → Разрешения → Камера. Если вы используете браузер, проверьте разрешения на стороне браузера. Даже если вы дадите разрешение, в прямой трансляции камеры может быть отказано из-за ограничений версии Delta Chat или стороны Webxdc. Поскольку его нельзя отменить из приложения, попробуйте выбрать изображение или сделать снимок.","女性":"Женский","男性":"Мужской","その他":"Другое","会議室A":"Комната А","会議室B":"Комната Б","80歳以上":"80 лет и старше","メイン会場":"Основная площадка","回答しない":"Предпочитаю не говорить","年齢（年代）":"Возрастная группа","{0}〜{1}歳":"{0}–{1} лет","ブース・物資の登録画面へ":"Перейти к экрану регистрации стенда/поставок","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Также переносятся настройки имени устройства, места проведения, звука, режима использования, языка дисплея и специальных кнопок.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Попросите администратора зарегистрировать названия стендов и ресурсов, затем получите данные в том же прикреплённом приложении.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"Стенд/материалы не зарегистрированы. Заголовки категорий не могут быть выбраны. Вы можете выбрать его, когда администратор зарегистрирует имя.","出力失敗:":"Выходной сбой:","読取処理:":"Чтение обработки:","引き継ぎ完了：":"Перенос завершен:","画像出力失敗:":"Ошибка вывода изображения:","画像読取失敗：":"Ошибка чтения изображения:","CGI出力失敗:":"Ошибка вывода CGI:","レポート出力失敗:":"Сообщить об ошибке вывода:","QRを解析しています（":"Разбор QR(","QR生成に失敗しました":"Генерация QR не удалась","バックアップ作成失敗:":"Ошибка создания резервной копии:","QR再発行に失敗しました":"Не удалось повторно отправить QR-код.","QR読取済み・記録なし：":"QR-сканирован/нет записи:","件の履歴イベントを追加しました":"Добавлены исторические события","QRを確認しましたが記録できませんでした。":"Я проверил QR, но его не удалось записать.","既存の同じIDと内容が異なるため取り込めません:":"Невозможно импортировать, поскольку содержимое отличается от существующего того же идентификатора:","さんのQRを同じIDで再発行しました。保存・印刷できます":"Мы перевыпустили ваш QR-код с тем же идентификатором. Можно сохранить и распечатать","性別":"Пол","取込できません:":"Невозможно импортировать:","ファイルを確認しています":"Проверка файла","CSVが空です":"CSV-файл пуст","行目の列数が不正です":"Недопустимое количество столбцов в строке.","CSVは10万行までです":"CSV — до 100 000 строк.","CSVの人物情報が不正です":"Информация о человеке в CSV неверна.","履歴イベントは10万件までです":"До 100 000 исторических событий","行目の日時・区分・氏名が不正です":"Дата/время/категория/имя в строке недействительны.","不正な履歴イベントが含まれています":"Содержит недопустимое событие истории.","同じIDに異なる記録が含まれています":"Один и тот же идентификатор содержит разные записи","対応するバックアップ形式ではありません":"Не поддерживаемый формат резервной копии","ファイルの内容が破損または変更されています":"Содержимое файла повреждено или изменено","入退場CSVではありません。参加・受取CSVの移行にはJSONバックアップを使ってください":"Это не входной/выходной CSV. Используйте резервную копию JSON для переноса CSV-файла об участии/квитанции."}};
let displayLanguage=(()=>{try{const code=localStorage.getItem('chatt_display_language');return DISPLAY_LANGUAGES.some(l=>l.code===code)?code:'ja';}catch(e){return 'ja';}})();
const missingTranslationKeys=new Set();
const translatedValueSets=Object.fromEntries(Object.entries(UI_TRANSLATIONS).map(([code,dict])=>[code,new Set(Object.values(dict))]));
function T(value){const text=String(value??'');if(displayLanguage==='ja')return text;const key=text.trim();if(!key||key==='ちゃっと入退場')return text;const translated=UI_TRANSLATIONS[displayLanguage]?.[key]??UI_TRANSLATIONS.en?.[key];if(translated===undefined){if(translatedValueSets[displayLanguage]?.has(key))return text;if(/[\u3040-\u30ff\u3400-\u9fff]/.test(key))missingTranslationKeys.add(key);return text;}return text.slice(0,text.length-text.trimStart().length)+translated+text.slice(text.trimEnd().length);}
function M(strings,...values){const key=strings.reduce((text,part,i)=>text+part+(i<values.length?'{'+i+'}':''),'');return T(key).replace(/\{(\d+)\}/g,(match,index)=>index<values.length?String(values[index]):match);}
function localizedHtmlText(text){if(!/[\u3040-\u30ff\u3400-\u9fff]/.test(text))return text;const indices=[],key=text.replace(/__XDCP_(\d+)__/g,(_,index)=>'{'+(indices.includes(index)?indices.indexOf(index):indices.push(index)-1)+'}');const translated=T(key);if(translated===key)return text;return esc(translated).replace(/\{(\d+)\}/g,(match,index)=>indices[index]===undefined?match:'__XDCP_'+indices[index]+'__');}
function H(strings,...values){if(typeof strings==='string'){if(displayLanguage==='ja')return strings;return localizeHtml(strings);}if(displayLanguage==='ja')return strings.reduce((html,part,i)=>html+part+(i<values.length?String(values[i]):''),'');let html=strings.reduce((text,part,i)=>text+part+(i<values.length?'__XDCP_'+i+'__':''),'');return localizeHtml(html).replace(/__XDCP_(\d+)__/g,(match,index)=>index<values.length?String(values[index]):match);}
function localizeHtml(html){return html.replace(/(^|>)([^<>]*)(?=<|$)/g,(match,prefix,text)=>prefix+localizedHtmlText(text)).replace(/\b(placeholder|title|aria-label)="([^"]*)"/g,(match,name,text)=>name+'="'+localizedHtmlText(text)+'"').replace(/<html\s+lang="ja"/g,'<html lang="'+displayLanguage+'" dir="'+(displayLanguage==='ar'?'rtl':'ltr')+'"').replace(/<html>/g,'<html lang="'+displayLanguage+'" dir="'+(displayLanguage==='ar'?'rtl':'ltr')+'">').replace(/<\/head>/gi,displayLanguage==='ar'?'<style>html[dir=rtl] th,html[dir=rtl] td,html[dir=rtl] .note,html[dir=rtl] .info{text-align:right}code{direction:ltr;unicode-bidi:isolate}</style></head>':'</head>');}
function renderLanguageSelector(){const lang=DISPLAY_LANGUAGES.find(l=>l.code===displayLanguage)||DISPLAY_LANGUAGES[0];return '<section class="card pad" id="language-settings" style="max-width:900px;margin:10px auto"><label class="label" for="display-language">🌐 '+esc(lang.label)+' / Language</label><select id="display-language" class="select" data-f="displayLanguage">'+DISPLAY_LANGUAGES.map(l=>'<option value="'+l.code+'" '+(l.code===displayLanguage?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</select><p class="hint">'+esc(lang.hint)+'</p></section>';}
function applyLanguagePresentation(){document.documentElement.lang=displayLanguage;document.documentElement.dir=displayLanguage==='ar'?'rtl':'ltr';if(!document.getElementById('chatt-language-style')){const style=document.createElement('style');style.id='chatt-language-style';style.textContent='.btn{white-space:normal;overflow-wrap:anywhere;line-height:1.4;padding-top:8px;padding-bottom:8px}html:not([lang=ja]) .row{flex-wrap:wrap}html[dir=rtl] .label,html[dir=rtl] .hint,html[dir=rtl] th,html[dir=rtl] td{text-align:right}[data-pending-count]{margin-inline:4px}.qr-code-text,code,textarea[data-f=manualCode],input[type=email],input[type=tel],input[type=number]{direction:ltr;unicode-bidi:isolate}input[data-f^="pf-"],textarea[data-f^="pf-"]{unicode-bidi:plaintext}#language-settings{box-sizing:border-box;width:calc(100% - 32px)}';document.head.appendChild(style);}}
function changeDisplayLanguage(code){if(!DISPLAY_LANGUAGES.some(l=>l.code===code))return;syncPersonFormFromDOM();displayLanguage=code;document.getElementById('toast')?.classList.remove('on');try{localStorage.setItem('chatt_display_language',code);}catch(e){}applyLanguagePresentation();renderNow();}
function displayAttributeLabel(value,key){if(key==='gender')return T(value);if(key==='age'){const match=/^(\d+)〜(\d+)歳$/.exec(value);if(match)return M`${match[1]}〜${match[2]}歳`;return T(value);}return value;}
window.ChattI18n={get lang(){return displayLanguage;},t:T,languages:DISPLAY_LANGUAGES.map(l=>({code:l.code,name:l.name})),getMissingKeys:()=>[...missingTranslationKeys]};

function displayVenueName(venue){if(!venue)return '';return ['main','room-a','room-b'].includes(venue.id)&&['メイン会場','会議室A','会議室B'].includes(venue.name)?T(venue.name):venue.name;}

function installMock(){
 const KEY='webxdc-chatt-mock';
 const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}};
 const addr=new URLSearchParams(location.search).get('user')||'self@example.com';
 let listener=null, seen=0;
 const pump=()=>{ if(!listener)return; const arr=load(); while(seen<arr.length){ const u=arr[seen++]; listener({payload:u.payload,serial:u.serial,max_serial:arr.length}); } };
 window.webxdc={ selfAddr:addr, selfName:addr.split('@')[0],
  sendUpdate(u){ const arr=load(); arr.push({payload:u.payload,serial:arr.length+1}); try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){} pump(); },
  setUpdateListener(cb,s){ listener=cb; seen=s||0; pump(); return Promise.resolve(); }
 };
 window.addEventListener('storage',e=>{ if(e.key===KEY) pump(); });
}
const IS_DEMO=!window.webxdc;
if(IS_DEMO) installMock();
const wx=window.webxdc;
const SELF=wx.selfAddr||'self@example.com';
const SELF_NAME=(wx.selfName||SELF.split('@')[0]||'').slice(0,60);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymdhm=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const hms=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2,14);
let DEVICE_ID=(()=>{try{const stored=localStorage.getItem('chatt_device_id');if(stored&&/^[A-Za-z0-9-]{8,120}$/.test(stored))return stored;const id=uid();localStorage.setItem('chatt_device_id',id);return id;}catch(e){return uid();}})();
let lastTs=0; const nextTs=()=> (lastTs=Math.max(Date.now(),lastTs+1));
const LS_PWD='chatt_admin_pwd', LS_TAP='chatt_tap_count', LS_NAME='chatt_display_name', LS_VENUE_SEL='chatt_venue_sel', LS_ISSUED='chatt_issued_persons';
const OUTBOX='chatt_outbox'; let pending=[];try{pending=JSON.parse(localStorage.getItem(OUTBOX)||'[]');if(!Array.isArray(pending))pending=[];}catch(e){}
const storePending=()=>{try{localStorage.setItem(OUTBOX,JSON.stringify(pending));return true;}catch(e){toast(T('端末内保存に失敗しました。記録をCSVで退避してください'));return false;}};
const getPwd=()=>{ try{return localStorage.getItem(LS_PWD)||'secret';}catch(e){return 'secret';} };
const getTapCount=()=>{ try{const v=parseInt(localStorage.getItem(LS_TAP)||'1',10); return isNaN(v)||v<1?1:Math.min(v,10);}catch(e){return 1;} };
const getMyName=()=>{ try{return localStorage.getItem(LS_NAME)||SELF_NAME;}catch(e){return SELF_NAME;} };
const setMyName=n=>{ try{localStorage.setItem(LS_NAME,n);}catch(e){} };

function normStr(s,n){return typeof s==='string'&&s.length>0&&s.length<=n;}
function normPerson(p){
 if(!p||typeof p!=='object'||Array.isArray(p)) return null;
 const out={};
 const fields=['industry','company','dept','role','name','address','tel','email','gender'];
 for(const k of fields){ out[k]=typeof p[k]==='string'?p[k].slice(0,200):''; }
 const age=String(p.age??'').trim();out.age=/^\d{1,3}$/.test(age)&&Number(age)<=120?String(Number(age)):'';
 if(!['','男性','女性','その他','回答しない'].includes(out.gender))out.gender='';
 for(const [key,max]of [['householdId',120],['householdName',100],['householdRole',60]]){if(typeof p[key]==='string'&&p[key].trim())out[key]=p[key].trim().slice(0,max);}
 const notes=typeof p.notes==='string'?p.notes.slice(0,2000).replace(/\r\n?/g,'\n'):'';if(notes.trim())out.notes=notes;
 if(!out.name.trim()) return null; if(typeof p.personId==='string'&&p.personId.length<=120)out.personId=p.personId;
 return out;
}
function normEvent(p){
 if(!p||typeof p!=='object'||p.v!==1) return null;
 if(!normStr(p.id,120)||!normStr(p.by,200)||typeof p.ts!=='number'||!Number.isSafeInteger(p.ts)||p.ts<0||p.ts>8640000000000000) return null;
 const e={v:1,k:p.k,id:p.id,ts:p.ts,by:p.by};
 if(p.k==='hello'){ if(!normStr(p.a,200)) return null; e.a=p.a; e.n=typeof p.n==='string'?p.n.slice(0,60):''; }
 else if(p.k==='log'){
  if(!normStr(p.a,200)) return null; e.a=p.a; e.n=typeof p.n==='string'?p.n.slice(0,60):''; e.venue=typeof p.venue==='string'?p.venue.slice(0,60):'main'; if(!['in','out','outing','return','discharge'].includes(p.action))return null;e.action=p.action;
  e.deviceId=normStr(p.deviceId,120)?p.deviceId:'';e.deviceName=typeof p.deviceName==='string'?p.deviceName.slice(0,60):'';
  e.person=normPerson(p.person); if(!e.person) return null;
 }
 else if(p.k==='catalog'){
  if(!['booth','supply'].includes(p.category)||!normStr(p.targetId,120)||!['add','remove'].includes(p.op))return null;
  e.category=p.category;e.targetId=p.targetId;e.op=p.op;e.name=typeof p.name==='string'?p.name.slice(0,80):'';e.unit=p.category==='supply'&&typeof p.unit==='string'?p.unit.slice(0,20):'';if(p.op==='add'&&!e.name.trim())return null;
 }
 else if(p.k==='activity'){
  if(!normStr(p.a,200)||!['booth','supply'].includes(p.category)||!normStr(p.targetId,120)||!normStr(p.targetName,80))return null;
  e.a=p.a;e.n=typeof p.n==='string'?p.n.slice(0,60):'';e.category=p.category;e.action=p.category==='booth'?'participate':'receive';e.targetId=p.targetId;e.targetName=p.targetName;e.quantity=p.category==='booth'?1:p.quantity;
  if(!Number.isInteger(e.quantity)||e.quantity<1||e.quantity>10000)return null;e.unit=p.category==='supply'&&typeof p.unit==='string'?p.unit.slice(0,20):'';e.venue=typeof p.venue==='string'?p.venue.slice(0,60):'main';e.deviceId=normStr(p.deviceId,120)?p.deviceId:'';e.deviceName=typeof p.deviceName==='string'?p.deviceName.slice(0,60):'';e.person=normPerson(p.person);if(!e.person)return null;
 }
 else if(p.k==='person'){e.person=normPerson(p.person);if(!e.person||!normStr(e.person.personId,120))return null;}
 else if(p.k==='venue'){ if(!normStr(p.venueId,60)) return null; e.venueId=p.venueId; e.name=typeof p.name==='string'?p.name.slice(0,60):''; e.op=['add','update','remove'].includes(p.op)?p.op:'add'; }
 else if(p.k==='clear'){ }
 else return null;
 return e;
}
function derive(){
 const evs=[...S.events.values()].sort((a,b)=>(a.ts-b.ts)|| a.by.localeCompare(b.by) || a.id.localeCompare(b.id));
 const members=Object.create(null); const venues=new Map(DEFAULT_VENUES.map(v=>[v.id,{...v}])); const persons=new Map(),catalog=new Map();let logs=[],activities=[];
 const ensureMember=(addr,name,ts)=>{ const m=members[addr]||(members[addr]={addr,name:name||addr,lastSeen:0}); if(name) m.name=name; if(ts) m.lastSeen=Math.max(m.lastSeen,ts); };
 for(const e of evs){
  if(e.k==='hello') ensureMember(e.a,e.n,e.ts);
  else if(e.k==='person'){persons.set(e.person.personId,e.person);}
  else if(e.k==='catalog'){const key=targetKey(e);if(e.op==='remove')catalog.delete(key);else catalog.set(key,{category:e.category,targetId:e.targetId,name:e.name,unit:e.unit});}
  else if(e.k==='activity'){ensureMember(e.a,e.n,e.ts);activities.push(e);}
  else if(e.k==='log'){ ensureMember(e.a,e.n,e.ts); logs.push(e); }
  else if(e.k==='venue'){ if(e.op==='remove') venues.delete(e.venueId); else venues.set(e.venueId,{id:e.venueId,name:e.name||e.venueId}); }
  else if(e.k==='clear'){ logs=[];activities=[]; for(const k of Object.keys(members)) delete members[k]; }
 }
 const devices=new Map();for(const l of [...logs,...activities].sort((a,b)=>a.ts-b.ts)){const key=deviceKey(l);devices.set(key,{key,id:l.deviceId||'',name:l.deviceName||l.n||'名称未設定',legacy:!l.deviceId,account:l.a});}
 const logsDesc=[...logs].sort((a,b)=>b.ts-a.ts);
 const personStatus=new Map();
 for(const l of logs){
  const key=l.person.personId||JSON.stringify([l.person.email,l.person.name,l.person.company]);
  const cur=personStatus.get(key);
  personStatus.set(key,l);
 }
 const inside=[...personStatus.values()].filter(l=>isPresent(l.action));
 const todayStr=ymd(S.now); const todayLogs=logs.filter(l=>ymd(new Date(l.ts))===todayStr);
 return {members,persons,devices,catalog,activities,venues:[...venues.values()],venueMap:venues,logs,logsDesc,personStatus,inside,todayLogs,evs};
}
function send(payload){
 const ev={...payload,id:uid(),ts:nextTs(),by:SELF,v:1},norm=normEvent(ev);if(!norm)return false;
 pending.push(norm);if(!storePending()){pending.pop();return false;}S.events.set(norm.id,norm);scheduleEventCache();flushPending();S.dirty=true;renderSoon();return true;
}
let flushing=false,nextSend=0;
async function flushPending(){
 if(flushing||!pending.length||Date.now()<nextSend)return;
 flushing=true;const batch=[],limit=Math.max(1024,Number(wx.sendUpdateMaxSize)||128000);for(const item of pending){const trial=[...batch,item];if(new TextEncoder().encode(JSON.stringify({payload:{v:1,k:'batch',events:trial}})).length>limit)break;batch.push(item);if(batch.length>=20)break;}if(!batch.length){flushing=false;toast(T('送信サイズ上限により共有できません。バックアップを保存してください'));return;}nextSend=Date.now()+Math.max(1000,Number(wx.sendUpdateInterval)||10000);
 try{await wx.sendUpdate({payload:{v:1,k:'batch',events:batch}},'');pending=pending.filter(e=>!batch.some(b=>b.id===e.id));storePending();}
 catch(e){toast(T('未送信記録を保持しています。接続後に再送します'));}finally{flushing=false;document.querySelectorAll('[data-pending-count]').forEach(el=>el.textContent=String(pending.length));}
}

function playScanSound(){

 if(audio.state==='running')play();else Promise.resolve(audio.resume()).then(play).catch(()=>{});
}

function drawBar(canvas,labels,datasets){
 if(!canvas) return; const dpr=window.devicePixelRatio||1; const rect=canvas.getBoundingClientRect(); const w=rect.width||360, h=220; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
 ctx.clearRect(0,0,w,h);
 datasets.forEach((ds,i)=>{ctx.fillStyle=ds.color;ctx.fillRect(40+i*95,3,10,10);ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.fillText(ds.label,54+i*95,13);});
 const pad={t:26,r:10,b:28,l:28}; const chartW=w-pad.l-pad.r, chartH=h-pad.t-pad.b;
 let max=1; for(const ds of datasets) for(const v of ds.values) max=Math.max(max,v); max=Math.ceil(max*1.2)||1;
 ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1; for(let i=0;i<=4;i++){ const y=pad.t+chartH*i/4; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
 const groupW=chartW/Math.max(1,labels.length); const barGap=4; const dsCount=datasets.length; const barW=Math.max(2,(groupW-10-barGap*(dsCount-1))/dsCount);
 for(let i=0;i<labels.length;i++){
  const x0=pad.l+i*groupW+5;
  for(let j=0;j<datasets.length;j++){
   const v=datasets[j].values[i]||0; const bh=chartH*(v/max); const x=x0+j*(barW+barGap); const y=pad.t+chartH-bh;
   ctx.fillStyle=datasets[j].color; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,barW,bh,4); else ctx.rect(x,y,barW,bh); ctx.fill();
  }
 }
 ctx.fillStyle='#64748b'; ctx.font='10px ui-sans-system'; ctx.textAlign='center';
 for(let i=0;i<labels.length;i++){ const x=pad.l+i*groupW+groupW/2; const limit=Number(canvas.dataset.labelLimit)||6;const txt=labels[i].length>limit?labels[i].slice(0,limit)+'…':labels[i]; ctx.fillText(txt,x,h-4); }
 ctx.textAlign='left'; ctx.fillText(String(max),pad.l,pad.t+8);
}

function cameraErrorMessage(error){const name=error?.name||'Error',raw=error?.message||T('詳細不明');let hint;if(['NotAllowedError','PermissionDeniedError','SecurityError'].includes(name)||/permission|denied/i.test(raw))hint=T('カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。');else if(['NotFoundError','DevicesNotFoundError'].includes(name))hint=T('利用できるカメラが見つかりません。画像選択・写真撮影を試してください。');else if(['NotReadableError','TrackStartError'].includes(name))hint=T('カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。');else if(name==='CameraUnavailable')hint=T('この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。');else hint=T('カメラを開始できません。再試行または画像選択・写真撮影を試してください。');return hint+'［'+name+': '+raw+'］';}
async function initScanner(){
 const video=document.getElementById('scanner-video');if(!video||!S.ui.showScanner||S.scannerStop||S.ui.scannerSource==='image')return;
 const generation=++scanGeneration;let stream=null,rafId=null,stopped=false,timer=null;
 const stop=()=>{stopped=true;clearTimeout(timer);cancelAnimationFrame(rafId);if(stream)stream.getTracks().forEach(t=>t.stop());if(video.srcObject===stream)video.srcObject=null;};S.scannerStop=stop;

 try{
 if(!navigator.mediaDevices?.getUserMedia){const e=new Error('getUserMedia unavailable; secureContext='+String(window.isSecureContext));e.name='CameraUnavailable';throw e;}
 timer=setTimeout(()=>{if(!stopped&&generation===scanGeneration&&!stream)scannerMessage('camera',T('カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。'));},12000);
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}catch(error){if(!['OverconstrainedError','ConstraintNotSatisfiedError','TypeError'].includes(error.name)||stopped)throw error;stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});}
 clearTimeout(timer);if(stopped||generation!==scanGeneration||!video.isConnected){stop();return;}video.srcObject=stream;await video.play();
 if(stopped||generation!==scanGeneration||!video.isConnected){stop();return;}scannerMessage('camera',T('カメラで読取中です。QR全体を枠内に入れてください。'));
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 let lastCode='',lastRead=0,lastFrame=0;const tick=()=>{if(stopped)return;try{const now=Date.now();if(now-lastFrame>=160&&video.readyState>=2&&video.videoWidth){lastFrame=now;const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height),res=jsQR(img.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(res&&(res.data!==lastCode||now-lastRead>2500)){lastCode=res.data;lastRead=now;if(handleScanned(res.data))return;scannerMessage('camera',document.getElementById('toast')?.textContent||T('QRを確認しましたが記録できませんでした。'),true);}}}catch(e){scannerMessage('camera',T('読取処理: ')+e.message,true);}if(!stopped)rafId=requestAnimationFrame(tick);};tick();
 }catch(e){stop();if(generation===scanGeneration&&S.ui.showScanner){scannerMessage('camera',cameraErrorMessage(e),true);toast(T('ライブカメラを開始できません。画面の説明と画像読取をご利用ください'));}}
}

function loadImageFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error(T('画像ファイルを読み込めません。別の場所に保存して選び直してください')));reader.onabort=()=>reject(new Error(T('画像の読み込みを中止しました')));reader.onload=()=>{const img=new Image();img.onload=()=>img.naturalWidth&&img.naturalHeight?resolve(img):reject(new Error(T('画像のサイズを取得できません')));img.onerror=()=>reject(new Error(T('この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）')));img.src=reader.result;};reader.readAsDataURL(file);});}
async function decodeImageQR(img,active,progress){const w=img.naturalWidth,h=img.naturalHeight;if(w*h>100000000)throw new Error(T('画像が大きすぎます。QR周辺を切り抜いて選び直してください'));const regions=[{x:0,y:0,w,h,max:1280,up:1},{x:0,y:0,w,h,max:2048,up:2}];if(Math.max(w,h)>1600)for(const y of [0,.4])for(const x of [0,.4])regions.push({x:Math.round(w*x),y:Math.round(h*y),w:Math.round(w*.6),h:Math.round(h*.6),max:1600,up:1});const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw new Error(T('画像解析用の描画機能を使えません'));for(let i=0;i<regions.length;i++){if(!active())return null;progress(i+1,regions.length);await new Promise(resolve=>setTimeout(resolve,0));if(!active())return null;const r=regions[i],scale=Math.min(r.up,r.max/Math.max(r.w,r.h));canvas.width=Math.max(1,Math.round(r.w*scale));canvas.height=Math.max(1,Math.round(r.h*scale));ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,r.x,r.y,r.w,r.h,0,0,canvas.width,canvas.height);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height),result=jsQR(pixels.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(result?.data)return result.data;}return null;}
async function readQRImage(file){if(!file||!S.ui.showScanner)return;S.ui.scannerSource='image';stopScanner();const generation=++imageReadGeneration,active=()=>generation===imageReadGeneration&&S.ui.showScanner;scannerMessage('camera',T('画像を解析しています。ライブカメラは停止中です。'));scannerMessage('image',T('画像を読み込んでいます…'));document.getElementById('scanner-image-status')?.scrollIntoView({block:'nearest'});try{if(file.size>50*1024*1024)throw new Error(T('画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります'));const img=await loadImageFile(file);if(!active())return;const text=await decodeImageQR(img,active,(n,total)=>scannerMessage('image',T('QRを解析しています（')+n+'/'+total+'）…'));if(!active())return;if(!text)throw new Error(T('QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください'));if(!handleScanned(text)){const reason=document.getElementById('toast')?.textContent||'登録情報または記録区分を確認してください';scannerMessage('image',T('QR読取済み・記録なし：')+reason,true);}}catch(e){if(active()){const message=e?.message||'画像を読み取れませんでした。PNGまたはJPEGで選び直してください';scannerMessage('image',T('画像読取失敗：')+message,true);toast(T('画像読取失敗。画像選択欄の説明を確認してください'));}}}

 for(const l of logs){ const d=new Date(l.ts); rows.push([String(l.ts),ymd(d),hm(d),l.a,l.n,l.deviceId||'',l.deviceName||l.n||'',l.venue,view.venueMap.get(l.venue)?.name||l.venue,l.action,l.person.personId||'',l.person.age||'',l.person.gender||'',l.person.industry,l.person.company,l.person.dept,l.person.role,l.person.name,l.person.address,l.person.tel,l.person.email,l.person.notes||'',l.person.householdId||'',l.person.householdName||'',l.person.householdRole||'']); }

document.getElementById('app').addEventListener('click',ev=>{
 const el=ev.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
 if(handleScannerAction(act,el))return;if(handleUsageAction(act,el))return;if(handleReissueAction(act,el))return;if(handleShelterAction(act,el))return;if(handleCgiAction(act))return;
 if(handleServiceAction(act,el))return;
 switch(act){
  case 'brand-tap':{ const now=Date.now(); S.ui.tapBuffer=S.ui.tapBuffer.filter(t=>now-t<2000); S.ui.tapBuffer.push(now); if(S.ui.tapBuffer.length>=S.ui.tapCount){ S.ui.tapBuffer=[]; S.ui.showPwd=true; S.ui.pwdInput=''; renderNow(); } break; }
  case 'admin-login':S.ui.showPwd=true;S.ui.pwdInput='';renderNow();break;
  case 'exit-admin':try{sessionStorage.setItem('chatt_role','member');}catch(e){} S.ui.isAdmin=false; renderNow(); break;
  case 'atab': S.ui.adminTab=el.dataset.v; renderNow(); break;
  case 'report-print':if(S.ui.isAdmin)openReport();break;
  case 'report-save':if(S.ui.isAdmin)saveReport();break;
  case 'group': S.ui.groupBy=el.dataset.v; renderNow(); break;
  case 'new-person':S.ui.personForm={industry:'',company:'',dept:'',role:'',name:'',address:'',tel:'',email:'',notes:''};S.ui.lastGeneratedContent='';renderNow();break;
  case 'gen-qr':{
   syncPersonFormFromDOM();
   if(!S.ui.personForm.householdId&&(S.ui.personForm.householdName?.trim()||S.ui.personForm.householdRole?.trim())){toast(T('世帯を選択するか、新しい世帯IDを作成してください'));break;}
