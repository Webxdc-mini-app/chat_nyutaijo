activitySearch)}"></div>${data.invalid?H('<p role="alert">開始日は終了日以前を指定してください</p>'):''}<div class="status-grid" style="margin-top:14px"><div class="stat"><div class="k">対象の実人数</div><div class="v" id="activity-people">${data.people}</div></div><div class="stat"><div class="k">ブース参加記録</div><div class="v" id="activity-booths">${data.logs.filter(l=>l.category==='booth').length}</div></div><div class="stat"><div class="k">物資受取記録</div><div class="v" id="activity-supplies">${data.logs.filter(l=>l.category==='supply').length}</div></div></div><div class="hint">入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。</div><div style="overflow:auto;margin-top:16px" id="activity-summary">${activitySummaryTable(data)}</div><div class="canvas-wrap" style="margin-top:16px"><h3>ブース・物資ごとの記録件数</h3><canvas id="activity-chart"></canvas></div><h3 class="h2" style="margin-top:16px">履歴 ${data.logs.length}件</h3><div class="list" style="margin-top:10px">${data.logs.slice(-200).reverse().map(l=>renderActivityItem(view,l)).join('')||H('<div class="empty">該当なし</div>')}</div><div class="hint">履歴表示は最新200件、CSVとレポートには対象全件を出力します。</div></div>`;}
function renderActivityChart(view){const data=activityData(view),rows=data.groups.slice(0,12);drawBar(document.getElementById('activity-chart'),rows.map(g=>g.targetName),[{label:T('記録件数'),values:rows.map(g=>g.records),color:'#6366f1'}]);}
function activityScope(view){return M`${S.ui.activityFrom||T('制限なし')} 〜 ${S.ui.activityTo||T('制限なし')} ／ 会場：${S.ui.activityVenue==='all'?T('すべて'):displayVenueName(view.venueMap.get(S.ui.activityVenue))||S.ui.activityVenue} ／ 端末：${S.ui.activityTerminal==='all'?T('すべて'):deviceLabel(view.devices.get(S.ui.activityTerminal))} ／ 種類：${S.ui.activityCategory==='all'?T('すべて'):S.ui.activityCategory==='booth'?T('ブース'):T('物資')} ／ 対象：${S.ui.activityTarget==='all'?T('すべて'):activityTargets(view).find(t=>targetKey(t)===S.ui.activityTarget)?.name||S.ui.activityTarget} ／ 検索：${S.ui.activitySearch||T('なし')}`;}
function activityReportHTML(){const view=derive(),data=activityData(view);if(data.invalid){toast(T('期間を確認してください'));return null;}return H`<!doctype html><html lang="ja"><head><meta charset="UTF-8"><title>参加・受取レポート</title><style>@page{size:A4 landscape;margin:12mm}body{font:13px/1.6 sans-serif;color:#111;margin:24px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:6px;text-align:left;overflow-wrap:anywhere}th{background:#eef2ff}tr{break-inside:avoid}thead{display:table-header-group}button{padding:12px}@media print{button{display:none}body{margin:0}h2{break-after:avoid}}</style></head><body><button onclick="window.print()">印刷 / PDFとして保存</button><h1>ブース参加・物資受取レポート</h1><p>作成：${esc(ymdhm(new Date()))}</p><p>集計条件：${esc(activityScope(view))}</p><p>実人数 ${data.people}人 ／ 記録 ${data.logs.length}件</p><p>人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。</p>${activitySummaryTable(data)}<h2>履歴</h2><table><thead><tr><th>日時</th><th>氏名・人物ID</th><th>種類・名称</th><th>数量</th><th>会場</th><th>端末名・ID</th></tr></thead><tbody>${data.logs.map(l=>H`<tr><td>${esc(ymdhm(new Date(l.ts)))}</td><td>${esc(l.person.name)}<br>${esc(l.person.personId||'')}</td><td>${l.category==='booth'?T('参加'):T('受取')}：${esc(l.targetName)}</td><td>${l.category==='supply'?l.quantity+esc(l.unit||T('個')):T('1件')}</td><td>${esc(displayVenueName(view.venueMap.get(l.venue))||l.venue)}</td><td>${esc(l.deviceName||l.n)}<br>${esc(l.deviceId||T('端末未識別'))}</td></tr>`).join('')}</tbody></table></body></html>`;}
async function saveFile(blob,name){if(wx.sendToChat){await wx.sendToChat({file:{name,blob}});}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}}
function exportActivityCsv(){const view=derive(),data=activityData(view);if(data.invalid){toast('期間を確認してください');return;}const rows=[['recordId','timestamp','category','targetId','targetName','quantity','unit','personId','personName','notes','venueId','venueName','deviceId','deviceName','scannerAddr','scannerName']];for(const l of data.logs)rows.push([l.id,l.ts,l.category,l.targetId,l.targetName,l.quantity,l.unit,l.person.personId||'',l.person.name,l.person.notes||'',l.venue,view.venueMap.get(l.venue)?.name||l.venue,l.deviceId,l.deviceName,l.a,l.n]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"').join(',')).join('\r\n');saveFile(new Blob([csv],{type:'text/csv;charset=utf-8'}),'chatt-activity-'+ymd(new Date())+'.csv').catch(e=>toast('CSV出力失敗: '+e.message));}
function handleServiceAction(act,el){
 if(act==='transfer-open'){S.ui.showTransfer=true;S.ui.transferPreview=null;S.ui.transferError='';S.ui.transferIdentity=false;S.ui.transferSettings=true;renderNow();return true;}
 if(act==='transfer-close'){transferReadGeneration++;S.ui.showTransfer=false;renderNow();return true;}
 if(act==='backup-export'){exportBackup().catch(e=>toast(T('バックアップ作成失敗: ')+e.message));return true;}
 if(act==='transfer-apply'){applyTransfer();return true;}
 if(act==='pin-open-catalog'){if(S.ui.isAdmin){S.ui.adminTab='targets';renderNow();}return true;}
 if(act==='pin-add'){const selected=document.querySelector('[data-f=pinTarget]'),quantityInput=document.querySelector('[data-f=pinQuantity]');if(selected)S.ui.pinTarget=selected.value;if(quantityInput)S.ui.pinQuantity=quantityInput.value;const target=derive().catalog.get(S.ui.pinTarget);if(!target){toast(T('対象を選択してください'));return true;}const quantity=target.category==='booth'?1:Number(S.ui.pinQuantity);if(!Number.isInteger(quantity)||quantity<1||quantity>10000){toast(T('数量は1〜10000の整数にしてください'));return true;}const pins=S.ui.fixedScans.filter(p=>targetKey(p)!==targetKey(target));if(pins.length>=12){toast(T('専用ボタンは12個までです'));return true;}pins.push({category:target.category,targetId:target.targetId,quantity,label:target.name,unit:target.unit});if(savePins(pins)){renderNow();toast(T('この端末の専用ボタンを保存しました'));}return true;}
 if(act==='pin-remove'){if(savePins(S.ui.fixedScans.filter(p=>targetKey(p)!==el.dataset.key)))renderNow();return true;}
 if(act==='fixed-scan'){const target=derive().catalog.get(el.dataset.key),pin=S.ui.fixedScans.find(p=>targetKey(p)===el.dataset.key);if(!target||!pin){toast(T('対象が削除されているため使用できません'));return true;}S.ui.scanContext={category:target.category,targetId:target.targetId,targetName:target.name,quantity:pin.quantity,unit:target.unit};prepareScanAudio();S.ui.scannerSource='live';S.ui.showScanner=true;renderNow();return true;}
 if(['catalog-add','catalog-remove','catalog-examples'].includes(act)){if(!S.ui.isAdmin){toast(T('管理者画面から操作してください'));return true;}const view=derive();if(act==='catalog-add'){const name=S.ui.catalogName.trim();if(!name){toast(T('名称を入力してください'));return true;}if([...view.catalog.values()].some(t=>t.category===S.ui.catalogCategory&&t.name===name)){toast(T('同じ種類と名称は登録済みです'));return true;}if(send({k:'catalog',op:'add',category:S.ui.catalogCategory,targetId:uid(),name,unit:S.ui.catalogCategory==='supply'?(S.ui.catalogUnit.trim()||'個'):''})){S.ui.catalogName='';renderNow();toast(T('登録しました'));}}else if(act==='catalog-remove'){const target=view.catalog.get(el.dataset.key);if(target&&send({k:'catalog',op:'remove',...target})){renderNow();toast(T('リストから削除しました。過去の履歴は残ります'));}}else{for(const [name,unit] of [['食料','食'],['水','本'],['ミルク','缶'],['オムツ','枚']])if(![...view.catalog.values()].some(t=>t.category==='supply'&&t.name===name))send({k:'catalog',op:'add',category:'supply',targetId:uid(),name,unit});renderNow();}return true;}
 if(['activity-csv','activity-print','activity-save'].includes(act)){if(!S.ui.isAdmin)return true;if(act==='activity-csv')exportActivityCsv();else{const html=activityReportHTML();if(html){if(act==='activity-print'){const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}else toast(T('別画面を開けません。レポートHTMLを保存してください'));}else saveFile(new Blob([html],{type:'text/html;charset=utf-8'}),'chatt-activity-report.html').catch(e=>toast(T('出力失敗: ')+e.message));}}return true;}
 return false;
}
function handleServiceInput(field,value,node){
 if(field==='pinTarget'){S.ui.pinConfigOpen=true;S.ui.pinTarget=value;const fieldNode=document.getElementById('pin-quantity-field');if(fieldNode)fieldNode.innerHTML=renderPinQuantity(derive().catalog.get(value));return true;}
 if(field==='catalogCategory'){S.ui[field]=value;renderNow();return true;}
 if(['pinQuantity','catalogName','catalogUnit'].includes(field)){S.ui[field]=value;return true;}
 if(['transferSettings','transferIdentity'].includes(field)){S.ui[field]=node.checked;return true;}
 if(['activityFrom','activityTo','activityVenue','activityTerminal','activityCategory','activityTarget','activitySearch'].includes(field)){const position=node.selectionStart;S.ui[field]=value;renderNow();if(field==='activitySearch'){const input=document.querySelector('[data-f="activitySearch"]');input?.focus();input?.setSelectionRange(position,position);}return true;}
 return false;
}

const EVENT_CACHE_KEY='chatt_event_cache_v1';let cacheTimer=null,cacheWarning=false,transferReadGeneration=0;
function scheduleEventCache(){if(cacheTimer)return;cacheTimer=setTimeout(()=>{cacheTimer=null;persistEventCache();},100);}
function persistEventCache(){try{localStorage.setItem(EVENT_CACHE_KEY,JSON.stringify([...S.events.values()]));cacheWarning=false;return true;}catch(e){if(!cacheWarning){cacheWarning=true;toast(T('履歴の端末内保存に空きがありません。バックアップを保存してください'));}return false;}}
function loadEventCache(){try{const list=JSON.parse(localStorage.getItem(EVENT_CACHE_KEY)||'[]');return Array.isArray(list)?list:[];}catch(e){return [];}}
window.addEventListener('pagehide',()=>{if(cacheTimer){clearTimeout(cacheTimer);cacheTimer=null;persistEventCache();}});
document.getElementById('app').addEventListener('toggle',e=>{if(e.target.id==='pin-config')S.ui.pinConfigOpen=e.target.open;},true);
function hashText(text,seed=2166136261){let hash=seed;for(const byte of new TextEncoder().encode(text)){hash^=byte;hash=Math.imul(hash,16777619);}return (hash>>>0).toString(16).padStart(8,'0');}
function stableImportId(text){return hashText(text)+hashText(text,2246822519);}
function backupDocument(){const events=[...S.events.values()];for(const e of pending)if(!events.some(p=>p.id===e.id))events.push(e);const payload={events,settings:{displayName:getMyName(),venue:S.ui.venueSel,soundEnabled:S.ui.soundEnabled,language:displayLanguage,usageMode:S.ui.usageMode,fixedScans:S.ui.fixedScans},device:{id:DEVICE_ID,name:getMyName()}};return {format:'chat-nyutaijo-backup',schema:1,appVersion:'1.6.0',createdAt:new Date().toISOString(),payload,checksum:{algorithm:'fnv1a32',value:hashText(JSON.stringify(payload))}};}
async function exportBackup(){const doc=backupDocument();await saveFile(new Blob([JSON.stringify(doc,null,2)],{type:'application/json;charset=utf-8'}),'chat-nyutaijo-backup-'+ymd(new Date())+'-'+DEVICE_ID.slice(-8)+'.json');}
function normalizeTransfer(input){
 if(!input||input.format!=='chat-nyutaijo-backup'||input.schema!==1||!input.payload||!Array.isArray(input.payload.events))throw Error(T('対応するバックアップ形式ではありません'));
 if(input.payload.events.length>100000)throw Error(T('履歴イベントは10万件までです'));
 if(input.checksum){if(input.checksum.algorithm!=='fnv1a32'||input.checksum.value!==hashText(JSON.stringify(input.payload)))throw Error(T('ファイルの内容が破損または変更されています'));}
 const unique=new Map();for(const raw of input.payload.events){const ev=normEvent(raw);if(!ev)throw Error(T('不正な履歴イベントが含まれています'));if(unique.has(ev.id)&&JSON.stringify(unique.get(ev.id))!==JSON.stringify(ev))throw Error(T('同じIDに異なる記録が含まれています'));unique.set(ev.id,ev);}
 const source=input.payload.settings||{},device=input.payload.device||{};
 return {events:[...unique.values()],settings:{displayName:typeof source.displayName==='string'?source.displayName.slice(0,60):'',venue:typeof source.venue==='string'?source.venue.slice(0,60):'main',soundEnabled:source.soundEnabled!==false,language:DISPLAY_LANGUAGES.some(l=>l.code===source.language)?source.language:null,usageMode:['event','shelter'].includes(source.usageMode)?source.usageMode:null,fixedScans:normalizePins(source.fixedScans)},device:{id:typeof device.id==='string'&&/^[A-Za-z0-9-]{8,120}$/.test(device.id)?device.id:'',name:typeof device.name==='string'?device.name.slice(0,60):''},createdAt:typeof input.createdAt==='string'?input.createdAt:'不明',sourceVersion:typeof input.appVersion==='string'?input.appVersion:'不明'};
}
function parseCsv(text){const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else quoted=false;}else cell+=c;}else if(c==='"'){if(cell)throw Error(T('CSVの引用符の形式が不正です'));quoted=true;}else if(c===','){row.push(cell);cell='';}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push([...row]);row.length=0;cell='';}else cell+=c;}if(quoted)throw Error(T('CSVの引用符が閉じられていません'));row.push(cell);if(row.some(v=>v!==''))rows.push([...row]);return rows;}
function transferFromCsv(text){
 const rows=parseCsv(text.replace(/^\ufeff/,''));if(!rows.length)throw Error(T('CSVが空です'));const headers=rows.shift();if(!['timestamp','action','personName'].every(h=>headers.includes(h)))throw Error(T('入退場CSVではありません。参加・受取CSVの移行にはJSONバックアップを使ってください'));if(rows.length>100000)throw Error(T('CSVは10万行までです'));const events=[],profiles=new Set(),occurrences=new Map();for(const [index,cells] of rows.entries()){if(cells.length!==headers.length)throw Error('CSV '+(index+2)+T('行目の列数が不正です'));const r=Object.fromEntries(headers.map((key,i)=>[key,cells[i]]));const ts=Number(r.timestamp);if(!/^\d+$/.test(r.timestamp)||!Number.isSafeInteger(ts)||ts<0||ts>8640000000000000||!['in','out','outing','return','discharge'].includes(r.action)||!r.personName.trim())throw Error('CSV '+(index+2)+T('行目の日時・区分・氏名が不正です'));const person=normPerson({name:r.personName,company:r.company||'',industry:r.industry||'',dept:r.dept||'',role:r.role||'',address:r.address||'',tel:r.tel||'',email:r.email||'',age:r.age||'',gender:r.gender||'',notes:r.notes||'',householdId:r.householdId||'',householdName:r.householdName||'',householdRole:r.householdRole||'',personId:r.personId||'csv-'+stableImportId(JSON.stringify([r.personName,r.company||'',r.email||'']))});if(!person)throw Error(T('CSVの人物情報が不正です'));const profileId='csv-person-'+stableImportId(JSON.stringify(person)+':'+ts);if(!profiles.has(profileId)){profiles.add(profileId);events.push({v:1,k:'person',id:profileId,by:'csv-import',ts,person});}
 const base={v:1,k:'log',ts,by:'csv-import',a:r.scannerAddr||'csv-import',n:r.scannerName||'',venue:r.venue||'main',action:r.action,person,deviceId:r.deviceId||'',deviceName:r.deviceName||r.scannerName||''},fingerprint=JSON.stringify(base),count=(occurrences.get(fingerprint)||0)+1;occurrences.set(fingerprint,count);events.push({...base,id:'csv-log-'+stableImportId(fingerprint)+'-'+count});
 if(r.venue&&r.venueName){const venue={v:1,k:'venue',by:'csv-import',ts,op:'add',venueId:r.venue,name:r.venueName};events.push({...venue,id:'csv-venue-'+stableImportId(JSON.stringify(venue))});}
 }
 const imported=normalizeTransfer({format:'chat-nyutaijo-backup',schema:1,appVersion:'旧版入退場CSV',payload:{events}});imported.isCsv=true;return imported;
}
function checkTransferConflicts(preview){for(const event of preview.events){const current=S.events.get(event.id);if(current&&JSON.stringify(current)!==JSON.stringify(event))throw Error(T('既存の同じIDと内容が異なるため取り込めません: ')+event.id);}}
async function readTransferFile(file){if(!file)return;const generation=++transferReadGeneration;S.ui.transferPreview=null;S.ui.transferError=T('ファイルを確認しています');renderNow();try{if(file.size>50*1024*1024)throw Error(T('ファイルは50MB以下にしてください'));const text=await file.text();if(generation!==transferReadGeneration)return;const preview=/\.csv$/i.test(file.name)?transferFromCsv(text):normalizeTransfer(JSON.parse(text.replace(/^\ufeff/,'')));checkTransferConflicts(preview);S.ui.transferPreview=preview;S.ui.transferSettings=!preview.isCsv;S.ui.transferIdentity=false;S.ui.transferError='';}catch(e){if(generation!==transferReadGeneration)return;S.ui.transferError=T('取込できません: ')+e.message;}if(S.ui.showTransfer)renderNow();}
function backupTimeLabel(value){const d=new Date(value);return Number.isFinite(d.getTime())?ymdhm(d):value;}
function renderTransferModal(){if(!S.ui.showTransfer)return '';const p=S.ui.transferPreview,counts=p?{persons:new Set(p.events.filter(e=>e.k==='person').map(e=>e.person.personId)).size,logs:p.events.filter(e=>e.k==='log').length,activities:p.events.filter(e=>e.k==='activity').length,new:p.events.filter(e=>!S.events.has(e.id)).length}:null;return H`<div class="ovl" id="transfer-modal"><div class="bd"></div><div class="sheet"><div class="sh-h"><h2 class="h2">端末データのバックアップ・引き継ぎ</h2><button class="x" data-act="transfer-close">✕</button></div><div class="sh-b"><h3 class="h2">元の端末で保存</h3><p class="hint">人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。</p><button class="btn accent" data-act="backup-export">JSONバックアップを保存・共有</button><h3 class="h2">新しい端末で取り込む</h3><input type="file" data-f="transferFile" accept=".json,.csv,application/json,text/csv"><p class="hint">JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。</p>${S.ui.transferError?H`<p role="status">${esc(S.ui.transferError)}</p>`:''}${p?H`<div style="overflow-wrap:anywhere"><p>元端末：${esc(p.device.name||T('不明'))} ／ 保存日時：${esc(backupTimeLabel(p.createdAt))} ／ 版：${esc(p.sourceVersion)}</p><p>登録人物 ${counts.persons}人 ／ 入退場 ${counts.logs}件 ／ 参加・受取 ${counts.activities}件 ／ 新規履歴イベント ${counts.new}件</p></div>${!p.isCsv?H`<label><input type="checkbox" data-f="transferSettings" ${S.ui.transferSettings?'checked':''}> 端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ</label>${p.device.id?H`<label><input type="checkbox" data-f="transferIdentity" ${S.ui.transferIdentity?'checked':''}> 端末交換として元端末IDも引き継ぐ</label><p class="hint">通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。</p>`:''}`:''}`:''}</div><div class="sh-f"><button class="btn ghost" data-act="transfer-close">閉じる</button>${p?H('<button class="btn primary" data-act="transfer-apply">選択内容を取り込む</button>'):''}</div></div></div>`;}
function applyTransfer(){
 const p=S.ui.transferPreview;if(!p)return;try{checkTransferConflicts(p);const added=p.events.filter(e=>!S.events.has(e.id)),merged=new Map(S.events);for(const event of added)merged.set(event.id,event);const queued=new Map(pending.map(e=>[e.id,e]));for(const e of added)queued.set(e.id,e);const writes=new Map([[EVENT_CACHE_KEY,JSON.stringify([...merged.values()])],[OUTBOX,JSON.stringify([...queued.values()])]]),settings=S.ui.transferSettings&&!p.isCsv?p.settings:null,newId=S.ui.transferIdentity&&p.device.id?p.device.id:DEVICE_ID;
 if(settings?.language)writes.set('chatt_display_language',settings.language);if(settings?.usageMode)writes.set('chatt_usage_mode',settings.usageMode);if(settings){writes.set(LS_NAME,settings.displayName);writes.set(LS_VENUE_SEL,settings.venue);writes.set(SOUND_KEY,settings.soundEnabled?'on':'off');writes.set('chatt_fixed_scans',JSON.stringify(settings.fixedScans));}if(newId!==DEVICE_ID)writes.set('chatt_device_id',newId);
 const originals=new Map([...writes.keys()].map(key=>[key,localStorage.getItem(key)]));try{for(const [key,value]of writes)localStorage.setItem(key,value);}catch(e){for(const [key,value]of originals){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}catch(rollbackError){}}throw Error(T('保存容量不足などにより取込を中止しました。既存データを保持しています'));}
 S.events=merged;pending=[...queued.values()];for(const e of added)lastTs=Math.max(lastTs,e.ts);DEVICE_ID=newId;if(settings){S.ui.displayName=getMyName();S.ui.venueSel=settings.venue;S.ui.soundEnabled=settings.soundEnabled;if(settings.language)displayLanguage=settings.language;if(settings.usageMode)S.ui.usageMode=settings.usageMode;S.ui.scannerAction='in';S.ui.fixedScans=settings.fixedScans;}S.ui.showTransfer=false;S.ui.transferPreview=null;S.ui.showScanner=false;S.ui.scanContext=null;stopScanner();S.dirty=true;renderNow();flushPending();toast(T('引き継ぎ完了：')+added.length+T('件の履歴イベントを追加しました'));
 }catch(e){S.ui.transferError=T('取込できません: ')+e.message;renderNow();}
}

function loadUsageMode(){try{return localStorage.getItem('chatt_usage_mode')==='shelter'?'shelter':'event';}catch(e){return 'event';}}
function isShelterMode(){return S.ui.usageMode==='shelter';}
function usageActions(){return isShelterMode()?['in','outing','return','discharge']:['in','out'];}
function usageActionLabel(action){return action==='in'?(isShelterMode()?T('入所'):T('入場')):action==='out'?T('退場'):logActionLabel(action);}
function renderUsageModeSelector(){return H`<div class="card pad" id="usage-mode-panel"><h2 class="h2">利用モード</h2><label class="label">この端末のボタンレイアウト</label><select class="select" data-f="usageMode"><option value="event" ${!isShelterMode()?'selected':''}>イベント用（入場・退場）</option><option value="shelter" ${isShelterMode()?'selected':''}>避難所用（入所・一時外出・帰所・正式退所）</option></select><p class="hint">端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。</p></div>`;}
function renderAdmissionButtons(){if(!isShelterMode())return H`<div class="grid2" id="event-scan-buttons" style="margin-top:14px"><button class="btn lg" style="background:var(--success);color:#fff" data-act="scan-in">入場としてスキャン</button><button class="btn lg primary" data-act="scan-out">退場としてスキャン</button></div><p class="hint">イベント会場へ入る人は「入場」、会場を出る人は「退場」です。</p>`;return H`<section id="shelter-scan-buttons" style="margin-top:14px"><div class="grid2"><button class="btn lg" style="background:var(--success);color:#fff" data-act="scan-in">入所としてスキャン</button><button class="btn lg primary" data-act="shelter-scan" data-action="return">帰所としてスキャン</button></div><div style="margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:16px"><h3 class="h2">一時的に出かける</h3><button class="btn lg ghost" style="width:100%" data-act="shelter-scan" data-action="outing">一時外出としてスキャン</button><p class="hint">戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。</p></div><div style="margin-top:12px;padding:12px;border:2px solid #b45309;border-radius:16px"><h3 class="h2">避難所の利用を終了する</h3><button class="btn lg" style="width:100%;background:#92400e;color:#fff" data-act="shelter-scan" data-action="discharge">正式退所としてスキャン</button><p class="hint">受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。</p></div></section>`;}
function handleUsageAction(act,el){if(act==='scan-out'&&isShelterMode()){toast(T('避難所では一時外出か正式退所を選んでください'));return true;}return false;}
function handleUsageInput(field,value,node){if(field!=='usageMode')return false;if(!['event','shelter'].includes(value))return true;syncPersonFormFromDOM();S.ui.usageMode=value;S.ui.scannerAction='in';S.ui.scanContext=null;S.ui.showScanner=false;stopScanner();try{localStorage.setItem('chatt_usage_mode',value);}catch(e){toast(T('利用モードを保存できません。この画面内で適用します'));}renderNow();return true;}

function reissueSearchKey(value){return String(value||'').normalize('NFKC').toLowerCase();}
function renderReissueResults(view){const query=reissueSearchKey(S.ui.reissueSearch).trim(),results=query?[...view.persons.values()].filter(p=>[p.name,p.personId,p.householdName,p.householdId,p.company,p.tel,p.email].some(value=>reissueSearchKey(value).includes(query))):[],selected=view.persons.get(S.ui.personForm.personId);return `${query?H`<p class="hint">該当 ${results.length}人${results.length>20?T('（先頭20人を表示。検索を絞り込んでください）'):''}</p><div class="list">${results.slice(0,20).map(p=>H`<div class="item"><div class="main"><div class="name">${esc(p.name)}</div><div class="meta" style="overflow-wrap:anywhere">人物ID：${esc(p.personId)}<br>世帯：${esc(p.householdName||T('未設定'))} ／ 会社：${esc(p.company||T('未設定'))}</div></div><button class="btn sm primary" data-act="reissue-person" data-person="${esc(p.personId)}">同じIDでQRを再発行</button></div>`).join('')||H('<p class="hint">登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。</p>')}</div>`:selected?H`<button class="btn sm primary" data-act="reissue-person" data-person="${esc(selected.personId)}">${esc(selected.name)} さんのQRを同じIDで再発行</button>`:H('<p class="hint">検索するか、下の登録人物欄で人物を選んでください。</p>')}`;}
function renderReissuePanel(view){return H`<section class="card pad" id="qr-reissue-panel" style="margin:12px 0"><h3 class="h2">QRの再発行（紛失・再印刷）</h3><p class="hint">氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。</p><div class="field"><label class="label">再発行する人物を検索</label><input class="input" data-f="reissueSearch" value="${esc(S.ui.reissueSearch||'')}" placeholder="氏名・人物ID・世帯名など"></div><div id="qr-reissue-results">${renderReissueResults(view)}</div><p class="hint">登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。</p></section>`;}
function handleReissueInput(field,value,node){if(field!=='reissueSearch')return false;S.ui.reissueSearch=value;syncPersonFormFromDOM();const results=document.getElementById('qr-reissue-results');if(results)results.innerHTML=renderReissueResults(derive());return true;}
function handleReissueAction(act,el){if(act!=='reissue-person')return false;const person=derive().persons.get(el.dataset.person);if(!person){toast(T('登録情報が見つかりません。同期やバックアップを確認してください'));return true;}const content=makePersonContent(person),probe=document.createElement('div');if(!drawPersonQR(probe,content)){toast(probe.dataset.error||T('QR再発行に失敗しました'));return true;}S.ui.personForm={...person};S.ui.lastGeneratedContent=content;const list=getIssued().filter(p=>p.personId!==person.personId);list.unshift({...person,at:Date.now()});saveIssued(list);S.ui.issuedList=list;if(S.ui.isAdmin)S.ui.adminTab='issue';renderNow();const box=document.getElementById('person-qr-box');if(box){drawPersonQR(box,content);box.scrollIntoView({block:'center'});}toast(person.name+T(' さんのQRを同じIDで再発行しました。保存・印刷できます'));return true;}

function syncPersonFormFromDOM(){const keys=new Set(['industry','company','dept','role','name','address','tel','email','age','gender','notes','householdName','householdRole']);for(const node of document.querySelectorAll('[data-f^="pf-"]')){const key=node.dataset.f.slice(3);if(keys.has(key))S.ui.personForm[key]=node.value;}const name=document.querySelector('[data-f=pf-name]');if(name?.value.trim())name.removeAttribute('aria-invalid');}
function isEntry(action){return action==='in'||action==='return';}
function isPresent(action){return isEntry(action);}
function canonicalLogActionLabel(action){return ({in:'入場・入所',out:'退場（従来）',outing:'一時外出',return:'帰所',discharge:'正式退所'})[action]||'未記録';}
function logActionLabel(action){return ({in:T('入場・入所'),out:T('退場（従来）'),outing:T('一時外出'),return:T('帰所'),discharge:T('正式退所')})[action]||T('未記録');}
function shelterState(action){return isPresent(action)?T('在所中'):action==='outing'?T('一時外出中'):action==='discharge'?T('正式退所済み'):action==='out'?T('退場（区分未確認）'):T('入所未記録');}
function validateShelterAction(person,action){const last=derive().personStatus.get(personKey(person)),previous=last?.action;if(action==='outing'&&!isPresent(previous)){toast(T('一時外出は在所中の人物に記録できます'));return false;}if(action==='return'&&previous!=='outing'){toast(T('帰所は一時外出中の人物に記録できます'));return false;}if(action==='discharge'&&!isPresent(previous)&&previous!=='outing'&&previous!=='out'){toast(T('正式退所の前に入所記録を確認してください'));return false;}if(action==='in'&&previous==='outing'){toast(T('一時外出中です。「帰所」で記録してください'));return false;}return true;}

function householdGroups(view){const groups=new Map();for(const person of view.persons.values()){if(!person.householdId)continue;let g=groups.get(person.householdId);if(!g){g={id:person.householdId,name:person.householdName||'名称未設定',members:[]};groups.set(g.id,g);}g.members.push(person);}return [...groups.values()].sort((a,b)=>a.name.localeCompare(b.name,'ja'));}
function renderHouseholdFields(f){const groups=householdGroups(derive());return H`<div class="field" style="grid-column:1/-1"><label class="label">世帯（任意）</label><select class="select" data-f="householdPick"><option value="">世帯に所属しない</option>${groups.map(g=>H`<option value="${esc(g.id)}" ${f.householdId===g.id?'selected':''}>${esc(g.name)} ／ ${esc(g.id)} (${g.members.length}人)</option>`).join('')}${f.householdId&&!groups.some(g=>g.id===f.householdId)?H`<option value="${esc(f.householdId)}" selected>新規世帯 ／ ${esc(f.householdId)}</option>`:''}</select><div class="row"><button class="btn sm ghost" data-act="household-new">新しい世帯IDを作成</button><span class="hint">本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。</span></div><div class="hint" style="overflow-wrap:anywhere">世帯ID：${esc(f.householdId||T('未設定'))}</div></div><div class="field"><label class="label">世帯名（本人の氏名とは別・100文字まで）</label><input class="input" maxlength="100" data-f="pf-householdName" value="${esc(f.householdName||'')}" placeholder="例：山田世帯"></div><div class="field"><label class="label">世帯内の関係（60文字まで）</label><input class="input" maxlength="60" data-f="pf-householdRole" value="${esc(f.householdRole||'')}" placeholder="代表者・配偶者・子など"></div>`;}
function shelterCounts(view){const current=[...view.personStatus.values()];return {present:current.filter(l=>isPresent(l.action)).length,away:current.filter(l=>l.action==='outing').length,discharged:current.filter(l=>l.action==='discharge').length,unknown:current.filter(l=>l.action==='out').length};}
function renderShelterSummary(view,force=false){if(!force&&!isShelterMode())return '';const c=shelterCounts(view);return H`<div class="card pad"><h2 class="h2">避難所の現在の記録</h2><p>在所中 <b>${c.present}</b>人 ／ 一時外出中 <b>${c.away}</b>人 ／ 受入継続 <b>${c.present+c.away}</b>人 ／ 正式退所済み <b>${c.discharged}</b>人</p><p class="hint">従来の退場で区分未確認：${c.unknown}人。記録上の状態です。点呼・安否確認と照合してください。</p></div>`;}
function householdRows(view){return [...view.persons.values()].map(p=>({person:p,last:view.personStatus.get(personKey(p))}));}
function renderHouseholds(view){const groups=householdGroups(view),unassigned=[...view.persons.values()].filter(p=>!p.householdId);function member(p){const last=view.personStatus.get(personKey(p));return H`<div class="item"><div class="main"><div class="name">${esc(p.name)} <span class="chip">${esc(p.householdRole||'関係未設定')}</span> <span class="chip">${shelterState(last?.action)}</span></div><div class="meta">人物ID：${esc(p.personId)}${last?' ／ 最終記録 '+esc(ymdhm(new Date(last.ts))):''}</div></div><div><button class="btn sm primary" data-act="reissue-person" data-person="${esc(p.personId)}">QR再発行</button><button class="btn sm ghost" data-act="household-edit" data-person="${esc(p.personId)}">人物を編集</button></div></div>`;}return H`${renderShelterSummary(view,true)}<div class="card pad"><h2 class="h2">避難者・世帯管理</h2><p>登録 ${view.persons.size}人 ／ ${groups.length}世帯 ／ 世帯未設定 ${unassigned.length}人</p><div class="row"><button class="btn sm primary" data-act="household-export">世帯・状態CSVを保存</button><button class="btn sm ghost" data-act="household-print">一覧を印刷・PDF保存</button></div><p class="hint">人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。</p>${groups.map(g=>{const counts={present:0,away:0,discharged:0};for(const p of g.members){const a=view.personStatus.get(personKey(p))?.action;if(isPresent(a))counts.present++;else if(a==='outing')counts.away++;else if(a==='discharge')counts.discharged++;}return H`<section style="margin-top:18px"><h3>${esc(g.name)} (${g.members.length}人)</h3><div class="hint" style="overflow-wrap:anywhere">${esc(g.id)} ／ 在所 ${counts.present}・外出 ${counts.away}・正式退所 ${counts.discharged}</div><button class="btn sm ghost" data-act="household-add-member" data-household="${esc(g.id)}">この世帯の人物を追加</button>${g.members.map(member).join('')}</section>`;}).join('')}${unassigned.length?H('<h3>世帯未設定</h3>')+unassigned.map(member).join(''):''}</div>`;}
function exportHouseholds(){const view=derive(),rows=[['householdId','householdName','householdRole','personId','personName','status','lastAction','lastTimestamp','deviceId','deviceName']];for(const {person:p,last}of householdRows(view))rows.push([p.householdId||'',p.householdName||'',p.householdRole||'',p.personId,p.name,shelterState(last?.action),last?.action||'',last?cgiDate(last.ts):'',last?.deviceId||'',last?.deviceName||last?.n||'']);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"').join(',')).join('\r\n');saveFile(new Blob([csv],{type:'text/csv;charset=utf-8'}),'chatt-households-'+ymd(new Date())+'.csv').catch(e=>toast(e.message));}
function printHouseholds(){const view=derive();const html=H`<!doctype html><html lang="ja"><meta charset="UTF-8"><title>避難者と世帯一覧</title><style>body{font:13px/1.6 sans-serif}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #bbb;padding:6px;text-align:left;overflow-wrap:anywhere}thead{display:table-header-group}tr{break-inside:avoid}@page{size:A4 landscape;margin:12mm}@media print{button{display:none}}</style><button onclick="print()">印刷・PDF保存</button><h1>避難者と世帯一覧</h1><p>${esc(ymdhm(new Date()))} ／ 記録上の状態です。点呼と照合してください。</p><table><thead><tr><th>世帯名・ID</th><th>関係</th><th>氏名・人物ID</th><th>状態</th><th>最終記録</th></tr></thead><tbody>${householdRows(view).map(({person:p,last})=>H`<tr><td>${esc(p.householdName||T('未設定'))}<br>${esc(p.householdId||'')}</td><td>${esc(p.householdRole||'')}</td><td>${esc(p.name)}<br>${esc(p.personId)}</td><td>${shelterState(last?.action)}</td><td>${last?esc(ymdhm(new Date(last.ts))):''}</td></tr>`).join('')}</tbody></table></html>`;const win=window.open('','_blank');if(!win){toast(T('ポップアップを許可してください'));return;}win.document.write(html);win.document.close();}
function handleShelterAction(act,el){if(act==='shelter-scan'){if(!isShelterMode())return true;if(!['outing','return','discharge'].includes(el.dataset.action))return true;S.ui.scanContext=null;S.ui.scannerAction=el.dataset.action;prepareScanAudio();S.ui.scannerSource='live';S.ui.showScanner=true;renderNow();return true;}if(act==='household-new'){syncPersonFormFromDOM();S.ui.personForm.householdId='HH-'+uid();S.ui.personForm.householdName='';S.ui.personForm.householdRole='代表者';S.ui.lastGeneratedContent='';renderNow();toast(T('世帯名を入力し「QRを生成」で人物と一緒に保存してください'));return true;}if(!['household-edit','household-add-member','household-export','household-print'].includes(act))return false;if(!S.ui.isAdmin)return true;if(act==='household-export'){exportHouseholds();return true;}if(act==='household-print'){printHouseholds();return true;}if(act==='household-edit'){const p=derive().persons.get(el.dataset.person);if(p)S.ui.personForm={...p};}else {const g=householdGroups(derive()).find(g=>g.id===el.dataset.household);if(!g)return true;S.ui.personForm={name:'',industry:'',company:'',dept:'',role:'',address:g.members[0]?.address||'',tel:'',email:'',householdId:g.id,householdName:g.name,householdRole:''};}S.ui.adminTab='issue';S.ui.lastGeneratedContent='';renderNow();return true;}
function handleShelterInput(field,value,node){if(['pf-householdName','pf-householdRole'].includes(field)){S.ui.personForm[field.slice(3)]=value;S.ui.lastGeneratedContent='';return true;}if(field!=='householdPick')return false;syncPersonFormFromDOM();const g=householdGroups(derive()).find(g=>g.id===value);if(g){S.ui.personForm.householdId=g.id;S.ui.personForm.householdName=g.name;S.ui.personForm.householdRole='';}else{delete S.ui.personForm.householdId;delete S.ui.personForm.householdName;delete S.ui.personForm.householdRole;}S.ui.lastGeneratedContent='';renderNow();return true;}

function cgiCandidates(view){const people=new Map();for(const l of [...view.logs,...view.activities].sort((a,b)=>a.ts-b.ts))people.set(personKey(l.person),l.person);for(const p of view.persons.values())people.set(personKey(p),p);const summaries=new Map();for(const l of view.logs){const key=personKey(l.person),current=summaries.get(key)||{};current.last=l;if(l.action==='in')current.entry=l.ts;summaries.set(key,current);}const activityMap=new Map();for(const activity of [...view.activities].sort((a,b)=>a.ts-b.ts)){const key=personKey(activity.person);if(!activityMap.has(key))activityMap.set(key,[]);activityMap.get(key).push({...activity,venueName:view.venueMap.get(activity.venue)?.name||activity.venue});}const inside=new Set(view.inside.map(l=>personKey(l.person))),logged=new Set(view.logs.map(l=>personKey(l.person))),query=S.ui.cgiSearch.trim().toLowerCase();return [...people.entries()].filter(([key,p])=>(S.ui.cgiScope!=='inside'||inside.has(key))&&(S.ui.cgiScope!=='logged'||logged.has(key))&&(!query||[p.name,p.personId,p.company,p.dept,p.notes].some(v=>String(v||'').toLowerCase().includes(query)))).map(([key,p])=>{const {last,entry}=summaries.get(key)||{};return {person:p,id:p.personId||'legacy-'+stableImportId(key),entry,exit:last?.action==='discharge'?last.ts:undefined,state:last?.action||'',last,activities:activityMap.get(key)||[]};});}
function cgiFlat(value){return String(value??'').replace(/\r\n?|\n/g,' ／ ').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,' ');}
function cgiText(value){return esc(cgiFlat(value)).replace(/公開/g,'公&#38283;').replace(/public/gi,m=>m.slice(0,4)+'&#'+m.charCodeAt(4)+';'+m.slice(5)).replace(/^[=+@-]/,m=>'&#'+m.charCodeAt(0)+';');}
function cgiDate(timestamp){if(timestamp===undefined)return '';const d=new Date(timestamp),minutes=-d.getTimezoneOffset(),absolute=Math.abs(minutes);return `${ymd(d)}T${hms(d)}${minutes<0?'-':'+'}${pad(Math.floor(absolute/60))}:${pad(absolute%60)}`;}
function cgiRecord(item){const p=item.person,extras=[];if(p.notes)extras.push('備考入力='+p.notes);for(const [key,label]of [['industry','業種'],['company','会社'],['dept','部署'],['role','役職'],['tel','電話番号'],['email','メールアドレス']])if(p[key])extras.push(label+'='+p[key]);extras.push('入退場区分='+(item.state?canonicalLogActionLabel(item.state):'未記録'));if(item.last)extras.push('最終読取端末='+(item.last.deviceName||item.last.n||'')+' ['+(item.last.deviceId||'端末未識別')+']');for(const activity of item.activities||[]){extras.push((activity.category==='booth'?'ブース参加履歴':'物資受取履歴')+'='+cgiDate(activity.ts)+' ｜ '+activity.targetName+(activity.category==='supply'?' ｜ 数量='+activity.quantity+(activity.unit||'個'):'')+' ｜ 会場='+(activity.venueName||activity.venue||'')+' ｜ 読取端末='+(activity.deviceName||activity.n||'名称未設定')+' ['+(activity.deviceId||'端末未識別')+']');}for(const [key,label]of [['householdId','世帯ID'],['householdName','世帯名'],['householdRole','世帯内の関係']])if(p[key])extras.push(label+'='+p[key]);const note=(S.ui.cgiPublic?'公開許諾:公開':'検索表示:対象外')+' ／ '+cgiText(extras.join(' ／ '));return {id:cgiText(item.id),name:cgiText(p.name),age:cgiText(p.age||''),gender:cgiText(p.gender||''),address:cgiText(p.address||''),received:cgiDate(item.entry),left:cgiDate(item.exit),status:'',note};}
function cgiBody(r){return [['避難者ID',r.id],['氏名',r.name],['年齢',r.age],['性別',r.gender],['居住地',r.address],['同行者',''],['受付日時',r.received],['退所日時',r.left],['安否状況',r.status],['備考',r.note]].map(([k,v])=>k+':'+v).join('\n');}
function renderCgiExport(view){const records=cgiCandidates(view);return H`<div class="card pad"><h2 class="h2">CGI避難者データのエクスポート</h2><p class="hint">来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。</p><div class="grid2"><div class="field"><label class="label">対象</label><select class="select" data-f="cgiScope">${[['all',T('登録人物すべて')],['inside',T('現在在場中のみ')],['logged',T('入退場記録のある人物のみ')]].map(([k,n])=>H`<option value="${k}" ${S.ui.cgiScope===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label class="label">氏名・ID・会社・部署・備考で検索</label><input class="input" data-f="cgiSearch" value="${esc(S.ui.cgiSearch)}"></div></div><p>出力対象：<b id="cgi-count">${records.length}</b>人（人物ごとに1件）</p><label style="display:block"><input type="checkbox" data-f="cgiPublic" ${S.ui.cgiPublic?'checked':''}> 出力対象者全員をsbbs.cgiの氏名の公開検索対象にする</label><p class="hint">初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。</p><div class="grid2" style="margin-top:14px"><button class="btn accent" data-act="cgi-hxl">避難者HXL CSVを保存</button><button class="btn primary" data-act="cgi-mailzip">共通メールTXT ZIPを保存</button></div><p class="hint">HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。</p><table><thead><tr><th>CGIの項目</th><th>このアプリのデータ</th></tr></thead><tbody><tr><td>避難者ID・氏名・年齢・性別</td><td>来場者ID・氏名・年齢・性別</td></tr><tr><td>居住地</td><td>住所</td></tr><tr><td>受付日時</td><td>最新の入場日時。入場なしは空欄</td></tr><tr><td>退所日時</td><td>最後の記録が正式退所のとき、その正式退所日時</td></tr><tr><td>安否状況・同行者</td><td>アプリに専用項目がないため空欄</td></tr><tr><td>備考</td><td>備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末</td></tr></tbody></table><p class="hint">CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。</p><div style="overflow:auto"><table><thead><tr><th>避難者ID</th><th>氏名</th><th>入退場</th><th>備考入力</th></tr></thead><tbody>${records.slice(0,20).map(r=>H`<tr><td style="overflow-wrap:anywhere">${esc(r.id)}</td><td>${esc(r.person.name)}</td><td>${r.state==='in'?T('入場'):r.state==='out'?T('退場'):T('未記録')}</td><td style="white-space:pre-wrap">${esc(r.person.notes||'')}</td></tr>`).join('')||H('<tr><td colspan="4">対象なし</td></tr>')}</tbody></table></div><div class="hint">プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。</div></div>`;}
function cgiCsv(records){const rows=[['避難者ID','氏名','年齢','性別','居住地','受付日時','退所日時','安否状況','備考'],['#affected+id','#name','#age','#gender','#loc+name','#date+reg','#date+exit','#status','#description'],...records.map(r=>[r.id,r.name,r.age,r.gender,r.address,r.received,r.left,r.status,r.note])];return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')+'\r\n';}
function utf8Base64(value){const bytes=new TextEncoder().encode(value);let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(binary);}
function mimeSubject(value){const words=[];let chunk='';for(const char of cgiFlat(value)){if(new TextEncoder().encode(chunk+char).length>42){words.push('=?UTF-8?B?'+utf8Base64(chunk)+'?=');chunk='';}chunk+=char;}if(chunk)words.push('=?UTF-8?B?'+utf8Base64(chunk)+'?=');return words.join('\r\n ');}
function mimeRecord(record){return 'MIME-Version: 1.0\r\nSubject: '+mimeSubject(record.name)+'\r\nContent-Type: text/plain; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n'+utf8Base64(cgiBody(record)).match(/.{1,76}/g).join('\r\n')+'\r\n';}
function crc32(bytes){let crc=0xffffffff;for(const byte of bytes){crc^=byte;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return (crc^0xffffffff)>>>0;}
function mailZip(records){if(records.length>60000)throw Error(T('ZIPは6万人以下に絞り込んでください'));const files=[],central=[];let offset=0,centralSize=0;const now=new Date(),dosDate=((Math.max(1980,now.getFullYear())-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),used=new Set();for(const [index,r]of records.entries()){let name='EVACUEE_'+stableImportId(r.id)+'.TXT';if(used.has(name))name='EVACUEE_'+stableImportId(r.id)+'_'+index+'.TXT';used.add(name);const filename=new TextEncoder().encode(name),data=new TextEncoder().encode(mimeRecord(r)),crc=crc32(data),local=new Uint8Array(30+filename.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x800,true);lv.setUint16(10,dosTime,true);lv.setUint16(12,dosDate,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,filename.length,true);local.set(filename,30);files.push(local,data);const c=new Uint8Array(46+filename.length),cv=new DataView(c.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(12,dosTime,true);cv.setUint16(14,dosDate,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,filename.length,true);cv.setUint32(42,offset,true);c.set(filename,46);central.push(c);centralSize+=c.length;offset+=local.length+data.length;}
 const end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,records.length,true);ev.setUint16(10,records.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...files,...central,end],{type:'application/zip'});}
function handleCgiAction(act){if(!['cgi-hxl','cgi-mailzip'].includes(act))return false;if(!S.ui.isAdmin)return true;const items=cgiCandidates(derive());if(!items.length){toast(T('出力対象がありません'));return true;}const records=items.map(cgiRecord);try{const blob=act==='cgi-hxl'?new Blob([cgiCsv(records)],{type:'text/csv;charset=utf-8'}):mailZip(records),name='chatt_evacuee_'+ymd(new Date())+(act==='cgi-hxl'?'.csv':'.zip');saveFile(blob,name).catch(e=>toast(T('CGI出力失敗: ')+e.message));}catch(e){toast(T('CGI出力失敗: ')+e.message);}return true;}
function handleCgiInput(field,value,node){if(field==='cgiPublic'){S.ui.cgiPublic=node.checked;return true;}if(['cgiScope','cgiSearch'].includes(field)){const pos=node.selectionStart;S.ui[field]=value;renderNow();if(field==='cgiSearch'){const input=document.querySelector('[data-f=cgiSearch]');input.focus();input.setSelectionRange(pos,pos);}return true;}return false;}

try{ Promise.resolve(wx.setUpdateListener(onUpdate,0)).then(afterReplay,afterReplay); }catch(e){ afterReplay(); }
setTimeout(afterReplay,3000);
setInterval(()=>{ S.now=new Date(); const c=document.getElementById('clk'); if(c) c.textContent=hms(S.now); },1000);
renderNow();
})();
</script>
