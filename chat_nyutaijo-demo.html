var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],

<style>
:root{
 --bg:#f7f8fb;--surface:#f1f5f9;--card:#ffffff;--border:#e2e8f0;
 --text:#0f172a;--muted:#64748b;
 --ink:#0f172a;--ink-fg:#ffffff;
 --primary:#0f172a;--primary-fg:#ffffff;
 --accent:#6366f1;--accent-2:#4f46e5;
 --success:#10b981;--success-bg:#ecfdf5;--success-bd:#a7f3d0;--success-fg:#065f46;
 --danger:#ef4444;--danger-bg:#fef2f2;--danger-bd:#fecaca;--danger-fg:#991b1b;
 --radius:22px;--radius-full:999px;
 --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
 --shadow-lg:0 12px 40px rgba(15,23,42,.12);
 --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{padding-top:var(--safe-top);min-height:100vh}
.hdr{position:sticky;top:var(--safe-top);z-index:30;backdrop-filter:blur(18px) saturate(1.4);background:rgba(255,255,255,.86);border-bottom:1px solid var(--border)}
.hdr-in{max-width:900px;margin:0 auto;padding:10px 18px;min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo{height:38px;width:38px;border-radius:12px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:16px}
.ttl{font-weight:800;font-size:18px;line-height:1.1}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.clock{text-align:right}
.cdate{font-size:11px;color:var(--muted)}
.ctime{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.main{max-width:900px;margin:0 auto;padding:18px 16px 100px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.card.pad{padding:20px}
.h2{font-size:14px;font-weight:800;margin:0}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.badge.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn{border:0;border-radius:999px;font-weight:700;font-size:15px;min-height:52px;padding:0 20px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn.sm{min-height:36px;font-size:13px;padding:0 14px;width:auto}
.btn.lg{min-height:60px;font-size:16px;border-radius:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.field{margin-top:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block}
.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px 14px;font-size:15px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.textarea{min-height:80px;resize:none}
.select{height:46px}
.status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.status-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:16px;background:var(--card)}
.avatar{height:36px;width:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.item .name{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .meta{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.chip{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid var(--border);background:var(--surface)}
.chip.in{background:var(--success-bg);color:var(--success-fg);border-color:var(--success-bd)}
.chip.out{background:var(--surface);color:var(--muted)}
.seg{display:flex;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;gap:4px;overflow:auto}
.seg button{flex:1;height:36px;border-radius:999px;border:0;background:transparent;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--ink);color:var(--ink-fg)}
.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px}
.canvas-wrap h3{font-size:12px;font-weight:700;margin:0 0 10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
canvas{width:100%;height:220px;display:block}
.qr-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qr-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;min-width:264px;min-height:264px;display:grid;place-items:center}
.qr-code-text{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:6px 10px;border-radius:10px;word-break:break-all;max-width:100%}
.person-detail{font-size:12px;line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;width:100%}
.ovl{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ovl{align-items:center;padding:20px}}
.bd{position:absolute;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(8px)}
.sheet{position:relative;width:100%;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg)}
@media(min-width:640px){.sheet{max-width:560px;border-radius:24px;max-height:86vh}}
.sheet.small{max-width:400px;border-radius:20px}
.sh-h{position:sticky;top:0;z-index:1;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.sh-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.sh-f{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:14px 18px;display:flex;gap:10px}
.x{height:32px;width:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.video-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3}
.video-wrap video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;inset:18%;border:2px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:18px;background:var(--surface)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
table th,table td{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.btn:disabled{opacity:.45;cursor:not-allowed}
</style>

"There is no space left in the device's history storage. Please save a backup","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"The latest 200 items are displayed in history, and all items are output to CSV and reports.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"No dedicated button has been set. Please add it from \"Dedicated Button Settings\" below.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Issuing/scanning of entry/exit person QR • Member terminal • QR registration/entry/exit record","保存容量不足などにより取込を中止しました。既存データを保持しています":"Importing was canceled due to insufficient storage space. Retains existing data","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"If you plan on returning. They will be included in the number of people who will continue to be accepted, and when they return, they will be recorded as ``returning''.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"No available cameras were found. Try selecting images and taking photos.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Unable to start camera. Please try again or select an image/take a photo.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"This is the mode for reception and registration. Aggregation and reports can be used from the administrator terminal.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Enter notes, industry/company/department/position/telephone/email, entry/exit classification and final reading terminal","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"I registered my ID and generated a QR. Other terminals can read the registration information after receiving it.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Please keep images under 50MB. Cutting out the area around the QR will make it easier to read.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"If you wish to terminate acceptance. They will be excluded from the number of people who will continue to be admitted, and will be output on the CGI leaving date and time.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"I can't open the print screen. Please open in your browser from Save/Share Report HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Select a QR image such as PNG or JPEG. You can select the same image and try again.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Live camera is not available in this display environment. Try selecting images and taking photos.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Sharing scope: All participants in the same chat. Management mode is a display switch within the terminal. Number of unsent items:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Enter the person's name in the \"Name\" field above. A QR will be issued and recorded for each person in the same household.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Unable to start camera. Please close the other app's camera and try again, or select an image.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Classification not confirmed due to conventional exit: {0} people. This is the state of record. Please check with roll call and safety confirmation.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Live camera was stopped for image selection. If you want to go back, press \"Retry camera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Waiting for camera response. Please check the permission screen or use the image selection/photo capture option below.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Exclude all records from being displayed in the sharing history. Past communication data, device storage, and CSV will not be deleted.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Duplicate numbers are excluded by person ID. Quantity is the total for each item and unit. Does not include inventory or determination of eligibility.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Registration information not found. Please make sure to sync the same attached app or restore the JSON backup.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR not found. Please crop it so that the entire QR and the white margin are visible, or take a brighter photo and select again.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Record booth participation and receipt of supplies. The button you select will be saved on this device and will be recorded separately from your entry/exit.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Browser demo: recordings will be saved in this browser. Notifications will not be sent to Delta Chat terminals.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Registered people: {0} / Entry/exit: {1} / Participating/receiving: {2} / New history events: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"When entering and leaving the venue, record this terminal ID, the terminal name and venue at that time. The terminal name will be reflected in the record after configuration.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"The issued/printed person QR is scanned and recorded as entry/exit. Share within the same chat (delays may occur depending on communication status).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"This ID is unregistered or the registered information is not synchronized. Please re-read after receiving the same chat registration information as the issuing terminal.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Redisplay the QR with registered information. Editing changes will not be saved. A lost QR will not be invalidated even if it is reissued.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Venue: {2} / Terminal: {3} / Type: {4} / Target: {5} / Search: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maximum of 12 pieces. Registration and deletion of types can be done in the administrator's \"Booth/Supplies\" section. For booth participation, one scan records one person's participation.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"By time of day, month, and day of the week, it also follows the conditions of the period, venue, and reading terminal. Monthly graphs for periods spanning years add up the same months.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Depending on your device and Delta Chat compatibility, you may be able to take a photo or select a file. This is a different method from live camera.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"This image format cannot be displayed. Please save as PNG or JPEG and select again (HEIC/HEIF is not supported depending on the environment)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Select for each device. The switching applies to the button display and the current record classification, and does not change past records, person IDs, households, and material receipt history.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Enter the industry, company, department, title, name, address, phone, and email to automatically generate an arbitrary ID and issue a QR with just the ID. Print it out and distribute it to the person.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"The number of admissions refers to the number of admissions and returns, and the number of exits refers to the number of cases traditionally recorded as exits, temporary outings, and official exits. Please check the current evacuee status under \"Evacuate/Household\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"A person's affiliation is saved on the QR issue screen. Even if the name is the same, if the household ID is different, it is a different household. Changes to affiliation are made for each person. Household information in past history will not be rewritten.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Normally, turn it off and use a new device ID. If you want to turn it on, please stop using the original device. The device ID from the past history is kept as it was in both cases.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"It will not be added to the number of people entering/exiting and attending. The actual number of people will be calculated by excluding duplicate person IDs, and the quantity will be calculated by material/unit. There will be no automatic determination of eligibility, inventory, or duplicate distribution.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Enter the industry, company, department, title, name, address, phone, and email to automatically generate an arbitrary ID and issue a QR with just the ID. Print it out, distribute it, scan it at the venue, and manage entry and exit at once.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Share the list within the same attached app. Deleted items cannot be newly recorded using the dedicated button, but past participation and receipt history will remain. On another device, the changes will be reflected after they are received.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Search for the registered person by name, person ID, household name, company, phone, and email, confirm the identity, and press \"Reissue QR with the same ID\". Personal information, entry/exit, participation, receipt of supplies, and household history will be inherited.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Access to camera is denied. Please check your device's camera permissions. This will also be denied due to restrictions on the Delta Chat/Webxdc side, so if you have permission, please try selecting an image or taking a photo.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"The graph shows up to 12 classifications and the remaining total. All classifications are listed in the table below and in the printed report. The label for each terminal graph is the last 8 characters of the terminal ID, and the official ID and terminal name can be found in the table below. The old record cannot identify the real terminal.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"The initial setting is OFF. Please turn it on only for those who have confirmed their permission to publish. In accordance with the judgment specifications of the attached CGI, when OFF, public judgment words such as notes are converted to character references for display, and when ON, an explicit mark for publication is added.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"IDs with a record of admission during the specified period/venue will be counted as one person. The attribute is the last entry point within the period. History for which age and gender are not registered will be treated as \"unanswered\". Duplicate numbers for each venue and terminal are excluded. Does not include unsynchronized recordings.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Persons, entry/exit, participation/receipt, booth/supply/venue registration history, unsent information, device name, usage mode, and dedicated button settings are saved in JSON. Please check the storage and sharing destinations as they contain personal information. Does not include administrative password and login status.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV has UTF-8 BOM, the first line is the column name, and the second line is the HXL tag. Import in the evacuee category of esbbs.cgi. ZIP is a format for server administrators to extract and place TXT in the common evacuee storage location for both CGIs.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Output visitors as evacuees. Supports esbbs.cgi's \"evacuee\" HXL import and email TXT storage format common to sbbs.cgi and esbbs.cgi. Notes will include all booth participation and material receipt history (date/time, name, quantity, venue, terminal) for each person. It will not be automatically sent to CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Since the CGI side analyzes a single line of \"item name: value\", line breaks in notes for CGI are grouped into \"/\". Special characters are made safe for CGI display. Line breaks and character strings in the original notes are usually retained in CSV and JSON. HXL import does not have duplicate removal on the CGI side, so if you import the same CSV repeatedly, it will be duplicated.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON is integrated with existing data by ID, and the additional data is shared to the same attached app. The history will not be increased by re-importing the same file. Please select a backup with the same operation. Reset history is also reflected. The old version of entry/exit CSV can only import people and entry/exit. Device settings and material lists cannot be restored with CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"The number of admissions includes returning to the facility, and the number of exits includes temporary departures and official exits. Calculate the number of people by excluding duplicate admission IDs within the period. Attributes are as of the last entry within the period. Age includes unanswered questions by age group. The number of people by venue and device is the actual number of people in each. Each table shows all categories, and the graph shows the top 12 categories and the remaining total. Records before synchronization are not included.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Check Android Settings → Apps → Delta Chat → Permissions → Camera. If you use a browser, check the permissions on the browser side. Even if you allow permission, live camera may be denied due to restrictions on the Delta Chat version or Webxdc side. Since it cannot be canceled from the app, please try selecting an image or taking a photo.","{0}〜{1}歳":"{0}–{1} years","80歳以上":"80 years and older","年齢（年代）":"Age group","メイン会場":"Main venue","会議室A":"Room A","会議室B":"Room B","ブース・物資の登録画面へ":"Go to booth/supply registration screen","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Settings for device name, venue, sound, usage mode, display language, and dedicated buttons are also carried over.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Ask the administrator to register booth and supply names, then receive their updates in the same attached app.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"Booth/supplies are not registered. Category headings cannot be selected. You can select it when the administrator registers the name.","出力失敗:":"Output failure:","読取処理:":"Read processing:","引き継ぎ完了：":"Transfer completed:","画像出力失敗:":"Image output failure:","画像読取失敗：":"Image reading failure:","CGI出力失敗:":"CGI output failure:","レポート出力失敗:":"Report output failure:","QRを解析しています（":"Parsing QR (","QR生成に失敗しました":"QR generation failed","バックアップ作成失敗:":"Backup creation failure:","QR再発行に失敗しました":"Failed to reissue QR","QR読取済み・記録なし：":"QR scanned/no record:","件の履歴イベントを追加しました":"Added historical events","QRを確認しましたが記録できませんでした。":"I checked the QR, but it could not be recorded.","既存の同じIDと内容が異なるため取り込めません:":"Unable to import because the content is different from the existing same ID:","さんのQRを同じIDで再発行しました。保存・印刷できます":"We have reissued your QR with the same ID. Can be saved and printed","性別":"Gender","取込できません:":"Unable to import:","ファイルを確認しています":"Checking file","CSVが空です":"CSV is emp JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"选择 QR 图像，例如 PNG 或 JPEG。您可以选择相同的图像并重试。","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"实时摄像头在此显示环境中不可用。尝试选择图像并拍照。","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"共享范围：同一聊天中的所有参与者。管理模式是终端内的显示开关。未发送的物品数量：","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"在上面的“姓名”字段中输入此人的姓名。将为同一家庭中的每个人发放并记录 QR。","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"无法启动相机。请关闭其他应用程序的相机并重试，或选择图像。","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"由于常规退出而未确认分类：{0} 人。这是有记录的状态。请通过点名和安全确认进行检查。","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"实时摄像头因图像选择而停止。如果您想返回，请按“重试相机”。","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"等待相机响应。请检查许可屏幕或使用下面的图像选择/照片拍摄选项。","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"排除共享历史记录中显示的所有记录。过去的通信数据、设备存储和 CSV 不会被删除。","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"重复的号码将按人员 ID 排除。数量是每个项目和单位的总数。不包括库存或资格确定。","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"未找到注册信息。请确保同步相同的附加应用程序或恢复 JSON 备份。","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"未找到二维码。请裁剪它，使整个 QR 和白边都可见，或者拍摄一张更亮的照片并重新选择。","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"记录展位参与情况和物资接收情况。您选择的按钮将保存在此设备上，并将与您的进入/退出分开记录。","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"浏览器演示：录音将保存在该浏览器中。通知不会发送至达美聊天终端。","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"注册人数：{0} / 进入/退出：{1} / 参与/接收：{2} / 新历史事件：{3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"进出场馆时，记录本终端ID、当时的终端名称和场馆。配置后，终端名称将反映在记录中。","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"扫描签发/打印的人员二维码并记录为出入境。在同一聊天中共享（根据通信状态可能会出现延迟）。","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"该ID未注册或注册信息未同步。请收到与发卡终端相同的聊天注册信息后重新阅读。","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"重新显示包含注册信息的 QR。编辑更改将不会被保存。丢失的二维码即使补发也不会失效。","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / 地点：{2} / 终端：{3} / 类型：{4} / 目标：{5} / 搜索：{6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"最多 12 件。类型的注册和删除可以在管理员的“展位/供应”部分进行。对于展位参与，一次扫描记录一个人的参与。","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"按日、月、周的时间，还遵循时段、地点、阅读终端的条件。跨年期间的月度图表将相同月份相加。","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"根据您的设备和 Delta Chat 兼容性，您也许可以拍照或选择文件。这是与实时摄像不同的方法。","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"无法显示该图像格式。请另存为PNG或JPEG并重新选择（根据环境不支持HEIC/HEIF）","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"为每个设备选择。切换适用于按钮显示和当前记录分类，不会改变过去的记录、人员ID、家庭和物料接收历史。","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"输入行业、公司、部门、职位、姓名、地址、电话和电子邮件，自动生成任意 ID，并仅凭 ID 发出二维码。将其打印出来并分发给该人。","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"入院人数是指入院和返回的人数，出院人数是指传统上记录为出境、临时外出、正式出境的案件数量。请在“避难/家庭”中确认当前的避难状况。","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"一个人的隶属关系保存在 QR 问题屏幕上。即使姓名相同，如果家庭ID不同，也是不同的家庭。隶属关系的变更是针对每个人进行的。过去历史中的家庭信息不会被改写。","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"通常，将其关闭并使用新的设备 ID。如果您想开启它，请停止使用原来的设备。过去历史记录中的设备 ID 在这两种情况下均保持原样。","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"不会计入进出及出席人数。实际人数以剔除重复人员ID计算，数量按物料/单位计算。不会自动确定资格、库存或重复分配。","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"输入行业、公司、部门、职位、姓名、地址、电话和电子邮件，自动生成任意 ID，并仅凭 ID 发出二维码。打印、分发、现场扫描，进出一次管理。","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"在同一附加应用程序中共享列表。删除的项目无法使用专用按钮重新记录，但过去的参与和接收历史记录将保留。在另一台设备上，更改将在收到后反映出来。","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"按姓名、个人ID、家庭姓名、公司、电话和电子邮件搜索注册人，确认身份，然后按“使用相同ID重新发行QR”。个人信息、出入、参与、物资接收和家庭历史将被继承。","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"对相机的访问被拒绝。请检查您设备的相机权限。由于 Delta Chat/Webxdc 方面的限制，这也会被拒绝，所以如果您有许可，请尝试选择图像或拍照。","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"该图显示最多 12 个分类以及剩余的总数。下表和打印报告中列出了所有分类。每个终端图的标签是终端ID的后8个字符，官方ID和终端名称可以在下表中找到。旧记录无法识别真实终端。","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"初始设置为关闭。请仅对已确认发布权限的用户打开此功能。根据所附CGI的判断规范，当OFF时，注释等公共判断词被转换为字符参考以进行显示，当ON时，添加用于发布的明确标记。","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"具有指定时间/地点入场记录的身份证件按1人计算。该属性是该周期内的最后一个入口点。未登记年龄和性别的病史将被视为“未答复”。每个场馆和航站楼的重复号码均被排除。不包括未同步的录音。","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"人员、进入/退出、参与/领取、展位/供应/场地注册历史、未发送信息、设备名称、使用模式和专用按钮设置均以 JSON 格式保存。请检查存储和共享目的地，因为它们包含个人信息。不包括管理密码和登录状态。","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV具有UTF-8 BOM，第一行是列名称，第二行是HXL标签。在esbbs.cgi的evacuee类别中导入。 ZIP 是一种供服务器管理员提取 TXT 并将其放置在两个 CGI 的公共撤离存储位置中的格式。","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"将访客输出为撤离人员。支持 sbbs.cgi 和 esbbs.cgi 通用的 esbbs.cgi 的“evacuee”HXL 导入和电子邮件 TXT 存储格式。注释将包括每个人的所有展位参与和材料接收历史记录（日期/时间、姓名、数量、地点、终端）。它不会自动发送到 CGI。","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"由于CGI端分析单行“项目名称：值”，因此CGI注释中的换行符被分组为“/”。特殊字符对于 CGI 显示是安全的。 CSV和JSON中通常会保留原始笔记中的换行符和字符串。 HXL 导入在 CGI 端没有去重功能，因此如果重复导入相同的 CSV，则会出现重复。","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON 通过 ID 与现有数据集成，并将附加数据共享到同一个附加应用程序。重新导入同一文件不会增加历史记录。请选择具有相同操作的备份。重置历史记录也会反映出来。旧版本的出入境 CSV 只能导入人员和出入境。无法使用 CSV 恢复设备设置和材料列表。","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"入场次数包括返回设施，退出次数包括临时离开和正式退出。排除期间内重复的入场ID，计算人数。属性截至该时间段内的最后一个条目。年龄包括按年龄组划分的未回答的问题。按场地和设备划分的人数为每个场地的实际人数。每个表格显示所有类别，图表显示前 12 个类别和剩余总数。不包括同步之前的记录。","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合 ます。QR周辺を切り抜いて選び直してください":"이미지가 너무 큽니다. QR 주변을 잘라내고 다시 선택해주세요.","出力対象者全員をsbbs.cgiの氏名の公開検索対象にする":"모든 출력 대상을 sbbs.cgi의 이름에 대한 공개 검색 대상으로 만듭니다.","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"세대명을 입력하고 \"QR 생성\"을 클릭하면 해당인과 함께 저장됩니다.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"그 사람의 \"이름\"을 입력하세요. '세대 이름'과 별도의 필드입니다.","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"방문객수 : {0}명 / 입장 : {1}회 / 퇴장 : {2}회","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"행사장에 들어가는 사람을 'Enter', 행사장에서 나가는 사람을 'Exit'이라고 합니다.","登録情報が見つかりません。同期やバックアップを確認してください":"등록정보를 찾을 수 없습니다. 동기화 및 백업 확인","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"발급된 QR을 액자에 담아주세요. 동일한 채팅 내에서 녹음 내용을 읽고 공유하세요.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"QR에는 방문자 ID만 포함되어 있습니다. 개인정보는 등록된 정보와 비교하여 표시됩니다.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"선착순 20명을 미리 보고, 압축된 모든 사람을 파일로 출력합니다.","ID方式のQRではありません。登録情報からQRを再発行してください":"ID 기반 QR이 아닙니다. 등록정보에서 QR을 재발급해 주세요.","このブース・物資は削除されています。別の専用ボタンを選んでください":"해당 부스/용품이 삭제되었습니다. 다른 전용 버튼을 선택하세요.","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"라이브 카메라를 시작할 수 없습니다. 화면설명과 이미지읽기를 이용해주세요.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"이미지 파일을 로드할 수 없습니다. 다른 위치에 저장한 후 다시 시도해 주세요.","送信サイズ上限により共有できません。バックアップを保存してください":"전송 크기 제한으로 인해 공유할 수 없습니다. 백업을 저장해주세요","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"편집 ID: {0}. 선택한 사람의 변경사항은 동일한 ID에 저장됩니다.","履歴の端末内保存に空きがありません。バックアップを保存してください":"기기의 기록 저장소에 남은 공간이 없습니다. 백업을 저장해주세요","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"최근 200개 항목이 이력에 표시되며, 모든 항목은 CSV 및 보고서로 출력됩니다.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"전용 버튼이 설정되지 않았습니다. 아래의 \"전용버튼 설정\"에서 추가해 주세요.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"출입국자QR발급/스캔 • 회원단말기 • QR등록/출국기록","保存容量不足などにより取込を中止しました。既存データを保持しています":"저장공간이 부족하여 가져오기가 취소되었습니다. 기존 데이터 유지","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"돌아올 계획이라면. 이들은 계속해서 수용인원에 포함되며, 귀국할 경우에는 '귀국'으로 기록됩니다.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"사용 가능한 카메라를 찾을 수 없습니다. 이미지를 선택하고 사진을 찍어보세요.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"카메라를 시작할 수 없습니다. 다시 시도하거나 이미지를 선택하거나 사진을 찍어보세요.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"접수 및 등록을 위한 모드입니다. 집계 및 보고서는 관리자 단말기에서 사용할 수 있습니다.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"메모, 업종/회사/부서/직위/전화/이메일, 출입구분 및 최종열람단말기 입력","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"ID를 등록하고 QR을 생성했습니다. 다른 단말기에서는 등록 정보를 수신한 후 읽을 수 있습니다.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"이미지를 50MB 미만으로 유지하세요. QR 주변 영역을 잘라내면 더 쉽게 읽을 수 있습니다.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"수락을 종료하려는 경우. 계속해서 입장할 인원에서 제외되며, 퇴실일시 CGI로 출력됩니다.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"인쇄 화면을 열 수 없습니다. 저장/공유 보고서 HTML을 브라우저에서 여십시오.","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"PNG 또는 JPEG와 같은 QR 이미지를 선택합니다. 동일한 이미지를 선택하고 다시 시도할 수 있습니다.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"이 디스플레이 환경에서는 라이브 카메라를 사용할 수 없습니다. 이미지를 선택하고 사진을 찍어보세요.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"공유 범위: 동일한 채팅에 참여하는 모든 참가자. 관리 모드는 단말기 내의 디스플레이 스위치입니다. 보내지 않은 항목 수:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"위의 '이름' 입력란에 사람의 이름을 입력하세요. 같은 세대의 각 구성원에 대해 QR이 발행되어 기록됩니다.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"카메라를 시작할 수 없습니다. 다른 앱의 카메라를 닫고 다시 시도하거나 이미지를 선택하세요.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"기존 종료로 인해 분류가 확인되지 않았습니다: {0} 사람들. 이 기록 상태입니다. 점호 및 안전확인을 통해 확인하시기 바랍니다.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"이미지 선택을 위해 라이브 카메라가 중지되었습니다. 되돌아가려면 \"카메라 재시도\"를 누르세요.","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"카메라 응답을 기다리고 있습니다. 권한 화면을 확인하시거나 아래의 이미지 선택/사진 캡처 옵션을 이용해 주시기 바랍니다.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"공유 기록에 모든 기록이 표시되지 않도록 제외합니다. 과거 통신 데이터, 기기 저장소, CSV는 삭제되지 않습니다.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"중복번호는 개인ID별로 제외됩니다. 수량은 각 품목 및 단위의 합계입니다. 목록이나 적격성 결정은 포함되지 않습니다.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"등록정보를 찾을 수 없습니다. 연결된 동일한 앱을 동기화하거나 JSON 백업을 복원하세요.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR을 찾을 수 없습니다. QR 전체와 흰색 여백이 보이도록 자르시거나, 사진을 더 밝게 찍어서 다시 선택해주세요.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"부스 참여 및 물품 수령을 기록합니다. 선택한 버튼은 본 기기에 저장되며 입장/퇴장과 별도로 기록됩니다.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"브라우저 데모: 녹음 내용이 이 브라우저에 저장됩니다. 델타 채팅 단말기로는 알림이 전송되지 않습니다.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"등록자: {0} / 입장/퇴장: {1} / 참여/수신: {2} / 신규 이력 이벤트: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"행사장 출입 시 해당 단말기 ID와 당시 단말기명, 행사장을 기록해 두십시오. 단말기 이름은 구성 후 기록에 반영됩니다.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"발급/인쇄된 사람QR을 스캔하여 출입으로 기록합니다. 동일한 채팅 내에서 공유하세요. (소통 상태에 따라 지연이 발생할 수 있습니다.)","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"등록되지 않은 ID이거나 등록된 정보가 동기화되지 않은 ID입니다. 발급 단말기와 동일한 채팅 등록 정보를 받으신 후 다시 읽어보시기 바랍니다.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"등록된 정보로 QR을 다시 표시합니다. 수정된 변경사항은 저장되지 않습니다. 분실된 QR은 재발급을 받아도 무효화되지 않습니다.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / 장소: {2} / 터미널: {3} / 유형: {4} / 대상: {5} / 검색: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"최대 12개. 유형 등록 및 삭제는 관리자의 \"부스/소품\" 섹션에서 하실 수 있습니다. 부스 참가의 경우 1회 스캔으로 1인의 참여가 기록됩니다.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"시간대별, 월별, 요일별로도 기간, 장소, 독서단말기의 조건에 따릅니다. 몇 년에 걸친 기간에 대한 월별 그래프는 동일한 달을 합산합니다.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"귀하의 장치 및 델타 채팅 호환성에 따라 사진을 찍거나 파일을 선택할 수 있습니다. 이는 라이브 카메라와는 다른 방식이다.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"이 이미지 형식은 표시할 수 없습니다. PNG 또는 JPEG로 저장하신 후 다시 선택해주세요. (환경에 따라 HEIC/HEIF는 지원되지 않습니다.)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"각 장치에 대해 선택하세요. 전환은 버튼 표시 및 현재 기록 분류에 적용되며, 과거 기록, 개인 ID, 세대, 자료 수령 내역은 변경되지 않습니다.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"업종, 회사, 부서, 직위, 이름, 주소, 전화번호, 이메일을 입력하면 자동으로 임의의 ID가 생성되고, 해당 ID만으로 QR이 발행됩니다. 이를 인쇄하여 해당인에게 배포하십시오.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"입국수는 입국과 귀국 건수를 의미하고, 퇴장 건수는 전통적으로 퇴실, 임시 외출, 공식 퇴장으로 기록된 건수를 의미한다. 현재의 피난 상황은 \"피난/세대\"에서 확인하시기 바랍니다.","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"QR발행 화면에는 소속이 저장됩니다. 이름이 동일하더라도 세대번호가 다르면 다른 세대입니다. 소속 변경은 각 개인별로 이루어집니다. 과거 이력의 가구 정보는 다시 작성되지 않습니다.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"일반적으로 전원을 끄고 새 장치 ID를 사용하십시오. 켜시려면 원래 기기의 사용을 중단해주세요. 두 경우 모두 과거 기록의 장치 ID가 그대로 유지됩니다.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"입장/퇴장 및 참석인원에는 추가되지 않습니다. 실제 인원은 중복인원ID를 제외하여 계산되며, 수량은 자재별/단위별로 계산됩니다. 적격성, 재고 또는 중복 배포에 대한 자동 결정은 없습니다.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"업종, 회사, 부서, 직위, 이름, 주소, 전화번호, 이메일을 입력하면 자동으로 임의의 ID가 생성되고, 해당 ID만으로 QR이 발행됩니다. 출력하여 배포하고, 행사장에서 스캔하여 출입관리를 한번에 해드립니다.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"연결된 동일한 앱 내에서 목록을 공유하세요. 삭제된 항목은 전용버튼을 이용하여 새로 등록할 수 없으며, 과거 참여 및 수신 내역은 그대로 유지됩니다. 다른 장치에서는 변경 사항이 수신된 후 반영됩니다.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"등록된 본인을 이름, 주민번호, 세대명, 회사, 전화번호, 이메일로 검색하여 본인 확인을 한 후 \"동일 아이디로 QR 재발급\"을 눌러주세요. 개인정보, 출입, 참여, 물품수령, 가계기록은 상속됩니다.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"카메라에 대한 액세스가 거부되었습니다. 기기의 카메라 권한을 확인하세요. 이 역시 Delta Chat/Webxdc 측의 제한으로 인해 거부될 예정이오니, 권한이 있으신 경우 이미지를 선택하시거나 사진을 촬영해 보시기 바랍니다.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"그래프에는 최대 12개의 분류와 나머지 합계가 표시됩니다. 모든 분류는 아래 표와 인쇄된 보고서에 나열되어 있습니다. 각 단말기 그래프의 라벨은 단말기 ID 마지막 8자리로 구성되며, 공식 ID와 단말기 이름은 아래 표에서 확인할 수 있습니다. 이전 기록으로는 실제 단말기를 식별할 수 없습니다.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"초기 설정은 OFF입니다. 게시 권한을 확인하신 분에 한해 활성화해 주시기 바랍니다. 첨부된 CGI의 판정 사양에 따라 OFF 시 메모 등 공개 판정 단어를 문자 참조로 변환하여 표시하고, ON 시 공개용 명시적 표시를 추가합니다.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"지정된 기간/장소에 입장한 기록이 있는 신분증은 1인으로 간주됩니다. 속성은 기간 내의 마지막 진입점입니다. 연령, 성별이 등록되지 않은 이력은 '무응답'으로 처리됩니다. 각 행사장 및 터미널별 중복번호는 제외됩니다. 동기화되지 않은 녹음은 포함되지 않습니다.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"인원, 입장/퇴장, 참가/영수증, 부스/공급/장소 등록내역, 미발송정보, 기기명, 사용모드, 전용버튼 설정 등이 JSON으로 저장됩니다. 개인정보가 포함되어 있으므로 저장 및 공유 대상을 확인하시기 바랍니다. 관리 비밀번호 및 로그인 상태는 포함되지 않습니다.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV에는 UTF-8 BOM이 있으며 첫 번째 줄은 열 이름이고 두 번째 줄은 HXL 태그입니다. esbbs.cgi의 evacuee 카테고리에서 가져옵니다. ZIP은 서버 관리자가 두 CGI의 공통 대피자 저장 위치에 TXT를 추출하여 배치할 수 있는 형식입니다.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"방문자를 피난자로 출력합니다. esbbs.cgi 및 esbbs.cgi에 일반적인 esbbs.cgi의 \"evacuee\" HXL 가져오기 및 이메일 TXT 저장 형식을 지원합니다. 메모에는 개인별 모든 부스 참여 및 자재 수령 내역(날짜/시간, 이름, 수량, 장소, 터미널)이 포함됩니다. 자동으로 CGI로 전송되지 않습니다.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"CGI 측은 \"항목 이름: 값\" 한 줄을 분석하므로 CGI 노트의 줄 바꿈은 \"/\"로 그룹화됩니다. 특수 문자는 CGI 표시를 위해 안전하게 만들어졌습니다. 원본 메모의 줄 바꿈 및 문자열은 일반적으로 CSV 및 JSON에 유지됩니다. HXL 가져오기는 CGI 측에서 중복 제거 기능이 없으므로 동일한 CSV를 반복적으로 가져오면 중복됩니다.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON은 ID별로 기존 데이터와 통합되며, 추가 데이터는 연결된 동일한 앱에 공유됩니다. 동일한 파일을 다시 가져와도 기록이 증가하지 않습니다. 동일한 작업으로 백업을 선택하십시오. 재설정 이력도 반영됩니다. 이전 버전의 출입국 CSV는 사람과 출입국만 가져올 수 있습니다. 장치 설정 및 재료 목록은 CSV로 복원할 수 없습니다.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"입장 횟수에는 시설 복귀 횟수가 포함되며, 퇴장 횟수에는 임시 퇴실 및 공식 퇴실 횟수가 포함됩니다. 해당 기간 내 중복된 입장ID를 제외하여 인원수를 계산합니다. 속성은 해당 기간 내 마지막 항목을 기준으로 합니다. 연령에는 연령별 답변이 없는 질문이 포함됩니다. 장소별, 기기별 인원수는 각각의 실제 인원수입니다. 각 테이블에는 모든 카테고리가 표시되고, 그래프에는 상위 12개 카테고리와 나머지 합계가 표시됩니다. 동기화 전 기록은 포함되지 않습니다.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Android 설정 → 앱 → Delta Chat → 권한 → 카메라를 확인하세요. 브라우저를 사용하는 경우 브라우저 측에서 권한을 확인하세요. 권한을 허용하더라도 델타챗 버전이나 Webxdc 측의 제한으로 인해 라이브 카메라가 거부될 수 있습니다. 앱에서는 취소가 불가능하므로 이미지를 선택하거나 사진을 찍어보세요.","女性":"여성","男性":"남성","その他":"기타","会議室A":"회의실 A","会議室B":"회의실 B","80歳以上":"80세 이상","メイン会場":"메인 장소","回答しない":"응답하지 않음","年齢（年代）":"연령대","{0}〜{1}歳":"{0}–{1}세","ブース・物資の登録画面へ":"부스·물품 등록 화면으로","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"단말 이름·장소·소리·사용 모드·표시 언어·전용 버튼 설정도 가져오기","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"관리자에게 부스와 물품 이름 등록을 요청한 후 같은 첨부 앱에서 등록 정보를 받으세요.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"등록된 부스·물품이 없습니다. 분류 제목은 선택할 수 없습니다. 관리자가 이름을 등록하면 선택할 수 있습니다.","出力失敗:":"출력 실패:","読取処理:":"읽기 처리:","引き継ぎ完了：":"이전 완료:","画像出力失敗:":"이미지 출력 실패:","画像読取失敗：":"이미지 읽기 실패:","CGI出力失敗:":"CGI 출력 실패:","レポート出力失敗:":"보고서 출력 실패:","QRを解析しています（":"QR 구문 분석(","QR生成に失敗しました":"QR 생성 실패","バックアップ作成失敗:":"백업 생성 실패:","QR再発行に失敗しました":"QR 재발급 실패","QR読取済み・記録なし：":"QR 스캔/기록 없음:","件の履歴イベントを追加しました":"추가된 역사적 사건","QRを確認しましたが記録できませんでした。":"QR을 확인했는데 녹음이 안되네요.","既存の同じIDと内容が異なるため取り込めません:":"기존 동일 ID와 콘텐츠가 다르기 때문에 가져올 수 없습니다.","さんのQRを同じIDで再発行しました。保存・印刷できます":"동일한 ID로 QR을 재발급해 드렸습니다. 저장 및 인쇄 가능","性別":"성별","取込できません:":"가져올 수 없음:","ファイルを確認しています":"파일 확인 중","CSVが空です":"CSV가 비어 있습니다.","行目の列数が不正です":"행의 열 개수가 잘못되었습니다.","CSVは10万行までです":"CSV는 최대 100,000행입니다.","CSVの人物情報が不正です":"CSV의 개인정보가 올바르지 않습니다.","履歴イベントは10万件までです":"최대 100,000개의 역사적 사건","行目の日時・区分・氏名が不正です":"행의 날짜/시간/범주/이름이 잘못되었습니다.","不正な履歴イベントが含まれています":"잘못된 기록 이벤트가 포함되어 있습니다.","同じIDに異なる記録が含まれています":"동일한 ID에 다른 기록이 포함되어 있습니다.","対応するバックアップ形式ではありません":"지원되는 백업 형식이 아닙니다.","ファイルの内容が破損または変更されています":"파일 내용이 손상되었거나 변경되었습니다.","入退場CSVではありません。参加・受取CSVの移行にはJSONバックアップを使ってください":"이것은 진입/퇴출 CSV가 아닙니다. 참여/영수증 CSV를 마이그레이션하려면 JSON 백업을 사용하세요."},"vi":{"火":"thứ ba","管":"A","金":"Thứ Sáu","月":"Thứ hai","件":"hồ sơ","個":"đồ vật","人":"mọi người","水":"Thứ tư","土":"Thứ bảy","日":"mặt trời","入":"TRONG","木":"Thứ năm","1月":"tháng Giêng","1件":"1 bản ghi","2月":"tháng hai","3月":"tháng ba","4月":"tháng tư","5月":"tháng năm","6月":"tháng sáu","7月":"tháng bảy","8月
