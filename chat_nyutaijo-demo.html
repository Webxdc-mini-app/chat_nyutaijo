्कने योजना बनाउनुहुन्छ। उनीहरूलाई स्वीकार गरिरहने व्यक्तिहरूको सङ्ख्यामा समावेश गरिनेछ, र जब उनीहरू फर्किन्छन्, उनीहरूलाई ``फिर्ने'' भनी रेकर्ड गरिनेछ।","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"उपलब्ध क्यामेराहरू फेला परेनन्। तस्बिरहरू चयन गर्ने र तस्बिरहरू खिच्ने प्रयास गर्नुहोस्।","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"क्यामेरा सुरु गर्न सकिएन। कृपया पुन: प्रयास गर्नुहोस् वा छवि चयन गर्नुहोस्/तस्बिर लिनुहोस्।","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"यो स्वागत र दर्ताको लागि मोड हो। एकत्रीकरण र रिपोर्टहरू प्रशासक टर्मिनलबाट प्रयोग गर्न सकिन्छ।","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"नोटहरू प्रविष्ट गर्नुहोस्, उद्योग/कम्पनी/विभाग/स्थिति/टेलिफोन/इमेल, प्रविष्टि/निकास वर्गीकरण र अन्तिम पठन टर्मिनल","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"मैले मेरो आईडी दर्ता गरें र QR उत्पन्न गरें। अन्य टर्मिनलहरूले यसलाई प्राप्त गरेपछि दर्ता जानकारी पढ्न सक्छन्।","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"कृपया छविहरू 50MB भन्दा कम राख्नुहोस्। QR वरपरको क्षेत्र काट्दा यसलाई पढ्न सजिलो हुनेछ।","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"यदि तपाइँ स्वीकृति समाप्त गर्न चाहनुहुन्छ भने। उनीहरूलाई भर्ना गरिरहने व्यक्तिहरूको संख्याबाट बहिष्कृत गरिनेछ, र मिति र समय छोड्ने CGI मा आउटपुट हुनेछ।","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"म प्रिन्ट स्क्रिन खोल्न सक्दिन। कृपया सेभ/सेयर रिपोर्ट HTML बाट आफ्नो ब्राउजरमा खोल्नुहोस्","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"PNG वा JPEG जस्ता QR छवि चयन गर्नुहोस्। तपाईं उही छवि चयन गरेर फेरि प्रयास गर्न सक्नुहुन्छ।","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"यो प्रदर्शन वातावरणमा लाइभ क्यामेरा उपलब्ध छैन। तस्बिरहरू चयन गर्ने र तस्बिरहरू खिच्ने प्रयास गर्नुहोस्।","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"साझेदारी स्कोप: एउटै च्याटमा सबै सहभागीहरू। व्यवस्थापन मोड टर्मिनल भित्र एक प्रदर्शन स्विच हो। नपठाइएका वस्तुहरूको सङ्ख्या:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"माथिको \"नाम\" फिल्डमा व्यक्तिको नाम प्रविष्ट गर्नुहोस्। एउटै परिवारका प्रत्येक व्यक्तिको लागि QR जारी गरिनेछ र रेकर्ड गरिनेछ।","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"क्यामेरा सुरु गर्न सकिएन। कृपया अर्को एपको क्यामेरा बन्द गर्नुहोस् र पुन: प्रयास गर्नुहोस्, वा छवि चयन गर्नुहोस्।","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"परम्परागत निकासका कारण वर्गीकरण पुष्टि भएन: {0} मानिसहरू। यो रेकर्डको अवस्था हो। कृपया रोल कल र सुरक्षा पुष्टिकरणको साथ जाँच गर्नुहोस्।","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"छवि चयनको लागि लाइभ क्यामेरा रोकियो। यदि तपाईं पछाडि जान चाहनुहुन्छ भने, \"क्यामेरा पुन: प्रयास गर्नुहोस्\" थिच्नुहोस्।","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"क्यामेराको प्रतिक्रियाको प्रतीक्षा गर्दै। कृपया अनुमति स्क्रिन जाँच गर्नुहोस् वा तल छवि चयन/फोटो खिच्ने विकल्प प्रयोग गर्नुहोस्।","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"साझेदारी इतिहासमा प्रदर्शित हुनबाट सबै रेकर्डहरू बहिष्कार गर्नुहोस्। विगतको सञ्चार डेटा, यन्त्र भण्डारण, र CSV मेटिने छैन।","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"डुप्लिकेट नम्बरहरू व्यक्ति आईडी द्वारा बहिष्कृत छन्। मात्रा प्रत्येक वस्तु र एकाइको लागि कुल हो। सूची वा योग्यताको निर्धारण समावेश गर्दैन।","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"दर्ता जानकारी फेला परेन। कृपया उही संलग्न एप सिंक गर्न वा JSON ब्याकअप पुनर्स्थापना गर्न निश्चित गर्नुहोस्।","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR फेला परेन। कृपया सम्पूर्ण QR र सेतो मार्जिन देखिने गरी यसलाई क्रप गर्नुहोस्, वा अझ उज्यालो तस्बिर लिनुहोस् र फेरि चयन गर्नुहोस्।","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"रेकर्ड बूथ सहभागिता र आपूर्ति को रसिद। तपाईंले चयन गर्नुभएको बटन यस यन्त्रमा सुरक्षित हुनेछ र तपाईंको प्रवेश/निकासबाट छुट्टै रेकर्ड गरिनेछ।","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"ब्राउजर डेमो: रेकर्डिङहरू यस ब्राउजरमा सुरक्षित हुनेछन्। डेल्टा च्याट टर्मिनलहरूमा सूचनाहरू पठाइने छैन।","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"दर्ता भएका व्यक्तिहरू: {0} / प्रवेश/निकास: {1} / सहभागी/प्राप्त गर्दै: {2} / नयाँ इतिहास घटनाहरू: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"स्थानमा प्रवेश गर्दा र छोड्दा, यो टर्मिनल आईडी, टर्मिनलको नाम र स्थान रेकर्ड गर्नुहोस्। टर्मिनल नाम कन्फिगरेसन पछि रेकर्डमा प्रतिबिम्बित हुनेछ।","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"जारी गरिएको/मुद्रित व्यक्ति QR स्क्यान गरिएको छ र प्रविष्टि/निकासको रूपमा रेकर्ड गरिएको छ। एउटै च्याट भित्र साझेदारी गर्नुहोस् (संचार स्थितिको आधारमा ढिलाइ हुन सक्छ)।","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"यो आईडी दर्ता नगरिएको छ वा दर्ता गरिएको जानकारी सिङ्क्रोनाइज गरिएको छैन। जारी गर्ने टर्मिनल जस्तै च्याट दर्ता जानकारी प्राप्त गरेपछि कृपया पुन: पढ्नुहोस्।","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"दर्ता गरिएको जानकारीको साथ QR पुन: प्रदर्शन गर्नुहोस्। सम्पादन परिवर्तनहरू बचत गरिने छैन। हराएको QR पुन: जारी गरिए पनि अमान्य हुने छैन।","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / स्थान: {2} / टर्मिनल: {3} / प्रकार: {4} / लक्ष्य: {5} / खोज: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"अधिकतम 12 टुक्रा। प्रकारहरूको दर्ता र मेटाउन प्रशासकको \"बुथ/आपूर्ति\" खण्डमा गर्न सकिन्छ। बुथ सहभागिताको लागि, एक स्क्यानले एक व्यक्तिको सहभागिता रेकर्ड गर्दछ।","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"दिनको समय, महिना, र हप्ताको दिन, यसले अवधि, स्थान, र पठन टर्मिनलको सर्तहरू पनि पछ्याउँछ। वर्षको अवधिका लागि मासिक ग्राफहरू समान महिनाहरू थप्छन्।","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"तपाईंको यन्त्र र डेल्टा च्याट अनुकूलतामा निर्भर गर्दै, तपाईंले फोटो लिन वा फाइल चयन गर्न सक्नुहुन्छ। यो लाइभ क्यामेरा भन्दा फरक तरिका हो।","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"यो छवि ढाँचा प्रदर्शन गर्न सकिँदैन। कृपया PNG वा JPEG को रूपमा बचत गर्नुहोस् र फेरि चयन गर्नुहोस् (HEIC/HEIF वातावरणको आधारमा समर्थित छैन)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"प्रत्येक उपकरणको लागि चयन गर्नुहोस्। स्विचिङ बटन प्रदर्शन र हालको रेकर्ड वर्गीकरणमा लागू हुन्छ, र विगतका रेकर्डहरू, व्यक्ति आईडीहरू, घरपरिवारहरू, र सामग्री रसिद इतिहास परिवर्तन गर्दैन।","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"उद्योग, कम्पनी, विभाग, शीर्षक, नाम, ठेगाना, फोन, र इमेल प्रविष्ट गर्नुहोस् स्वचालित रूपमा एक स्वेच्छाचारी ID उत्पन्न गर्न र आईडीको साथ QR जारी गर्नुहोस्। यसलाई छाप्नुहोस् र व्यक्तिलाई वितरण गर्नुहोस्।","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"भर्नाको संख्याले भर्ना र फिर्ताहरूको संख्यालाई जनाउँछ, र बाहिरिने संख्याले परम्परागत रूपमा निकासहरू, अस्थायी आउटिङहरू, र आधिकारिक निकासहरूको रूपमा रेकर्ड गरिएका केसहरूको सङ्ख्यालाई जनाउँछ। कृपया \"Evacuate/Houshold\" अन्तर्गत हालको खाली गर्ने स्थिति जाँच गर्नुहोस्।","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"एक व्यक्तिको सम्बद्धता QR मुद्दा स्क्रिनमा बचत गरिएको छ। नाम एउटै भए पनि, घरपरिवारको परिचयपत्र फरक भए पनि, यो फरक घरपरिवार हो। सम्बद्धतामा परिवर्तन प्रत्येक व्यक्तिको लागि गरिन्छ। विगतको इतिहासमा घरपरिवार जानकारी पुन: लेखिनेछैन।","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"सामान्यतया, यसलाई बन्द गर्नुहोस् र नयाँ यन्त्र ID प्रयोग गर्नुहोस्। यदि तपाइँ यसलाई खोल्न चाहनुहुन्छ भने, कृपया मूल उपकरण प्रयोग गर्न बन्द गर्नुहोस्। विगतको इतिहासबाट यन्त्र ID दुवै अवस्थामा जस्तै राखिएको छ।","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"यसलाई प्रवेश गर्ने/बाहिर जाने र उपस्थित हुने व्यक्तिहरूको सङ्ख्यामा थपिने छैन। व्यक्तिहरूको वास्तविक संख्या नक्कल व्यक्ति आईडीहरू बाहेक गणना गरिनेछ, र मात्रा सामग्री/इकाई द्वारा गणना गरिनेछ। त्यहाँ योग्यता, सूची, वा डुप्लिकेट वितरणको कुनै स्वचालित निर्धारण हुनेछैन।","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"उद्योग, कम्पनी, विभाग, शीर्षक, नाम, ठेगाना, फोन, र इमेल प्रविष्ट गर्नुहोस् स्वचालित रूपमा एक स्वेच्छाचारी ID उत्पन्न गर्न र आईडीको साथ QR जारी गर्नुहोस्। यसलाई छाप्नुहोस्, यसलाई वितरण गर्नुहोस्, यसलाई स्थानमा स्क्यान गर्नुहोस्, र एकैचोटि प्रवेश र बाहिर निस्कनुहोस्।","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"एउटै संलग्न एप भित्र सूची साझेदारी गर्नुहोस्। मेटाइएका वस्तुहरू समर्पित बटन प्रयोग गरेर नयाँ रेकर्ड गर्न सकिँदैन, तर विगतको सहभागिता र रसिद इतिहास रहनेछ। अर्को यन्त्रमा, परिवर्तनहरू प्राप्त भएपछि प्रतिबिम्बित हुनेछन्।","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"नाम, व्यक्ति आईडी, घरपरिवारको नाम, कम्पनी, फोन, र इमेल मार्फत दर्ता व्यक्ति खोज्नुहोस्, पहिचान पुष्टि गर्नुहोस्, र \"उही ID संग पुन: जारी QR\" थिच्नुहोस्। व्यक्तिगत जानकारी, प्रवेश/निकास, सहभागिता, आपूर्तिको रसिद, र घरायसी इतिहास वंशानुगत हुनेछ।","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"क्यामेराको पहुँच अस्वीकार गरिएको छ। कृपया आफ्नो यन्त्रको क्यामेरा अनुमतिहरू जाँच गर्नुहोस्। यो पनि डेल्टा च्याट/Webxdc पक्षमा प्रतिबन्धहरूको कारणले अस्वीकार गरिनेछ, त्यसैले यदि तपाईंसँग अनुमति छ भने, कृपया छवि चयन गर्ने वा फोटो खिच्ने प्रयास गर्नुहोस्।","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"ग्राफले 12 वर्गीकरण र बाँकी कुल देखाउँछ। सबै वर्गीकरणहरू तलको तालिकामा र छापिएको रिपोर्टमा सूचीबद्ध छन्। प्रत्येक टर्मिनल ग्राफको लेबल टर्मिनल ID को अन्तिम 8 वर्णहरू हो, र आधिकारिक ID र टर्मिनल नाम तलको तालिकामा फेला पार्न सकिन्छ। पुरानो रेकर्डले वास्तविक टर्मिनल पहिचान गर्न सक्दैन।","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"प्रारम्भिक सेटिङ बन्द छ। कृपया प्रकाशित गर्ने अनुमति पुष्टि गर्नेहरूका लागि मात्र यसलाई सक्रिय गर्नुहोस्। संलग्न CGI को निर्णय विनिर्देशहरू अनुसार, बन्द हुँदा, सार्वजनिक निर्णय शब्दहरू जस्तै नोटहरू प्रदर्शनको लागि क्यारेक्टर सन्दर्भहरूमा रूपान्तरण गरिन्छ, र जब सक्रिय हुन्छ, प्रकाशनको लागि स्पष्ट चिन्ह थपिन्छ।","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"तोकिएको अवधि/स्थलमा भर्नाको रेकर्ड भएको आईडीहरू एक व्यक्तिको रूपमा गणना गरिनेछ। विशेषता अवधि भित्रको अन्तिम प्रविष्टि बिन्दु हो। उमेर र लिङ्ग दर्ता नभएको इतिहासलाई \"अनुत्तरित\" मानिनेछ। प्रत्येक स्थान र टर्मिनलको लागि नक्कल नम्बरहरू हटाइएका छन्। सिंक्रोनाइज्ड रेकर्डिङहरू समावेश गर्दैन।","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"व्यक्तिहरू, प्रवेश/निकास, सहभागिता/प्राप्ति, बुथ/आपूर्ति/स्थान दर्ता इतिहास, नपठाइएका जानकारी, यन्त्रको नाम, प्रयोग मोड, र समर्पित बटन सेटिङहरू JSON मा सुरक्षित छन्। कृपया भण्डारण र साझेदारी गन्तव्यहरू जाँच गर्नुहोस् किनकि तिनीहरूमा व्यक्तिगत जानकारी समावेश छ। प्रशासनिक पासवर्ड र लगइन स्थिति समावेश गर्दैन।","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV सँग UTF-8 BOM छ, पहिलो लाइन स्तम्भको नाम हो, र दोस्रो लाइन HXL ट्याग हो। esbbs.cgi को evacuee कोटिमा आयात गर्नुहोस्। ZIP एक ढाँचा हो सर्भर प्रशासकहरूले निकाल्न र TXT लाई दुवै CGI को लागि साझा evacuee भण्डारण स्थानमा राख्न।","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"आउटपुट आगन्तुकहरू evacuees रूपमा। esbbs.cgi को \"evacuee\" HXL आयात र इमेल TXT भण्डारण ढाँचा sbbs.cgi र esbbs.cgi लाई समर्थन गर्दछ। नोटहरूमा प्रत्येक व्यक्तिको लागि सबै बुथ सहभागिता र सामग्री रसिद इतिहास (मिति/समय, नाम, मात्रा, स्थान, टर्मिनल) समावेश हुनेछ। यो स्वतः CGI मा पठाइने छैन।","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"CGI पक्षले \"वस्तुको नाम: मान\" को एकल रेखाको विश्लेषण गरेको हुनाले, CGI को लागि नोटहरूमा लाइन ब्रेकहरू \"/\" मा समूहबद्ध गरिएको छ। विशेष क्यारेक्टरहरू CGI डिस्प्लेको लागि सुरक्षित बनाइन्छ। मूल नोटहरूमा लाइन ब्रेक र क्यारेक्टर स्ट्रिङहरू सामान्यतया CSV र JSON मा राखिन्छन्। HXL आयातमा CGI साइडमा नक्कल हटाउने सुविधा छैन, त्यसैले यदि तपाईंले उही CSV बारम्बार आयात गर्नुभयो भने, यो नक्कल हुनेछ।","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON ID द्वारा अवस्थित डाटासँग एकीकृत गरिएको छ, र थप डाटा उही संलग्न एपमा साझेदारी गरिएको छ। उही फाइल पुन: आयात गरेर इतिहास बढाइने छैन। कृ ださい":"Información de registro no encontrada. Verificar sincronización y copia de seguridad","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Coloque el QR emitido en el marco. Lee y comparte grabaciones dentro del mismo chat.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"El QR contiene sólo el ID del visitante. La información personal se mostrará comparándola con la información registrada.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"Se obtendrá una vista previa de las primeras 20 personas y todas las personas seleccionadas se incluirán en el archivo.","ID方式のQRではありません。登録情報からQRを再発行してください":"No es un QR basado en identificación. Vuelva a emitir el QR de la información de registro.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Este stand/suministro ha sido eliminado. Por favor seleccione otro botón dedicado","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"No se puede iniciar la cámara en vivo. Utilice la explicación en pantalla y la lectura de imágenes.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"No se puede cargar el archivo de imagen. Guarde en una ubicación diferente e inténtelo de nuevo.","送信サイズ上限により共有できません。バックアップを保存してください":"No se puede compartir debido al límite de tamaño de envío. Por favor guarde una copia de seguridad","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"ID de edición: {0}. Los cambios realizados a la persona seleccionada se guardarán en la misma ID.","履歴の端末内保存に空きがありません。バックアップを保存してください":"No queda espacio en el almacenamiento del historial del dispositivo. Por favor guarde una copia de seguridad","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"Los últimos 200 elementos se muestran en el historial y todos los elementos se envían a CSV y a informes.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"No se ha configurado ningún botón dedicado. Agréguelo desde \"Configuración de botones dedicados\" a continuación.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Emisión/escaneo de QR de persona de entrada/salida • Terminal de miembro • Registro de registro/entrada/salida de QR","保存容量不足などにより取込を中止しました。既存データを保持しています":"La importación se canceló debido a espacio de almacenamiento insuficiente. Conserva los datos existentes","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Si planeas regresar. Se incluirán en el número de personas que seguirán siendo aceptadas y, cuando regresen, se registrarán como \"regresantes\".","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"No se encontraron cámaras disponibles. Intente seleccionar imágenes y tomar fotografías.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"No se puede iniciar la cámara. Inténtelo de nuevo o seleccione una imagen/tome una foto.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Esta es la modalidad de recepción y registro. La agregación y los informes se pueden utilizar desde la terminal del administrador.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Ingresar notas, industria/empresa/departamento/puesto/teléfono/correo electrónico, clasificación de entrada/salida y terminal de lectura final","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Registré mi identificación y generé un QR. Otros terminales pueden leer la información de registro después de recibirla.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Mantenga las imágenes por debajo de 50 MB. Recortar el área alrededor del QR facilitará su lectura.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Si desea cancelar la aceptación. Serán excluidos del número de personas que seguirán siendo admitidas y saldrán en el CGI fecha y hora de salida.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"No puedo abrir la pantalla de impresión. Ábralo en su navegador desde Guardar/Compartir informe HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Seleccione una imagen QR como PNG o JPEG. Puedes seleccionar la misma imagen e intentarlo de nuevo.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"La cámara en vivo no está disponible en este entorno de visualización. Intente seleccionar imágenes y tomar fotografías.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Alcance de uso compartido: todos los participantes en el mismo chat. El modo de gestión es un interruptor de visualización dentro del terminal. Número de artículos no enviados:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Ingrese el nombre de la persona en el campo \"Nombre\" de arriba. Se emitirá y registrará un QR para cada persona del mismo hogar.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"No se puede iniciar la cámara. Cierra la cámara de la otra aplicación e inténtalo de nuevo, o selecciona una imagen.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Clasificación no confirmada por salida convencional: personas {0}. Este es el estado de registro. Por favor verifique con pase de lista y confirmación de seguridad.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"La cámara en vivo se detuvo para seleccionar la imagen. Si desea retroceder, presione \"Reintentar cámara\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Esperando respuesta de la cámara. Consulte la pantalla de permisos o utilice la opción de selección de imágenes/captura de fotografías a continuación.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Excluya todos los registros para que no se muestren en el historial de uso compartido. Los datos de comunicaciones anteriores, el almacenamiento del dispositivo y el CSV no se eliminarán.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Los números duplicados se excluyen por identificación de persona. La cantidad es el total de cada artículo y unidad. No incluye inventario ni determinación de elegibilidad.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Información de registro no encontrada. Asegúrese de sincronizar la misma aplicación adjunta o restaurar la copia de seguridad JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR no encontrado. Recórtelo para que todo el QR y el margen blanco sean visibles, o tome una foto más brillante y seleccione nuevamente.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Registro de participación en stand y recepción de suministros. El botón que seleccione se guardará en este dispositivo y se grabará por separado de su entrada/salida.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Demostración del navegador: las grabaciones se guardarán en este navegador. Las notificaciones no se enviarán a las terminales de Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Personas registradas: {0} / Entrada/salida: {1} / Participando/recibiendo: {2} / Nuevos eventos del historial: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Al entrar y salir del lugar, registre la identificación de esta terminal, el nombre de la terminal y el lugar en ese momento. El nombre del terminal se reflejará en el registro después de la configuración.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"El QR de la persona emitido/impreso se escanea y registra como entrada/salida. Compartir dentro del mismo chat (pueden ocurrir retrasos dependiendo del estado de la comunicación).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Esta identificación no está registrada o la información registrada no está sincronizada. Vuelva a leer después de recibir la misma información de registro de chat que el terminal emisor.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Vuelva a mostrar el QR con la información registrada. Los cambios de edición no se guardarán. Un QR perdido no será invalidado aunque se vuelva a emitir.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Lugar: {2} / Terminal: {3} / Tipo: {4} / Destino: {5} / Búsqueda: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Máximo de 12 piezas. El registro y eliminación de tipos se puede realizar en la sección \"Stand/Suministros\" del administrador. Para la participación en el stand, un escaneo registra la participación de una persona.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Por hora del día, mes y día de la semana, también sigue las condiciones del período, lugar y terminal de lectura. Los gráficos mensuales para períodos que abarcan años suman los mismos meses.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Dependiendo de su dispositivo y de la compatibilidad de Delta Chat, es posible que pueda tomar una foto o seleccionar un archivo. Este es un método diferente al de la cámara en vivo.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Este formato de imagen no se puede mostrar. Guarde como PNG o JPEG y seleccione nuevamente (HEIC/HEIF no es compatible según el entorno)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Seleccione para cada dispositivo. El cambio se aplica a la visualización del botón y a la clasificación de registros actuales, y no cambia registros anteriores, ID de personas, hogares ni historial de recepción de materiales.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Ingrese la industria, empresa, departamento, título, nombre, dirección, teléfono y correo electrónico para generar automáticamente una identificación arbitraria y emitir un QR solo con la identificación. Imprímelo y distribúyelo a la persona.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"El número de ingresos se refiere al número de ingresos y retornos, y el número de salidas se refiere al número de casos tradicionalmente registrados como salidas, salidas temporales y salidas oficiales. Verifique el estado actual de los evacuados en \"Evacuar/Hogar\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"La afiliación de una persona se guarda en la pantalla de emisión de QR. Incluso si el nombre es el mismo, si la identificación del hogar es diferente, es un hogar diferente. Los cambios de afiliación se realizan para cada persona. La información del hogar en el pasado no se reescribirá.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Normalmente, apáguelo y use una nueva ID de dispositivo. Si desea encenderlo, deje de usar el dispositivo original. La ID del dispositivo del historial pasado se mantiene como estaba en ambos casos.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"No se sumará al número de personas que entran/salen y asisten. El número real de personas se calculará excluyendo las identificaciones de personas duplicadas y la cantidad se calculará por material/unidad. No habrá determinación automática de elegibilidad, inventario o distribución duplicada.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Ingrese la industria, empresa, departamento, título, nombre, dirección, teléfono y correo electrónico para generar automáticamente una identificación arbitraria y emitir un QR solo con la identificación. Imprímelo, distribúyelo, escanéalo en el recinto y gestiona la entrada y salida al mismo tiempo.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Comparte la lista dentro de la misma aplicación adjunta. Los elementos eliminados no se pueden registrar nuevamente usando el botón dedicado, pero se mantendrá el historial de participación y recibos anteriores. En otro dispositivo, los cambios se reflejarán una vez recibidos.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Busque a la persona registrada por nombre, ID de persona, apellido, empresa, teléfono y correo electrónico, confirme la identidad y presione \"Reemitir QR con el mismo ID\". Se heredará la información personal, entrada/salida, participación, recepción de suministros e historial del hogar.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Se deniega el acceso a la cámara. Verifique los permisos de la cámara de su dispositivo. Esto también será rechazado debido a restricciones en el lado de Delta Chat/Webxdc, por lo que si tiene permiso, intente seleccionar una imagen o tomar una foto.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"En la gráfica se muestran hasta 12 clasificaciones y el total restante. Todas las clasificaciones se enumeran en la siguiente tabla y en el informe impreso. La etiqueta para cada gráfico de terminal son los últimos 8 caracteres del ID del terminal, y el ID oficial y el nombre del terminal se pueden encontrar en la siguiente tabla. El registro antiguo no puede identificar el terminal real.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"La configuración inicial es APAGADO. Actívelo solo para aquellos que hayan confirmado su permiso para publicar. De acuerdo con las especificaciones de valoración del CGI adjunto, cuando está desactivado, las palabras de juicio público, como notas, se convierten en referencias de caracteres para su visualización, y cuando está activado, se agrega una marca explícita para publicación.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Las identificaciones con registro de admisión durante el período/lugar especificado se contarán como una sola persona. El atributo es el último punto de entrada dentro del período. Los antecedentes cuya edad y sexo no estén registrados se considerarán \"sin respuesta\". Se excluyen los números duplicados para cada sede y terminal. No incluye grabaciones no sincronizadas.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Las personas, la entrada/salida, la participación/recibo, el historial de registro de stand/suministro/lugar, la información no enviada, el nombre del dispositivo, el modo de uso y la configuración de los botones dedicados se guardan en JSON. Verifique los destinos de almacenamiento y uso compartido, ya que contienen información personal. No incluye contraseña administrativa ni estado de inicio de sesión.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV tiene una lista de materiales UTF-8, la primera línea es el nombre de la columna y la segunda línea es la etiqueta HXL. Importar en la categoría de evacuados de esbbs.cgi. ZIP es un formato para que los administradores de servidores extraigan y coloquen TXT en la ubicación de almacenamiento común de los evacuados para ambos CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Enviar a los visitantes como evacuados. Admite el formato de almacenamiento TXT de correo electrónico e importación HXL \"evacuee\" de esbbs.cgi común a sbbs.cgi y esbbs.cgi. Las notas incluirán toda la participación en el stand y el historial de recepción de materiales (fecha/hora, nombre, cantidad, lugar, terminal) para cada persona. No se enviará automáticamente a CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Dado que el lado CGI analiza una sola línea de \"nombre del elemento: valor\", los saltos de línea en las notas para CGI se agrupan en \"/\". Los caracteres especiales se hacen seguros para la visualización CGI. Los saltos de línea y las cadenas de caracteres de las notas originales normalmente se conservan en CSV y JSON. La importación HXL no tiene eliminación de duplicados en el lado CGI, por lo que si importa el mismo CSV repetidamente, se duplicará.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON se integra con los datos existentes por ID y los datos adicionales se comparten con la misma aplicación adjunta. El historial no aumentará al volver a importar el mismo archivo. Seleccione una copia de seguridad con la misma operación. El historial de reinicio también se refleja. La versión anterior de CSV de entrada/salida solo puede importar personas y entradas/salidas. La configuración del dispositivo y las listas de materiales no se pueden restaurar con CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"El número de ingresos incluye el regreso a la instalación y el número de salidas incluye las salidas temporales y las salidas oficiales. Calcule la cantidad de personas excluyendo las identificaciones de admisión duplicadas dentro del período. Los atributos corresponden a la última entrada dentro del período. La edad incluye preguntas sin respuesta por grupo de edad. El número de personas por lugar y dispositivo es el número real de personas en cada uno. Cada tabla muestra todas las categorías y el gráfico muestra las 12 categorías principales y el total restante. No se incluyen los registros anteriores a la sincronización.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Verifique Configuración de Android → Aplicaciones → Delta Chat → Permisos → Cámara. Si utiliza un navegador, verifique los permisos en el lado del navegador. Incluso si permite el permiso, es posible que se le niegue la cámara en vivo debido a restricciones en la versión de Delta Chat o en el lado de Webxdc. Dado que no se puede cancelar desde la aplicación, intente seleccionar una imagen o tomar una foto.","女性":"Mujer","男性":"masculino","その他":"Otro","会議室A":"Habitación A","会議室B":"Habitación B","80歳以上":"80 años y más","メイン会場":"Lugar principal","回答しない":"Prefiero no decir","年齢（年代）":"grupo de edad","{0}〜{1}歳":"{0}–{1} años","ブース・物資の登録画面へ":"Ir a la pantalla de registro de stand/suministros","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"También se conservan las configuraciones de nombre del dispositivo, lugar, sonido, modo de uso, idioma de visualización y botones dedicados.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Pida al administrador que registre los nombres de los puestos y suministros y reciba los datos en la misma aplicación adjunta.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"El stand/suministros no están registrados. No se pueden seleccionar encabezados de categoría. Puede seleccionarlo cuando el administrador registre el nombre.","出力失敗:":"Fallo de salida:","読取処理:":"Procesamiento de lectura:","引き継ぎ完了：":"Transferencia completada:","画像出力失敗:":"Fallo de salida de imagen:","画像読取失敗：":"Fallo en la lectura de imágenes:","CGI出力失敗:":"Fallo de salida CGI:","レポート出力失敗:":"Informe de error de salida:","QRを解析しています（":"Analizando QR (","QR生成に失敗しました":"Falló la generación de QR","バックアップ作成失敗:":"Fallo en la creación de la copia de seguridad:","QR再発行に失敗しました":"No se pudo volver a emitir el QR","QR読取済み・記録なし：":"QR escaneado/sin registro:","件の履歴イベントを追加しました":"Eventos históricos agregados","QRを確認しましたが記録できませんでした。":"Revisé el QR, pero no se pudo grabar.","既存の同じIDと内容が異なるため取り込めません:":"No se puede importar porque el contenido es diferente del mismo ID existente:","さんのQRを同じIDで再発行しました。保存・印刷できます":"Hemos reemitido tu QR con el mismo ID. Se puede guardar e imprimir.","性別":"Género","取込できません:":"No se puede importar:","ファイルを確認しています":"Comprobando archivo","CSVが空です":"CSV está vacío","行目の列数が不正です":"El número de columnas en la fila no es válido.","CSVは10万行までです":"CSV tiene hasta 100.000 filas","CSVの人物情報が不正です":"La información de la persona en CSV es incorrecta","履歴イベントは10万件までです":"Hasta 100.000 acontecimientos históricos","行目の日時・区分・氏名が不正です":"La fecha/hora/categoría/nombre en la línea no es válida","不正な履歴イベントが含まれています":"Contiene un evento de historial no válido","同じIDに異なる記録が含まれています":"El mismo ID contiene diferentes registros","対応するバックアップ形式ではありません":"No es un formato de copia de seguridad compatible","ファイルの内容が破損または変更されています":"El contenido del archivo está dañado o alterado.","入退場CSVではありません。参加・受取CSVの移行にはJSONバックアップを使ってください":"Este no es un CSV de entrada/salida. Utilice una copia de seguridad JSON para migrar el CSV de participación/recibo."},"fr":{"火":"mar.","管":"Un","金":"vendredi","月":"lundi","件" :"En attente de l'autorisation/activation de la caméra. La sélection d'images est également disponible.","画像が大きすぎます。QR周辺を切り抜いて選び直してください":"L'image est trop grande. Veuillez découper la zone autour du QR et resélectionner-la.","出力対象者全員をsbbs.cgiの氏名の公開検索対象にする":"Rendre toutes les cibles de sortie publiques des cibles de recherche pour les noms dans sbbs.cgi","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Entrez le nom du foyer et cliquez sur « Générer un QR » pour l'enregistrer avec la personne.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Veuillez saisir le « nom » de la personne. Il s'agit d'un champ distinct de \"Nom du ménage\".","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Nombre de visiteurs : {0} personnes / Entrée : {1} fois / Sortie : {2} fois","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Ceux qui entrent dans le lieu de l'événement sont appelés « Entrée » et ceux qui quittent le lieu sont appelés « Sortie ».","登録情報が見つかりません。同期やバックアップを確認してください":"Informations d'inscription introuvables. Vérifier la synchronisation et la sauvegarde","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Placez le QR émis dans le cadre. Lisez et partagez des enregistrements au sein du même chat.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"Le QR contient uniquement l'identifiant du visiteur. Les informations personnelles seront affichées en les comparant avec les informations enregistrées.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"Les 20 premières personnes seront prévisualisées et toutes les personnes restreintes seront sorties dans le fichier.","ID方式のQRではありません。登録情報からQRを再発行してください":"Il ne s'agit pas d'un QR basé sur l'identification. Veuillez réémettre le QR à partir des informations d'inscription.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Ce stand/fourniture a été supprimé. Veuillez sélectionner un autre bouton dédié","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Impossible de démarrer la caméra en direct. Veuillez utiliser l'explication de l'écran et la lecture de l'image.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Impossible de charger le fichier image. Veuillez enregistrer à un autre emplacement et réessayer","送信サイズ上限により共有できません。バックアップを保存してください":"Ne peut pas être partagé en raison de la limite de taille d'envoi. Veuillez enregistrer une sauvegarde","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"ID d'édition : {0}. Les modifications apportées à la personne sélectionnée seront enregistrées sous le même identifiant.","履歴の端末内保存に空きがありません。バックアップを保存してください":"Il n'y a plus d'espace dans le stockage de l'historique de l'appareil. Veuillez enregistrer une sauvegarde","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"Les 200 derniers éléments sont affichés dans l'historique et tous les éléments sont générés au format CSV et dans les rapports.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Aucun bouton dédié n'a été défini. Veuillez l'ajouter à partir des « Paramètres des boutons dédiés » ci-dessous.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Émission/numérisation des QR de personne d'entrée/sortie • Terminal membre • Enregistrement QR d'enregistrement/entrée/sortie","保存容量不足などにより取込を中止しました。既存データを保持しています":"L'importation a été annulée en raison d'un espace de stockage insuffisant. Conserve les données existantes","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Si vous envisagez de revenir. Ils seront inclus dans le nombre de personnes qui continueront d'être acceptées, et à leur retour, ils seront enregistrés comme « de retour ».","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Aucune caméra disponible n'a été trouvée. Essayez de sélectionner des images et de prendre des photos.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Impossible de démarrer la caméra. Veuillez réessayer ou sélectionner une image/prendre une photo.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"C'est le mode d'accueil et d'inscription. L'agrégation et les rapports peuvent être utilisés depuis le terminal administrateur.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Saisir des notes, secteur/entreprise/département/poste/téléphone/e-mail, classification d'entrée/sortie et terminal de lecture finale","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"J'ai enregistré ma pièce d'identité et généré un QR. D'autres terminaux peuvent lire les informations d'enregistrement après les avoir reçues.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Veuillez conserver les images sous 50 Mo. Découper la zone autour du QR facilitera la lecture.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Si vous souhaitez mettre fin à l'acceptation. Ils seront exclus du nombre de personnes qui continueront à être admises, et seront affichés à la date et à l'heure de sortie CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Je ne parviens pas à ouvrir l'écran d'impression. Veuillez ouvrir dans votre navigateur à partir de Enregistrer/Partager le rapport HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Sélectionnez une image QR telle que PNG ou JPEG. Vous pouvez sélectionner la même image et réessayer.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"La caméra en direct n'est pas disponible dans cet environnement d'affichage. Essayez de sélectionner des images et de prendre des photos.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Portée de partage : tous les participants à la même discussion. Le mode de gestion est un commutateur d'affichage au sein du terminal. Nombre d'éléments non envoyés :","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Entrez le nom de la personne dans le champ « Nom » ci-dessus. Un QR sera émis et enregistré pour chaque personne d’un même foyer.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Impossible de démarrer la caméra. Veuillez fermer l'appareil photo de l'autre application et réessayer, ou sélectionner une image.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Classement non confirmé pour cause de sortie conventionnelle : personnes {0}. C'est l'état des archives. Veuillez vérifier avec l'appel et la confirmation de sécurité.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"La caméra en direct a été arrêtée pour la sélection d'images. Si vous souhaitez revenir en arrière, appuyez sur « Réessayer la caméra ».","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"En attente de la réponse de la caméra. Veuillez vérifier l'écran d'autorisation ou utiliser l'option de sélection d'image/capture de photo ci-dessous.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Excluez tous les enregistrements de l’affichage dans l’historique de partage. Les données de communication antérieures, le stockage de l'appareil et le CSV ne seront pas supprimés.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Les numéros en double sont exclus par ID de personne. La quantité est le total pour chaque article et unité. N'inclut pas l'inventaire ni la détermination de l'éligibilité.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Informations d'inscription introuvables. Assurez-vous de synchroniser la même application attachée ou de restaurer la sauvegarde JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR introuvable. Veuillez la recadrer pour que l'intégralité du QR et la marge blanche soient visibles, ou prenez une photo plus lumineuse et sélectionnez à nouveau.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Enregistrez la participation au stand et la réception des fournitures. Le bouton que vous sélectionnez sera enregistré sur cet appareil et sera enregistré séparément de votre entrée/sortie.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Démo du navigateur : les enregistrements seront enregistrés dans ce navigateur. Aucune notification ne sera envoyée aux terminaux Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Personnes inscrites : {0} / Entrée/sortie : {1} / Participant/récepteur : {2} / Nouveaux événements historiques : {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Lorsque vous entrez et quittez le lieu, enregistrez cet identifiant de terminal, le nom du terminal et le lieu à ce moment-là. Le nom du terminal sera reflété dans l'enregistrement après la configuration.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"Le QR de personne émis/imprimé est scanné et enregistré comme entrée/sortie. Partagez au sein du même chat (des retards peuvent survenir en fonction de l'état de la communication).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Cet identifiant n'est pas enregistré ou les informations enregistrées ne sont pas synchronisées. Veuillez relire après avoir reçu les mêmes informations d'inscription au chat que le terminal émetteur.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Réaffichez le QR avec les informations enregistrées. Les modifications apportées ne seront pas enregistrées. Un QR perdu ne sera pas invalidé même s'il est réémis.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Lieu : {2} / Terminal : {3} / Type : {4} / Cible : {5} / Recherche : {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maximum de 12 pièces. L'enregistrement et la suppression des types peuvent être effectués dans la section \"Stand/Fournitures\" de l'administrateur. Pour la participation au stand, un scan enregistre la participation d'une personne.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Par heure de la journée, mois et jour de la semaine, il suit également les conditions de période, de lieu et de terminal de lecture. Les graphiques mensuels pour des périodes s'étendant sur plusieurs années additionnent les mêmes mois.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"En fonction de votre appareil et de la compatibilité de Delta Chat, vous pourrez peut-être prendre une photo ou sélectionner un fichier. Il s'agit d'une méthode différente de la caméra en direct.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Ce format d'image ne peut pas être affiché. Veuillez enregistrer au format PNG ou JPEG et sélectionner à nouveau (HEIC/HEIF n'est pas pris en charge selon l'environnement)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Sélectionnez pour chaque appareil. Le changement s'applique à l'affichage des boutons et à la classification actuelle des enregistrements, et ne modifie pas les enregistrements passés, les identifiants de personne, les ménages et l'historique des réceptions de matériel.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Entrez le secteur, l'entreprise, le département, le titre, le nom, l'adresse, le téléphone et l'e-mail pour générer automatiquement un identifiant arbitraire et émettre un QR avec uniquement l'identifiant. Imprimez-le et distribuez-le à la personne.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Le nombre d’admissions fait référence au nombre d’entrées et de retours, et le nombre de sorties fait référence au nombre de cas traditionnellement enregistrés comme sorties, sorties temporaires et sorties officielles. Veuillez vérifier le statut actuel de l'évacué sous « Évacuer/Maison ».","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"L'affiliation d'une personne est enregistrée sur l'écran d'émission du QR. Même si le nom est le même, si l’identifiant du foyer est différent, il s’agit d’un foyer différent. Les changements d'affiliation sont effectués pour chaque personne. Les informations sur les ménages dans l'histoire passée ne seront pas réécrites.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Normalement, désactivez-le et utilisez un nouvel identifiant d'appareil. Si vous souhaitez l'allumer, veuillez cesser d'utiliser l'appareil d'origine. L’ID de l’appareil de l’historique passé est conservé tel qu’il était dans les deux cas.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Il ne s’ajoutera pas au nombre de personnes entrant/sortant et participant. Le nombre réel de personnes sera calculé en excluant les identifiants de personne en double, et la quantité sera calculée par matériau/unité. Il n'y aura pas de détermination automatique de l'éligibilité, de l'inventaire ou de la distribution en double.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Entrez le secteur, l'entreprise, le département, le titre, le nom, l'adresse, le téléphone et l'e-mail pour générer automatiquement un identifiant arbitraire et émettre un QR avec uniquement l'identifiant. Imprimez-le, distribuez-le, numérisez-le sur place et gérez les entrées et les sorties en même temps.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Partagez la liste dans la même application ci-jointe. Les éléments supprimés ne peuvent pas être réenregistrés à l’aide du bouton dédié, mais l’historique des participations et des reçus passés restera. Sur un autre appareil, les modifications seront reflétées après leur réception.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Recherchez la personne enregistrée par nom, identifiant de personne, nom de famille, entreprise, téléphone et e-mail, confirmez l'identité et appuyez sur « Réémettre le QR avec le même identifiant ». Les informations personnelles, les entrées/sorties, la participation, la réception des fournitures et l'historique du ménage seront hérités.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"L'accès à la caméra est refusé. Veuillez vérifier les autorisations de la caméra de votre appareil. Cela sera également refusé en raison de restrictions du côté Delta Chat/Webxdc, donc si vous avez la permission, veuillez essayer de sélectionner une image ou de prendre une photo.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Le graphique montre jusqu'à 12 classifications et le total restant. Toutes les classifications sont répertoriées dans le tableau ci-dessous et dans le rapport imprimé. L'étiquette de chaque graphique de terminal est constituée des 8 derniers caractères de l'ID du terminal, et l'ID officiel et le nom du terminal se trouvent dans le tableau ci-dessous. L'ancien enregistrement ne permet pas d'identifier le véritable terminal.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"Le réglage initial est OFF. Veuillez l'activer uniquement pour ceux qui ont confirmé leur autorisation de publication. Conformément aux spécifications de jugement du CGI ci-joint, lorsqu'il est désactivé, les mots de jugement publics tels que les notes sont convertis en références de caractères pour l'affichage, et lorsqu'il est activé, une marque explicite pour la publication est ajoutée.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Les pièces d’identité avec un dossier d’admission pendant la période/le lieu spécifié seront comptées pour une seule personne. L'attribut est le dernier point d'entrée dans la période. Les antécédents pour lesquels l’âge et le sexe ne sont pas enregistrés seront traités comme « sans réponse ». Les numéros en double pour chaque site et terminal sont exclus. N'inclut pas les enregistrements non synchronisés.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Les personnes, les entrées/sorties, les participations/réceptions, l'historique d'enregistrement des stands/approvisionnements/sites, les informations non envoyées, le nom de l'appareil, le mode d'utilisation et les paramètres des boutons dédiés sont enregistrés dans JSON. Veuillez vérifier les destinations de stockage et de partage car elles contiennent des informations personnelles. N'inclut pas le mot de passe administratif et le statut de connexion.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV a une nomenclature UTF-8, la première ligne est le nom de la colonne et la deuxième ligne est la balise HXL. Importer dans la catégorie des personnes évacuées de esbbs.cgi. ZIP est un format permettant aux administrateurs de serveur d'extraire et de placer TXT dans l'emplacement de stockage commun des évacués pour les deux CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Sortir les visiteurs comme évacués. Prend en charge l'importation HXL « évacué » d'esbbs.cgi et le format de stockage TXT par courrier électronique commun à sbbs.cgi et esbbs.cgi. Les notes incluront toute la participation au stand et l'historique de réception du matériel (date/heure, nom, quantité, lieu, terminal) pour chaque personne. Il ne sera pas automatiquement envoyé à CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Étant donné que le côté CGI analyse une seule ligne de « nom de l'élément : valeur », les sauts de ligne dans les notes pour CGI sont regroupés en « / ». Les caractères spéciaux sont sécurisés pour l'affichage CGI. Les sauts de ligne et les chaînes de caractères dans les notes originales sont généralement conservés au format CSV et JSON. L'importation HXL ne supprime pas les doublons du côté CGI, donc si vous importez le même CSV à plusieurs reprises, il sera dupliqué.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON est intégré aux données existantes par ID et les données supplémentaires sont partagées avec la même application attachée. L'historique ne sera pas augmenté en réimportant le même fichier. Veuillez sélectionner une sauvegarde avec la même opération. L'historique de réinitialisation est également reflété. L'ancienne version du CSV d'entrée/sortie ne peut importer que des personnes et des entrées/sorties. Les paramètres de l'appareil et les listes de matériaux ne peuvent pas être restaurés avec CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Le nombre d’admissions comprend les retours dans l’établissement, et le nombre de sorties comprend les départs temporaires et les sorties officielles. Calculez le nombre de personnes en excluant les identifiants d'admission en double au cours de la période. Les attributs sont ceux de la dernière entrée dans la période. L'âge comprend les questions sans réponse par groupe d'âge. Le nombre de personnes par lieu et par appareil correspond au nombre réel de personnes dans chacun. Chaque tableau montre toutes les catégories et le graphique montre les 12 premières catégories et le total restant. Les enregistrements avant synchronisation ne sont pas inclus.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Vérifiez Paramètres Android → Applications → Delta Chat → Autorisations → Appareil photo. Si vous utilisez un navigateur, vérifiez les autorisations côté navigateur. Même si vous autorisez l'autorisation, la caméra en direct peut être refusée en raison de restrictions du côté de la version Delta Chat ou de Webxdc. Comme il ne peut pas être annulé depuis l'application, essayez de sélectionner une image ou de prendre une photo.","女性":"Femme","男性":"Mâle","その他":"Autre","会議室A":"Salle A","会議室B":"Salle B","80歳以上":"80 ans et plus","メイン会場":"Lieu principal","回答しない":"Je préfère ne pas dire","年齢（年代）":"Tranche d'âge","{0}〜{1}歳":"Années {0} à {1}","ブース・物資の登録画面へ":"Accédez à l’écran d’inscription au stand/fourniture","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Les paramètres relatifs au nom de l'appareil, au lieu, au son, au mode d'utilisation, à la langue d'affichage et aux boutons dédiés sont également conservés.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Demandez à l’administrateur d’enregistrer les noms des stands et des fournitures, puis recevez les données dans la même application jointe.","ブース・物資が を切り抜くと読み取りやすくなります":"Bitte halten Sie Bilder unter 50 MB. Das Ausschneiden des Bereichs um den QR erleichtert die Lesbarkeit.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Wenn Sie die Annahme beenden möchten. Sie werden aus der Anzahl der Personen, die weiterhin aufgenommen werden, ausgeschlossen und am CGI-Austrittsdatum und -uhrzeit ausgegeben.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Ich kann den Druckbildschirm nicht öffnen. Bitte öffnen Sie in Ihrem Browser „Bericht-HTML speichern/teilen“.","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Wählen Sie ein QR-Bild wie PNG oder JPEG. Sie können dasselbe Bild auswählen und es erneut versuchen.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Die Live-Kamera ist in dieser Anzeigeumgebung nicht verfügbar. Versuchen Sie, Bilder auszuwählen und Fotos aufzunehmen.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Freigabebereich: Alle Teilnehmer im selben Chat. Der Verwaltungsmodus ist ein Anzeigeschalter im Terminal. Anzahl der nicht gesendeten Artikel:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Geben Sie oben im Feld „Name“ den Namen der Person ein. Für jede Person im selben Haushalt wird ein QR ausgestellt und erfasst.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Kamera kann nicht gestartet werden. Bitte schließen Sie die Kamera der anderen App und versuchen Sie es erneut oder wählen Sie ein Bild aus.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Klassifizierung aufgrund konventioneller Ausfahrt nicht bestätigt: {0}-Personen. Dies ist der aktuelle Stand. Bitte überprüfen Sie dies anhand des Appells und der Sicherheitsbestätigung.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Die Live-Kamera wurde zur Bildauswahl angehalten. Wenn Sie zurückgehen möchten, klicken Sie auf „Kamera erneut versuchen“.","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Warten auf die Reaktion der Kamera. Bitte überprüfen Sie den Berechtigungsbildschirm oder verwenden Sie die Bildauswahl-/Fotoaufnahmeoption unten.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Alle Datensätze von der Anzeige im Freigabeverlauf ausschließen. Frühere Kommunikationsdaten, Gerätespeicher und CSV werden nicht gelöscht.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Doppelte Nummern sind per Personen-ID ausgeschlossen. Die Menge ist die Gesamtsumme für jeden Artikel und jede Einheit. Beinhaltet keine Bestandsaufnahme oder Feststellung der Berechtigung.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Registrierungsinformationen nicht gefunden. Bitte stellen Sie sicher, dass Sie dieselbe angehängte App synchronisieren oder die JSON-Sicherung wiederherstellen.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR nicht gefunden. Bitte schneiden Sie es so zu, dass der gesamte QR und der weiße Rand sichtbar sind, oder machen Sie ein helleres Foto und wählen Sie es erneut aus.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Notieren Sie die Teilnahme am Stand und den Erhalt der Lieferungen. Die von Ihnen gewählte Schaltfläche wird auf diesem Gerät gespeichert und getrennt von Ihrem Ein-/Ausstieg aufgezeichnet.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Browser-Demo: Aufnahmen werden in diesem Browser gespeichert. Benachrichtigungen werden nicht an Delta Chat-Terminals gesendet.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Registrierte Personen: {0} / Ein-/Austritt: {1} / Teilnehmende/Empfangende: {2} / Neue Verlaufsereignisse: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Notieren Sie beim Betreten und Verlassen des Veranstaltungsortes diese Terminal-ID, den Terminalnamen und den jeweiligen Veranstaltungsort. Der Terminalname wird nach der Konfiguration im Datensatz angezeigt.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"Der ausgegebene/ausgedruckte Personen-QR wird gescannt und als Ein-/Ausreise erfasst. Teilen Sie im selben Chat (je nach Kommunikationsstatus kann es zu Verzögerungen kommen).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Diese ID ist nicht registriert oder die registrierten Informationen sind nicht synchronisiert. Bitte lesen Sie es noch einmal, nachdem Sie die gleichen Chat-Registrierungsinformationen wie das ausstellende Terminal erhalten haben.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Zeigen Sie den QR erneut mit registrierten Informationen an. Bearbeitungsänderungen werden nicht gespeichert. Ein verlorener QR wird nicht ungültig, auch wenn er erneut ausgestellt wird.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Veranstaltungsort: {2} / Terminal: {3} / Typ: {4} / Ziel: {5} / Suche: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maximal 12 Stück. Die Registrierung und Löschung von Typen kann im Bereich „Stand/Zubehör“ des Administrators erfolgen. Bei der Standteilnahme erfasst ein Scan die Teilnahme einer Person.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Es richtet sich auch nach Tageszeit, Monat und Wochentag nach den Bedingungen des Zeitraums, des Veranstaltungsorts und des Leseterminals. Monatsdiagramme für Zeiträume über Jahre hinweg addieren die gleichen Monate.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Abhängig von Ihrem Gerät und der Delta Chat-Kompatibilität können Sie möglicherweise ein Foto aufnehmen oder eine Datei auswählen. Dies ist eine andere Methode als die Live-Kamera.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Dieses Bildformat kann nicht angezeigt werden. Bitte als PNG oder JPEG speichern und erneut auswählen (HEIC/HEIF wird je nach Umgebung nicht unterstützt)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Wählen Sie für jedes Gerät aus. Die Umstellung gilt für die Schaltflächenanzeige und die aktuelle Datensatzklassifizierung und hat keine Auswirkungen auf frühere Datensätze, Personen-IDs, Haushalte und den Materialeingangsverlauf.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Geben Sie Branche, Firma, Abteilung, Titel, Name, Adresse, Telefonnummer und E-Mail ein, um automatisch eine beliebige ID zu generieren und einen QR nur mit der ID auszustellen. Drucken Sie es aus und verteilen Sie es an die Person.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Die Zahl der Einweisungen bezieht sich auf die Zahl der Einweisungen und Rückkehrer, und die Zahl der Austritte bezieht sich auf die Zahl der Fälle, die traditionell als Ausreisen, vorübergehende Ausreisen und offizielle Ausreisen erfasst werden. Bitte prüfen Sie den aktuellen Evakuierungsstatus unter „Evakuieren/Haushalt“.","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Die Zugehörigkeit einer Person wird auf dem QR-Ausgabebildschirm gespeichert. Auch wenn der Name gleich ist und die Haushalts-ID unterschiedlich ist, handelt es sich um einen anderen Haushalt. Änderungen der Zugehörigkeit werden für jede Person vorgenommen. Haushaltsinformationen in der Vergangenheit werden nicht neu geschrieben.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Normalerweise schalten Sie es aus und verwenden Sie eine neue Geräte-ID. Wenn Sie es einschalten möchten, verwenden Sie das Originalgerät bitte nicht mehr. Die Geräte-ID aus der Vergangenheit bleibt in beiden Fällen unverändert erhalten.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Es wird nicht zur Anzahl der ein-/ausgehenden und anwesenden Personen hinzugerechnet. Die tatsächliche Anzahl der Personen wird durch Ausschluss doppelter Personen-IDs berechnet und die Menge wird nach Material/Einheit berechnet. Es findet keine automatische Bestimmung der Berechtigung, des Bestands oder der Duplikatverteilung statt.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Geben Sie Branche, Firma, Abteilung, Titel, Name, Adresse, Telefonnummer und E-Mail ein, um automatisch eine beliebige ID zu generieren und einen QR nur mit der ID auszustellen. Drucken Sie es aus, verteilen Sie es, scannen Sie es am Veranstaltungsort und verwalten Sie den Ein- und Ausgang sofort.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Geben Sie die Liste in derselben angehängten App frei. Gelöschte Artikel können über die entsprechende Schaltfläche nicht neu erfasst werden, die bisherige Teilnahme- und Empfangshistorie bleibt jedoch erhalten. Auf einem anderen Gerät werden die Änderungen nach dem Empfang übernommen.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Suchen Sie nach der registrierten Person nach Name, Personen-ID, Haushaltsname, Firma, Telefonnummer und E-Mail, bestätigen Sie die Identität und klicken Sie auf „QR mit derselben ID erneut ausstellen“. Persönliche Daten, Ein-/Ausreise, Teilnahme, Erhalt von Lieferungen und Haushaltsgeschichte werden vererbt.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Der Zugriff auf die Kamera wird verweigert. Bitte überprüfen Sie die Kameraberechtigungen Ihres Geräts. Dies wird aufgrund von Einschränkungen auf der Delta Chat/Webxdc-Seite ebenfalls verweigert. Wenn Sie also die Erlaubnis haben, versuchen Sie bitte, ein Bild auszuwählen oder ein Foto aufzunehmen.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Die Grafik zeigt bis zu 12 Klassifizierungen und die verbleibende Gesamtsumme. Alle Klassifizierungen sind in der folgenden Tabelle und im gedruckten Bericht aufgeführt. Die Bezeichnung für jedes Terminaldiagramm besteht aus den letzten 8 Zeichen der Terminal-ID. Die offizielle ID und der Terminalname finden Sie in der folgenden Tabelle. Der alte Datensatz kann das tatsächliche Terminal nicht identifizieren.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"Die Grundeinstellung ist AUS. Bitte schalten Sie es nur für diejenigen ein, die ihre Erlaubnis zur Veröffentlichung bestätigt haben. Gemäß den Beurteilungsspezifikationen des beigefügten CGI werden öffentliche Beurteilungswörter wie Notizen bei AUS zur Anzeige in Zeichenreferenzen umgewandelt, und bei EIN wird eine explizite Markierung für die Veröffentlichung hinzugefügt.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Ausweise mit einem Einlassnachweis für den angegebenen Zeitraum/Veranstaltungsort werden als eine Person gezählt. Das Attribut ist der letzte Einstiegspunkt innerhalb des Zeitraums. Anamnese, für die Alter und Geschlecht nicht erfasst sind, wird als „unbeantwortet“ behandelt. Doppelte Nummern pro Veranstaltungsort und Terminal sind ausgeschlossen. Nicht synchronisierte Aufnahmen sind nicht enthalten.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Personen, Ein-/Austritt, Teilnahme/Empfang, Registrierungsverlauf für Stand/Angebot/Veranstaltungsort, nicht gesendete Informationen, Gerätename, Nutzungsmodus und dedizierte Tasteneinstellungen werden in JSON gespeichert. Bitte überprüfen Sie die Speicher- und Freigabeziele, da diese personenbezogene Daten enthalten. Enthält kein Administratorkennwort und keinen Anmeldestatus.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV hat UTF-8 BOM, die erste Zeile ist der Spaltenname und die zweite Zeile ist das HXL-Tag. Import in die Evakuierungskategorie von esbbs.cgi. ZIP ist ein Format für Serveradministratoren, um TXT zu extrahieren und am gemeinsamen Evakuierungsspeicherort für beide CGIs abzulegen.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Besucher als Evakuierte ausgeben. Unterstützt den HXL-Import „evacuee“ von esbbs.cgi und das E-Mail-TXT-Speicherformat, das für sbbs.cgi und esbbs.cgi üblich ist. Zu den Notizen gehören die gesamte Standbeteiligung und die Materialeingangshistorie (Datum/Uhrzeit, Name, Menge, Veranstaltungsort, Terminal) für jede Person. Es wird nicht automatisch an CGI gesendet.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Da die CGI-Seite eine einzelne Zeile mit „Elementname: Wert“ analysiert, werden Zeilenumbrüche in Notizen für CGI in „/“ gruppiert. Sonderzeichen sind für die CGI-Anzeige sicher gemacht. Zeilenumbrüche und Zeichenfolgen in den Originalnotizen bleiben in CSV und JSON normalerweise erhalten. Beim HXL-Import gibt es auf der CGI-Seite keine Duplikatentfernung. Wenn Sie also dieselbe CSV-Datei wiederholt importieren, wird sie dupliziert.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON wird anhand der ID in vorhandene Daten integriert und die zusätzlichen Daten werden an dieselbe angehängte App weitergegeben. Der Verlauf wird durch einen erneuten Import derselben Datei nicht erhöht. Bitte wählen Sie ein Backup mit demselben Vorgang aus. Der Reset-Verlauf wird ebenfalls angezeigt. Die alte Version von Ein-/Austritt CSV kann nur Personen und Ein-/Austritt importieren. Geräteeinstellungen und Materiallisten können nicht mit CSV wiederhergestellt werden.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Die Anzahl der Aufnahmen umfasst die Rückkehr in die Einrichtung, die Anzahl der Ausgänge umfasst vorübergehende Abreisen und offizielle Ausgänge. Berechnen Sie die Anzahl der Personen, indem Sie doppelte Zutrittsausweise innerhalb des Zeitraums ausschließen. Die Attribute gelten ab dem letzten Eintrag innerhalb des Zeitraums. Alter umfasst unbeantwortete Fragen nach Altersgruppen. Die Anzahl der Personen nach Veranstaltungsort und Gerät ist die tatsächliche Anzahl der Personen pro Veranstaltungsort. Jede Tabelle zeigt alle Kategorien und die Grafik zeigt die Top-12-Kategorien und die verbleibende Gesamtsumme. Datensätze vor der Synchronisierung werden nicht berücksichtigt.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Überprüfen Sie die Android-Einstellungen → Apps → Delta Chat → Berechtigungen → Kamera. Wenn Sie einen Browser verwenden, überprüfen Sie die Berechtigungen auf der Browserseite. Selbst wenn Sie die Erlaubnis erteilen, kann die Live-Kamera aufgrund von Einschränkungen auf der Delta Chat-Version oder auf der Webxdc-Seite verweigert werden. Da es nicht über die App abgebrochen werden kann, versuchen Sie bitte, ein Bild auszuwählen oder ein Foto aufzunehmen.","女性":"Weiblich","男性":"Männlich","その他":"Andere","会議室A":"Raum A","会議室B":"Raum B","80歳以上":"80 Jahre und älter","メイン会場":"Hauptveranstaltungsort","回答しない":"Sag es lieber nicht","年齢（年代）":"Altersgruppe","{0}〜{1}歳":"{0}–{1} Jahre","ブース・物資の登録画面へ":"Gehen Sie zum Stand-/Lieferregistrierungsbildschirm","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Einstellungen für Gerätename, Veranstaltungsort, Ton, Nutzungsmodus, Anzeigesprache und dedizierte Tasten werden ebenfalls übernommen.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Bitten Sie die Verwaltung, Stand- und Materialnamen zu registrieren, und empfangen Sie die Daten in derselben angehängten App.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"Stand/Materialien sind nicht angemeldet. Kategorieüberschriften können nicht ausgewählt werden. Sie können es auswählen, wenn der Administrator den Namen registriert.","出力失敗:":"Ausgabefehler:","読取処理:":"Verarbeitung lesen:","引き継ぎ完了：":"Übertragung abgeschlossen:","画像出力失敗:":"Fehler bei der Bildausgabe:","画像読取失敗：":"Fehler beim Lesen des Bildes:","CGI出力失敗:":"CGI-Ausgabefehler:","レポート出力失敗:":"Ausgabefehler melden:","QRを解析しています（":"QR-Analyse (","QR生成に失敗しました":"Die QR-Generieru ميرا الحية غير متوفرة في بيئة العرض هذه. حاول اختيار الصور والتقاط الصور.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"نطاق المشاركة: جميع المشاركين في نفس الدردشة. وضع الإدارة هو مفتاح عرض داخل الجهاز. عدد العناصر غير المرسلة:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"أدخل اسم الشخص في حقل \"الاسم\" أعلاه. سيتم إصدار QR وتسجيله لكل شخص في نفس الأسرة.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"غير قادر على بدء تشغيل الكاميرا. يرجى إغلاق كاميرا التطبيق الآخر والمحاولة مرة أخرى، أو تحديد صورة.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"لم يتم تأكيد التصنيف بسبب الخروج التقليدي: أشخاص {0}. هذه هي حالة السجل. يرجى التحقق من نداء الأسماء وتأكيد السلامة.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"تم إيقاف الكاميرا الحية لاختيار الصورة. إذا كنت تريد العودة، اضغط على \"إعادة محاولة الكاميرا\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"في انتظار رد الكاميرا. يرجى التحقق من شاشة الأذونات أو استخدام خيار تحديد الصورة/التقاط الصورة أدناه.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"استبعاد كافة السجلات من الظهور في سجل المشاركة. لن يتم حذف بيانات الاتصال السابقة ومساحة تخزين الجهاز وملف CSV.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"يتم استبعاد الأرقام المكررة بواسطة معرف الشخص. الكمية هي الإجمالي لكل صنف ووحدة. لا يشمل المخزون أو تحديد الأهلية.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"لم يتم العثور على معلومات التسجيل. يرجى التأكد من مزامنة نفس التطبيق المرفق أو استعادة النسخة الاحتياطية لـ JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"لم يتم العثور على QR. يرجى قصها بحيث يظهر رمز الاستجابة السريعة والهامش الأبيض بالكامل، أو التقط صورة أكثر سطوعًا ثم حددها مرة أخرى.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"تسجيل مشاركة الكابينة واستلام الإمدادات. سيتم حفظ الزر الذي تحدده على هذا الجهاز وسيتم تسجيله بشكل منفصل عن الدخول/الخروج.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"عرض المتصفح: سيتم حفظ التسجيلات في هذا المتصفح. لن يتم إرسال الإخطارات إلى محطات Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"الأشخاص المسجلون: {0} / الدخول/الخروج: {1} / المشاركة/الاستلام: {2} / أحداث التاريخ الجديد: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"عند الدخول إلى المكان والخروج منه، قم بتسجيل معرف المحطة الطرفية واسم المحطة والمكان في ذلك الوقت. سينعكس اسم المحطة الطرفية في السجل بعد التكوين.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"يتم مسح QR للشخص الصادر/المطبوع وتسجيله كإدخال/خروج. المشاركة داخل نفس الدردشة (قد يحدث تأخير حسب حالة الاتصال).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"هذا المعرف غير مسجل أو لم تتم مزامنة المعلومات المسجلة. يرجى إعادة القراءة بعد تلقي نفس معلومات تسجيل الدردشة مثل محطة الإصدار.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"إعادة عرض QR بالمعلومات المسجلة. لن يتم حفظ تغييرات التحرير. لن يتم إبطال رمز QR المفقود حتى لو تم إعادة إصداره.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / المكان: {2} / المحطة الطرفية: {3} / النوع: {4} / الهدف: {5} / البحث: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"الحد الأقصى 12 قطعة. يمكن إجراء تسجيل وحذف الأنواع في قسم \"المقصورة/المستلزمات\" الخاص بالمسؤول. بالنسبة للمشاركة في المقصورة، يسجل مسح واحد مشاركة شخص واحد.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"حسب الوقت من اليوم والشهر واليوم من الأسبوع، فإنه يتبع أيضًا شروط الفترة والمكان ومحطة القراءة. الرسوم البيانية الشهرية لفترات تمتد لسنوات تضيف نفس الأشهر.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"اعتمادًا على جهازك وتوافق Delta Chat، قد تتمكن من التقاط صورة أو تحديد ملف. هذه طريقة مختلفة عن الكاميرا الحية.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"لا يمكن عرض تنسيق الصورة هذا. يرجى الحفظ بتنسيق PNG أو JPEG ثم التحديد مرة أخرى (HEIC/HEIF غير مدعوم وفقًا للبيئة)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"حدد لكل جهاز. ينطبق التبديل على عرض الأزرار وتصنيف السجلات الحالي، ولا يغير السجلات السابقة ومعرفات الأشخاص والأسر وتاريخ استلام المواد.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"أدخل الصناعة والشركة والقسم والمسمى الوظيفي والاسم والعنوان والهاتف والبريد الإلكتروني لإنشاء معرف عشوائي تلقائيًا وإصدار QR باستخدام المعرف فقط. اطبعها ووزعها على الشخص.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"يشير عدد الدخول إلى عدد المقبولين والعائدين، ويشير عدد الخروج إلى عدد الحالات المسجلة تقليديا كخروج ونزهات مؤقتة وخروج رسمي. يرجى التحقق من حالة الإخلاء الحالية ضمن \"إخلاء/منزل\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"يتم حفظ انتماء الشخص على شاشة إصدار QR. حتى لو كان الاسم هو نفسه، إذا كان معرف الأسرة مختلفًا، فهي أسرة مختلفة. يتم إجراء تغييرات على الانتماء لكل شخص. لن تتم إعادة كتابة المعلومات المنزلية في التاريخ الماضي.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"عادةً، قم بإيقاف تشغيله واستخدام معرف جهاز جديد. إذا كنت ترغب في تشغيله، يرجى التوقف عن استخدام الجهاز الأصلي. يتم الاحتفاظ بمعرف الجهاز من السجل الماضي كما كان في كلتا الحالتين.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"ولن يتم إضافته إلى عدد الأشخاص الداخلين/الخارجين والحاضرين. سيتم حساب العدد الفعلي للأشخاص من خلال استبعاد معرفات الأشخاص المكررة، وسيتم حساب الكمية حسب المادة/الوحدة. لن يكون هناك تحديد تلقائي للأهلية أو المخزون أو التوزيع المكرر.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"أدخل الصناعة والشركة والقسم والمسمى الوظيفي والاسم والعنوان والهاتف والبريد الإلكتروني لإنشاء معرف عشوائي تلقائيًا وإصدار QR باستخدام المعرف فقط. قم بطباعتها وتوزيعها ومسحها ضوئيًا في المكان وإدارة الدخول والخروج مرة واحدة.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"مشاركة القائمة داخل نفس التطبيق المرفق. لا يمكن تسجيل العناصر المحذوفة حديثًا باستخدام الزر المخصص، ولكن سيبقى سجل المشاركة والاستلام السابق. على جهاز آخر، سوف تنعكس التغييرات بعد تلقيها.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"ابحث عن الشخص المسجل حسب الاسم ومعرف الشخص واسم العائلة والشركة والهاتف والبريد الإلكتروني، وقم بتأكيد الهوية، ثم اضغط على \"إعادة إصدار QR بنفس المعرف\". سيتم توريث المعلومات الشخصية، والدخول/الخروج، والمشاركة، واستلام الإمدادات، وتاريخ الأسرة.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"تم رفض الوصول إلى الكاميرا. يرجى التحقق من أذونات الكاميرا بجهازك. سيتم رفض هذا أيضًا بسبب القيود المفروضة على جانب Delta Chat/Webxdc، لذا إذا كان لديك إذن، فيرجى محاولة تحديد صورة أو التقاط صورة.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"يعرض الرسم البياني ما يصل إلى 12 تصنيفًا والمجموع المتبقي. جميع التصنيفات مذكورة في الجدول أدناه وفي التقرير المطبوع. التسمية الخاصة بكل رسم بياني طرفي هي آخر 8 أحرف من معرف الجهاز الطرفي، ويمكن العثور على المعرف الرسمي واسم الجهاز الطرفي في الجدول أدناه. لا يمكن للسجل القديم تحديد المحطة الحقيقية.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"الإعداد الأولي هو OFF. يرجى تشغيله فقط لأولئك الذين أكدوا إذنهم بالنشر. وفقًا لمواصفات الحكم الخاصة بـ CGI المرفقة، عند إيقاف التشغيل، يتم تحويل كلمات الحكم العامة مثل الملاحظات إلى مراجع أحرف للعرض، وعندما يتم تشغيلها، تتم إضافة علامة صريحة للنشر.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"سيتم احتساب بطاقات الهوية التي لها سجل قبول خلال الفترة/المكان المحدد كشخص واحد. السمة هي نقطة الدخول الأخيرة خلال الفترة. سيتم التعامل مع التاريخ الذي لم يتم تسجيل العمر والجنس فيه على أنه \"بلا إجابة\". يتم استبعاد الأرقام المكررة لكل مكان ومحطة. لا يشمل التسجيلات غير المتزامنة.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"يتم حفظ الأشخاص، والدخول/الخروج، والمشاركة/الاستلام، وسجل تسجيل الكشك/التوريد/المكان، والمعلومات غير المرسلة، واسم الجهاز، ووضع الاستخدام، وإعدادات الزر المخصصة في JSON. يرجى التحقق من وجهات التخزين والمشاركة لأنها تحتوي على معلومات شخصية. لا يتضمن كلمة المرور الإدارية وحالة تسجيل الدخول.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"يحتوي HXL CSV على UTF-8 BOM، والسطر الأول هو اسم العمود، والسطر الثاني هو علامة HXL. قم بالاستيراد في فئة الأشخاص الذين تم إجلاؤهم لـ esbbs.cgi. ZIP هو تنسيق لمسؤولي الخادم لاستخراج TXT ووضعه في موقع تخزين الإخلاء المشترك لكلا CGIs.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"زوار الإخراج كما تم إجلاؤهم. يدعم تنسيق تخزين HXL \"evacuee\" الخاص بـ esbbs.cgi وتنسيق تخزين TXT عبر البريد الإلكتروني الشائع في sbbs.cgi وesbbs.cgi. ستتضمن الملاحظات كافة المشاركات في المقصورة وتاريخ استلام المواد (التاريخ/الوقت، الاسم، الكمية، المكان، المحطة) لكل شخص. ولن يتم إرساله تلقائيًا إلى CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"نظرًا لأن جانب CGI يقوم بتحليل سطر واحد من \"اسم العنصر: القيمة\"، يتم تجميع فواصل الأسطر في ملاحظات CGI في \"/\". أصبحت الأحرف الخاصة آمنة لعرض CGI. عادةً ما يتم الاحتفاظ بفواصل الأسطر وسلاسل الأحرف في الملاحظات الأصلية بتنسيق CSV وJSON. لا يتضمن استيراد HXL إزالة مكررة من جانب CGI، لذلك إذا قمت باستيراد نفس ملف CSV بشكل متكرر، فسيتم تكراره.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"يتم دمج JSON مع البيانات الموجودة بواسطة المعرف، وتتم مشاركة البيانات الإضافية مع نفس التطبيق المرفق. لن تتم زيادة السجل عن طريق إعادة استيراد نفس الملف. الرجاء تحديد نسخة احتياطية بنفس العملية. وينعكس أيضا إعادة تعيين التاريخ. يمكن للإصدار القديم من ملف الدخول/الخروج CSV استيراد الأشخاص والدخول/الخروج فقط. لا يمكن استعادة إعدادات الجهاز وقوائم المواد باستخدام ملف CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"ويشمل عدد الدخول العودة للمنشأة، وعدد الخروج يشمل المغادرة المؤقتة والمخارج الرسمية. احسب عدد الأشخاص عن طريق استبعاد معرفات القبول المكررة خلال هذه الفترة. السمات هي اعتبارًا من الإدخال الأخير خلال الفترة. العمر يشمل الأسئلة التي لم تتم الإجابة عليها حسب الفئة العمرية. عدد الأشخاص حسب المكان والجهاز هو العدد الفعلي للأشخاص في كل منهما. يعرض كل جدول جميع الفئات، ويعرض الرسم البياني أعلى 12 فئة والإجمالي المتبقي. لا يتم تضمين السجلات قبل المزامنة.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"تحقق من إعدادات Android ← التطبيقات ← Delta Chat ← الأذونات ← الكاميرا. إذا كنت تستخدم متصفحًا، فتحقق من الأذونات على جانب المتصفح. حتى إذا سمحت بالإذن، فقد يتم رفض الكاميرا المباشرة بسبب القيود المفروضة على إصدار Delta Chat أو جانب Webxdc. نظرًا لأنه لا يمكن إلغاؤه من التطبيق، يرجى محاولة تحديد صورة أو التقاط صورة.","女性":"أنثى","男性":"ذكر","その他":"أخرى","会議室A":"الغرفة أ","会議室B":"الغرفة ب","80歳以上":"80 سنة فما فوق","メイン会場":"المكان الرئيسي","回答しない":"يفضل عدم القول","年齢（年代）":"الفئة العمرية","{0}〜{1}歳":"{0} – {1} سنة","ブース・物資の登録画面へ":"انتقل إلى شاشة تسجيل الكابينة/التوريد","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"يتم أيضًا نقل إعدادات اسم الجهاز والمكان والصوت ووضع الاستخدام ولغة العرض والأزرار المخصصة.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"اطلب من المسؤول تسجيل أسماء الأجنحة والمواد، ثم استقبل بيانات التسجيل في نفس التطبيق المرفق.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"لم يتم تسجيل كشك/الإمدادات. لا يمكن تحديد عناوين الفئات. يمكنك تحديده عندما يقوم المسؤول بتسجيل الاسم.","出力失敗:":"فشل الإخراج:","読取処理:":"معالجة القراءة:","引き継ぎ完了：":"اكتمل النقل:","画像出力失敗:":"فشل إخراج الصورة:","画像読取失敗：":"فشل قراءة الصورة:","CGI出力失敗:":"فشل إخراج CGI:","レポート出力失敗:":"الإبلاغ عن فشل الإخراج:","QRを解析しています（":"تحليل QR (","QR生成に失敗しました":"فشل إنشاء QR","バックアップ作成失敗:":"فشل إنشاء النسخة الاحتياطية:","QR再発行に失敗しました":"فشلت إعادة إصدار QR","QR読取済み・記録なし："
