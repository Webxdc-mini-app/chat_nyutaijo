氏名の公開検索対象にする":"Đặt tất cả mục tiêu đầu ra thành mục tiêu tìm kiếm công khai cho tên trong sbbs.cgi","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Nhập tên hộ gia đình và nhấp vào \"Tạo QR\" để lưu với người đó.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Vui lòng nhập \"tên\" của người đó. Đây là một trường riêng biệt với \"Tên hộ gia đình\"","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Số lượng khách truy cập: {0} người / Vào: {1} lần / Thoát: {2} lần","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Những người vào địa điểm tổ chức sự kiện được gọi là ``Vào'' và những người rời khỏi địa điểm được gọi là ``Thoát.''","登録情報が見つかりません。同期やバックアップを確認してください":"Thông tin đăng ký không tìm thấy. Kiểm tra đồng bộ hóa và sao lưu","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Đặt mã QR đã phát hành vào khung. Đọc và chia sẻ bản ghi trong cùng một cuộc trò chuyện.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"QR chỉ chứa ID khách truy cập. Thông tin cá nhân sẽ được hiển thị bằng cách so sánh với thông tin đã đăng ký.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"20 người đầu tiên sẽ được xem trước và tất cả những người được thu hẹp sẽ được xuất ra tệp.","ID方式のQRではありません。登録情報からQRを再発行してください":"Nó không phải là QR dựa trên ID. Vui lòng cấp lại QR từ thông tin đăng ký.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Gian hàng/nguồn cung cấp này đã bị xóa. Vui lòng chọn một nút chuyên dụng khác","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Không thể khởi động máy ảnh trực tiếp. Vui lòng sử dụng giải thích trên màn hình và đọc hình ảnh.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Không thể tải tập tin hình ảnh. Vui lòng lưu vào một vị trí khác và thử lại","送信サイズ上限により共有できません。バックアップを保存してください":"Không thể chia sẻ do giới hạn kích thước gửi. Vui lòng lưu một bản sao lưu","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"ID chỉnh sửa: {0}. Những thay đổi đối với người đã chọn sẽ được lưu vào cùng một ID.","履歴の端末内保存に空きがありません。バックアップを保存してください":"Không còn chỗ trống trong bộ nhớ lịch sử của thiết bị. Vui lòng lưu một bản sao lưu","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"200 mục mới nhất được hiển thị trong lịch sử và tất cả các mục được xuất ra CSV và báo cáo.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Không có nút chuyên dụng nào được đặt. Vui lòng thêm nó từ \"Cài đặt nút chuyên dụng\" bên dưới.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Cấp/quét mã QR người nhập/xuất cảnh • Thiết bị đầu cuối thành viên • Hồ sơ đăng ký/nhập/xuất cảnh QR","保存容量不足などにより取込を中止しました。既存データを保持しています":"Quá trình nhập đã bị hủy do không đủ dung lượng lưu trữ. Giữ lại dữ liệu hiện có","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Nếu bạn có kế hoạch quay trở lại. Họ sẽ được tính vào số người tiếp tục được nhận, khi quay lại sẽ ghi là “trở lại”.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Không có máy ảnh có sẵn đã được tìm thấy. Hãy thử chọn hình ảnh và chụp ảnh.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Không thể khởi động máy ảnh. Vui lòng thử lại hoặc chọn một hình ảnh/chụp ảnh.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Đây là chế độ tiếp nhận và đăng ký. Tổng hợp và báo cáo có thể được sử dụng từ thiết bị đầu cuối quản trị viên.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Nhập ghi chú, ngành/công ty/bộ phận/vị trí/điện thoại/email, phân loại vào/ra và thiết bị đọc cuối cùng","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Tôi đã đăng ký ID của mình và tạo mã QR. Các thiết bị đầu cuối khác có thể đọc thông tin đăng ký sau khi nhận được.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Vui lòng giữ hình ảnh dưới 50 MB. Việc cắt bỏ khu vực xung quanh QR sẽ dễ đọc hơn.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Nếu bạn muốn chấm dứt sự chấp nhận. Họ sẽ bị loại khỏi số lượng người tiếp tục được nhận và sẽ được xuất ra vào ngày giờ rời khỏi CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Tôi không thể mở màn hình in. Vui lòng mở trong trình duyệt của bạn từ Lưu/Chia sẻ báo cáo HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Chọn hình ảnh QR như PNG hoặc JPEG. Bạn có thể chọn cùng một hình ảnh và thử lại.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Máy ảnh trực tiếp không khả dụng trong môi trường hiển thị này. Hãy thử chọn hình ảnh và chụp ảnh.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Phạm vi chia sẻ: Tất cả những người tham gia trong cùng một cuộc trò chuyện. Chế độ quản lý là một công tắc hiển thị trong thiết bị đầu cuối. Số mục chưa gửi:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Nhập tên của người đó vào trường \"Tên\" ở trên. QR sẽ được cấp và ghi lại cho mỗi người trong cùng một hộ gia đình.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Không thể khởi động máy ảnh. Vui lòng đóng camera của ứng dụng khác và thử lại hoặc chọn một hình ảnh.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Phân loại không được xác nhận do lối ra thông thường: người {0}. Đây là trạng thái kỷ lục. Vui lòng kiểm tra bằng điểm danh và xác nhận an toàn.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Máy ảnh trực tiếp đã bị dừng để chọn hình ảnh. Nếu muốn quay lại nhấn \"Thử lại camera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Đang chờ phản hồi của máy ảnh. Vui lòng kiểm tra màn hình cấp phép hoặc sử dụng tùy chọn chọn ảnh/chụp ảnh bên dưới.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Loại trừ tất cả các bản ghi được hiển thị trong lịch sử chia sẻ. Dữ liệu liên lạc trước đây, bộ nhớ thiết bị và CSV sẽ không bị xóa.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Các số trùng lặp được loại trừ theo ID người. Số lượng là tổng số của từng mặt hàng, đơn vị. Không bao gồm kiểm kê hoặc xác định tính đủ điều kiện.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Thông tin đăng ký không tìm thấy. Vui lòng đảm bảo đồng bộ hóa cùng một ứng dụng đính kèm hoặc khôi phục bản sao lưu JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"Không tìm thấy QR. Vui lòng cắt nó để hiển thị toàn bộ QR và lề trắng hoặc chụp ảnh sáng hơn và chọn lại.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Ghi lại việc tham gia gian hàng và nhận vật tư. Nút bạn chọn sẽ được lưu trên thiết bị này và sẽ được ghi riêng biệt với lệnh vào/ra của bạn.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Bản demo trình duyệt: bản ghi sẽ được lưu trong trình duyệt này. Thông báo sẽ không được gửi đến thiết bị đầu cuối Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Người đã đăng ký: {0} / Vào/ra: {1} / Tham gia/nhận: {2} / Sự kiện lịch sử mới: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Khi vào và ra khỏi địa điểm, hãy ghi lại ID nhà ga này, tên nhà ga và địa điểm tại thời điểm đó. Tên thiết bị đầu cuối sẽ được phản ánh trong bản ghi sau khi cấu hình.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"QR của người được cấp/in sẽ được quét và ghi lại dưới dạng nhập/xuất. Chia sẻ trong cùng một cuộc trò chuyện (sự chậm trễ có thể xảy ra tùy thuộc vào trạng thái liên lạc).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"ID này chưa được đăng ký hoặc thông tin đã đăng ký không được đồng bộ hóa. Vui lòng đọc lại sau khi nhận được thông tin đăng ký trò chuyện giống như thiết bị đầu cuối phát hành.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Hiển thị lại QR với thông tin đã đăng ký. Chỉnh sửa thay đổi sẽ không được lưu. Mã QR bị mất sẽ không bị vô hiệu ngay cả khi được cấp lại.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Địa điểm: {2} / Thiết bị đầu cuối: {3} / Loại: {4} / Mục tiêu: {5} / Tìm kiếm: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Tối đa 12 miếng. Việc đăng ký và xóa các loại có thể được thực hiện trong phần \"Gian hàng/Vật tư\" của quản trị viên. Để tham gia gian hàng, một lần quét sẽ ghi lại sự tham gia của một người.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Theo thời gian trong ngày, tháng và ngày trong tuần, nó cũng tuân theo các điều kiện về thời gian, địa điểm và thiết bị đọc. Đồ thị hàng tháng cho các khoảng thời gian kéo dài nhiều năm có tổng các tháng giống nhau.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Tùy thuộc vào thiết bị của bạn và khả năng tương thích của Delta Chat, bạn có thể chụp ảnh hoặc chọn một tệp. Đây là một phương pháp khác với máy ảnh trực tiếp.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Định dạng hình ảnh này không thể được hiển thị. Vui lòng lưu dưới dạng PNG hoặc JPEG và chọn lại (HEIC/HEIF không được hỗ trợ tùy theo môi trường)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Chọn cho từng thiết bị. Việc chuyển đổi áp dụng cho nút hiển thị và phân loại hồ sơ hiện tại, đồng thời không thay đổi các hồ sơ trước đây, ID người, hộ gia đình và lịch sử tiếp nhận tài liệu.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Nhập ngành, công ty, bộ phận, chức vụ, tên, địa chỉ, số điện thoại và email để tự động tạo ID tùy ý và cấp QR chỉ bằng ID. In nó ra và phân phát cho người đó.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Số lượng nhập cảnh đề cập đến số lượng nhập học và quay trở lại, và số lượng xuất cảnh đề cập đến số trường hợp được ghi nhận theo truyền thống là xuất cảnh, xuất cảnh tạm thời và xuất cảnh chính thức. Vui lòng kiểm tra tình trạng người sơ tán hiện tại trong mục \"Sơ tán/Hộ gia đình\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Liên kết của một người được lưu trên màn hình vấn đề QR. Dù trùng tên nhưng mã số hộ khẩu khác nhau thì là hộ khác. Những thay đổi về liên kết được thực hiện cho mỗi người. Thông tin hộ gia đình trong lịch sử quá khứ sẽ không được viết lại.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Thông thường, hãy tắt nó đi và sử dụng ID thiết bị mới. Nếu bạn muốn bật nó lên, vui lòng ngừng sử dụng thiết bị gốc. ID thiết bị từ lịch sử trước đây được giữ nguyên trong cả hai trường hợp.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Nó sẽ không được cộng vào số người vào/ra và tham dự. Số lượng người thực tế sẽ được tính bằng cách loại trừ ID người trùng lặp và số lượng sẽ được tính theo vật liệu/đơn vị. Sẽ không có quyết định tự động về tính đủ điều kiện, lượng hàng tồn kho hoặc phân phối trùng lặp.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Nhập ngành, công ty, bộ phận, chức vụ, tên, địa chỉ, số điện thoại và email để tự động tạo ID tùy ý và cấp QR chỉ bằng ID. In nó ra, phân phát, quét tại địa điểm và quản lý việc ra vào cùng một lúc.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Chia sẻ danh sách trong cùng một ứng dụng đính kèm. Các mục đã xóa không thể được ghi lại mới bằng nút chuyên dụng nhưng lịch sử tham gia và nhận trước đây sẽ vẫn còn. Trên một thiết bị khác, những thay đổi sẽ được phản ánh sau khi chúng được nhận.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Tìm kiếm người đã đăng ký theo tên, ID người, tên hộ gia đình, công ty, điện thoại và email, xác nhận danh tính và nhấn \"Cấp lại QR với cùng một ID\". Thông tin cá nhân, việc ra/vào, tham gia, nhận vật tư và lịch sử hộ gia đình sẽ được kế thừa.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Truy cập vào máy ảnh bị từ chối. Vui lòng kiểm tra quyền truy cập máy ảnh của thiết bị của bạn. Điều này cũng sẽ bị từ chối do các hạn chế ở phía Delta Chat/Webxdc, vì vậy nếu bạn được phép, vui lòng thử chọn một hình ảnh hoặc chụp ảnh.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Biểu đồ hiển thị tối đa 12 phân loại và tổng số còn lại. Tất cả các phân loại được liệt kê trong bảng dưới đây và trong báo cáo in. Nhãn cho mỗi biểu đồ thiết bị đầu cuối là 8 ký tự cuối cùng của ID thiết bị đầu cuối và bạn có thể tìm thấy ID chính thức và tên thiết bị đầu cuối trong bảng bên dưới. Bản ghi cũ không thể xác định được thiết bị đầu cuối thực sự.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"Cài đặt ban đầu là TẮT. Vui lòng chỉ bật nó cho những người đã xác nhận quyền xuất bản. Theo thông số kỹ thuật phán đoán của CGI đính kèm, khi TẮT, các từ đánh giá công khai như ghi chú sẽ được chuyển đổi thành tham chiếu ký tự để hiển thị và khi BẬT, dấu hiệu rõ ràng để xuất bản sẽ được thêm vào.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"ID có hồ sơ nhập học trong thời gian/địa điểm được chỉ định sẽ được tính là một người. Thuộc tính là điểm vào cuối cùng trong khoảng thời gian. Lịch sử không đăng ký độ tuổi và giới tính sẽ được coi là \"chưa được trả lời\". Các số trùng lặp cho từng địa điểm và nhà ga sẽ bị loại trừ. Không bao gồm các bản ghi không đồng bộ.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Người, vào/ra, tham gia/nhận, lịch sử đăng ký gian hàng/cung cấp/địa điểm, thông tin chưa gửi, tên thiết bị, chế độ sử dụng và cài đặt nút chuyên dụng được lưu trong JSON. Vui lòng kiểm tra nơi lưu trữ và chia sẻ vì chúng chứa thông tin cá nhân. Không bao gồm mật khẩu quản trị và trạng thái đăng nhập.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV có BOM UTF-8, dòng đầu tiên là tên cột và dòng thứ hai là thẻ HXL. Nhập vào danh mục người sơ tán của esbbs.cgi. ZIP là định dạng để quản trị viên máy chủ trích xuất và đặt TXT vào vị trí lưu trữ chung của người sơ tán cho cả hai CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Đầu ra du khách là người sơ tán. Hỗ trợ định dạng lưu trữ HXL \"người sơ tán\" của esbbs.cgi và định dạng lưu trữ TXT qua email phổ biến cho sbbs.cgi và esbbs.cgi. Các ghi chú sẽ bao gồm tất cả lịch sử tham gia gian hàng và lịch sử nhận nguyên liệu (ngày/giờ, tên, số lượng, địa điểm, nhà ga) của mỗi người. Nó sẽ không được tự động gửi đến CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Do phía CGI phân tích một dòng \"tên mục: giá trị\", ngắt dòng trong ghi chú cho CGI được nhóm thành \"/\". Các ký tự đặc biệt được đảm bảo an toàn cho màn hình CGI. Ngắt dòng và chuỗi ký tự trong ghi chú gốc thường được giữ lại ở dạng CSV và JSON. Quá trình nhập HXL không có tính năng loại bỏ trùng lặp ở phía CGI, vì vậy nếu bạn nhập cùng một CSV nhiều lần, nó sẽ bị trùng lặp.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON được tích hợp với dữ liệu hiện có theo ID và dữ liệu bổ sung được chia sẻ với cùng một ứng dụng đính kèm. Lịch sử sẽ không được tăng lên bằng cách nhập lại cùng một tệp. Vui lòng chọn một bản sao lưu có thao tác tương tự. Lịch sử đặt lại cũng được phản ánh. Phiên bản cũ của CSV nhập/xuất chỉ có thể nhập người và nhập/xuất. Không thể khôi phục cài đặt thiết bị và danh sách vật liệu bằng CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Số lượng nhập cảnh bao gồm quay lại cơ sở và số lượng xuất cảnh bao gồm xuất cảnh tạm thời và xuất cảnh chính thức. Tính số lượng người bằng cách loại trừ các ID nhập học trùng lặp trong khoảng thời gian đó. Các thuộc tính tính từ mục nhập cuối cùng trong khoảng thời gian. Độ tuổi bao gồm các câu hỏi chưa được trả lời theo nhóm tuổi. Số người theo địa điểm và thiết bị là số người thực tế ở mỗi địa điểm. Mỗi bảng hiển thị tất cả các danh mục và biểu đồ hiển thị 12 danh mục hàng đầu và tổng số còn lại. Các bản ghi trước khi đồng bộ hóa không được bao gồm.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Kiểm tra Cài đặt Android → Ứng dụng → Trò chuyện Delta → Quyền → Máy ảnh. Nếu bạn sử dụng trình duyệt, hãy kiểm tra các quyền ở phía trình duyệt. Ngay cả khi bạn cho phép, camera trực tiếp có thể bị từ chối do những hạn chế ở phiên bản Delta Chat hoặc phía Webxdc. Vì không thể hủy nó khỏi ứng dụng nên vui lòng thử chọn một hình ảnh hoặc chụp ảnh.","女性":"Nữ","男性":"Nam","その他":"Khác","会議室A":"Phòng A","会議室B":"Phòng B","80歳以上":"80 tuổi trở lên","メイン会場":"Địa điểm chính","回答しない":"Không muốn nói","年齢（年代）":"Nhóm tuổi","{0}〜{1}歳":"{0}–{1} năm","ブース・物資の登録画面へ":"Đến màn hình đăng ký gian hàng/cung cấp","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Các cài đặt về tên thiết bị, địa điểm, âm thanh, chế độ sử dụng, ngôn ngữ hiển thị và các nút chuyên dụng cũng được chuyển sang.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Nhờ quản trị viên đăng ký tên gian hàng và vật tư, sau đó nhận dữ liệu trong cùng ứng dụng đính kèm.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"Gian hàng/vật tư chưa được đăng ký. Không thể chọn tiêu đề danh mục. Bạn có thể chọn nó khi quản trị viên đăng ký tên.","出力失敗:":"Lỗi đầu ra:","読取処理:":"Đọc xử lý:","引き継ぎ完了：":"Chuyển hoàn tất:","画像出力失敗:":"Lỗi xuất hình ảnh:","画像読取失敗：":"Lỗi đọc hình ảnh:","CGI出力失敗:":"Lỗi đầu ra CGI:","レポート出力失敗:":"Báo cáo lỗi đầu ra:","QRを解析しています（":"Phân tích cú pháp QR (","QR生成に失敗しました":"Tạo QR không thành công","バックアップ作成失敗:":"Lỗi tạo bản sao lưu:","QR再発行に失敗しました":"Không thể phát hành lại QR","QR読取済み・記録なし：":"Quét QR/không có bản ghi:","件の履歴イベントを追加しました":"Đã thêm sự kiện lịch sử","QRを確認しましたが記録できませんでした。":"Tôi đã kiểm tra QR nhưng không thể ghi lại.","既存の同じIDと内容が異なるため取り込めません:":"Không thể nhập vì nội dung khác với cùng một ID hiện có:","さんのQRを同じIDで再発行しました。保存・印刷できます":"Chúng tôi đã phát hành lại mã QR của bạn với cùng một ID. Có thể được lưu và in","性別":"Giới tính","取込できません:":"Không thể nhập:","ファイルを確認しています":"Đang kiểm tra tập tin","CSVが空です":"CSV trống","行目の列数が不正です":"Số cột trong hàng không hợp lệ","CSVは10万行までです":"CSV lên tới 100.000 hàng","CSVの人物情報が不正です":"Thông tin người trong CSV không chính xác","履歴イベントは10万件までです":"Lên tới 100.000 sự kiện lịch sử","行目の日時・区分・氏名が不正です":"Ngày/giờ/danh mục/tên trong dòng không hợp lệ","不正 etting para sa pangalan ng device, lugar, tunog, mode ng paggamit, at mga nakalaang button ay dinadala din.","登録 {0}人 ／ {1}世帯 ／ 世帯未設定 {2}人":"Mga nakarehistrong {0} tao / {1} na sambahayan / Sambahayan ay hindi nakatakda sa {2} na tao","カメラの許可・起動を待っています。画像選択も利用できます。":"Naghihintay ng pahintulot/pag-activate ng camera. Available din ang pagpili ng larawan.","画像が大きすぎます。QR周辺を切り抜いて選び直してください":"Masyadong malaki ang larawan. Mangyaring gupitin ang lugar sa paligid ng QR at muling piliin ito.","出力対象者全員をsbbs.cgiの氏名の公開検索対象にする":"Gawin ang lahat ng mga target na output na mga target ng pampublikong paghahanap para sa mga pangalan sa sbbs.cgi","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Ilagay ang pangalan ng sambahayan at i-click ang \"Bumuo ng QR\" para i-save ito kasama ng tao.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Pakilagay ang \"pangalan\" ng tao. Ito ay isang hiwalay na field mula sa \"Pangalan ng sambahayan\"","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Bilang ng mga bisita: {0} tao / Pagpasok: {1} beses / Paglabas: {2} beses","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Ang mga papasok sa lugar ng kaganapan ay tinatawag na ``Enter,'' at ang mga aalis sa venue ay tinatawag na ``Exit.''","登録情報が見つかりません。同期やバックアップを確認してください":"Hindi nakita ang impormasyon sa pagpaparehistro. Suriin ang pag-sync at pag-backup","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Ilagay ang ibinigay na QR sa frame. Magbasa at magbahagi ng mga recording sa loob ng parehong chat.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"Ang QR ay naglalaman lamang ng ID ng bisita. Ang personal na impormasyon ay ipapakita sa pamamagitan ng paghahambing nito sa nakarehistrong impormasyon.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"Ang unang 20 tao ay ipi-preview, at lahat ng pinakipot na tao ay ilalabas sa file.","ID方式のQRではありません。登録情報からQRを再発行してください":"Ito ay hindi isang ID-based na QR. Mangyaring ibigay muli ang QR mula sa impormasyon sa pagpaparehistro.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Ang booth/supply na ito ay tinanggal. Mangyaring pumili ng isa pang nakalaang button","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Hindi masimulan ang live na camera. Mangyaring gamitin ang paliwanag sa screen at pagbabasa ng larawan.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Hindi ma-load ang file ng imahe. Mangyaring i-save sa ibang lokasyon at subukang muli","送信サイズ上限により共有できません。バックアップを保存してください":"Hindi maibahagi dahil sa limitasyon sa laki ng pagpapadala. Mangyaring mag-save ng backup","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"Pag-edit ng ID: {0}. Ang mga pagbabago sa napiling tao ay ise-save sa parehong ID.","履歴の端末内保存に空きがありません。バックアップを保存してください":"Walang natitira pang espasyo sa storage ng history ng device. Mangyaring mag-save ng backup","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"Ang pinakabagong 200 item ay ipinapakita sa kasaysayan, at lahat ng mga item ay output sa CSV at mga ulat.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Walang nakatakdang dedikadong button. Pakidagdag ito mula sa \"Mga Setting ng Dedicated Button\" sa ibaba.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Pag-isyu/pag-scan ng taong pagpasok/paglabas QR • Terminal ng miyembro • Pagrehistro ng QR/pagpasok/paglabas","保存容量不足などにより取込を中止しました。既存データを保持しています":"Kinansela ang pag-import dahil sa hindi sapat na espasyo sa imbakan. Pinapanatili ang umiiral na data","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Kung plano mong bumalik. Isasama sila sa bilang ng mga taong patuloy na tatanggapin, at sa kanilang pagbabalik, sila ay maitatala bilang ``bumalik''.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Walang nakitang available na camera. Subukang pumili ng mga larawan at kumuha ng mga larawan.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Hindi masimulan ang camera. Pakisubukang muli o pumili ng larawan/kumuha ng larawan.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Ito ang mode para sa pagtanggap at pagpaparehistro. Maaaring gamitin ang pagsasama-sama at mga ulat mula sa terminal ng administrator.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Maglagay ng mga tala, industriya/kumpanya/kagawaran/posisyon/telepono/email, entry/exit classification at final reading terminal","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Nirehistro ko ang aking ID at nakabuo ng QR. Maaaring basahin ng ibang mga terminal ang impormasyon sa pagpaparehistro pagkatapos itong matanggap.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Mangyaring panatilihing mas mababa sa 50MB ang mga larawan. Ang pagputol sa lugar sa paligid ng QR ay gagawing mas madaling basahin.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Kung nais mong wakasan ang pagtanggap. Hindi sila isasama sa bilang ng mga taong patuloy na tatanggapin, at ilalabas sa petsa at oras ng pag-alis ng CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Hindi ko mabuksan ang print screen. Mangyaring buksan sa iyong browser mula sa Save/Share Report HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Pumili ng isang QR na imahe gaya ng PNG o JPEG. Maaari mong piliin ang parehong larawan at subukang muli.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Hindi available ang live na camera sa display environment na ito. Subukang pumili ng mga larawan at kumuha ng mga larawan.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Saklaw ng pagbabahagi: Lahat ng kalahok sa parehong chat. Ang management mode ay isang display switch sa loob ng terminal. Bilang ng mga hindi naipadalang item:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Ilagay ang pangalan ng tao sa field na \"Pangalan\" sa itaas. Isang QR ang ibibigay at itatala para sa bawat tao sa parehong sambahayan.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Hindi masimulan ang camera. Pakisara ang camera ng ibang app at subukang muli, o pumili ng larawan.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Hindi nakumpirma ang pag-uuri dahil sa karaniwang paglabas: {0} tao. Ito ang estado ng talaan. Mangyaring suriin gamit ang roll call at kumpirmasyon sa kaligtasan.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Itinigil ang live camera para sa pagpili ng larawan. Kung gusto mong bumalik, pindutin ang \"Retry camera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Naghihintay ng tugon ng camera. Pakisuri ang screen ng pahintulot o gamitin ang pagpipilian sa pagpili ng larawan/pagkuha ng larawan sa ibaba.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Ibukod ang lahat ng mga tala mula sa pagpapakita sa kasaysayan ng pagbabahagi. Hindi made-delete ang dating data ng komunikasyon, storage ng device, at CSV.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Ang mga duplicate na numero ay hindi kasama ng person ID. Ang dami ay ang kabuuan para sa bawat item at yunit. Hindi kasama ang imbentaryo o pagpapasiya ng pagiging karapat-dapat.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Hindi nakita ang impormasyon sa pagpaparehistro. Pakitiyak na i-sync ang parehong naka-attach na app o i-restore ang JSON backup.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"Hindi nakita ang QR. Mangyaring i-crop ito upang ang buong QR at ang puting margin ay makikita, o kumuha ng mas maliwanag na larawan at pumili muli.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Itala ang pakikilahok sa booth at pagtanggap ng mga supply. Ang button na iyong pipiliin ay ise-save sa device na ito at ire-record nang hiwalay sa iyong pagpasok/paglabas.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Demo ng browser: ise-save ang mga recording sa browser na ito. Hindi ipapadala ang mga notification sa mga terminal ng Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Mga rehistradong tao: {0} / Pagpasok/paglabas: {1} / Paglahok/pagtanggap: {2} / Mga bagong kaganapan sa kasaysayan: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Sa pagpasok at paglabas ng venue, itala itong terminal ID, ang terminal name at venue sa oras na iyon. Ang pangalan ng terminal ay makikita sa tala pagkatapos ng pagsasaayos.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"Ang inisyu/naka-print na taong QR ay ini-scan at naitala bilang pagpasok/paglabas. Ibahagi sa loob ng parehong chat (maaaring mangyari ang mga pagkaantala depende sa status ng komunikasyon).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Ang ID na ito ay hindi nakarehistro o ang nakarehistrong impormasyon ay hindi naka-synchronize. Mangyaring basahin muli pagkatapos matanggap ang parehong impormasyon sa pagpaparehistro ng chat bilang ang nag-isyu na terminal.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Muling ipakita ang QR na may nakarehistrong impormasyon. Ang pag-edit ng mga pagbabago ay hindi mase-save. Ang isang nawawalang QR ay hindi mawawalan ng bisa kahit na ito ay muling ibigay.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Lugar: {2} / Terminal: {3} / Uri: {4} / Target: {5} / Paghahanap: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maximum ng 12 piraso. Ang pagpaparehistro at pagtanggal ng mga uri ay maaaring gawin sa seksyong \"Booth/Supplies\" ng administrator. Para sa pakikilahok sa booth, ang isang pag-scan ay nagtatala ng pakikilahok ng isang tao.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Sa oras ng araw, buwan, at araw ng linggo, sinusunod din nito ang mga kondisyon ng panahon, lugar, at terminal ng pagbabasa. Ang mga buwanang graph para sa mga panahon na sumasaklaw sa mga taon ay nagsasama ng parehong buwan.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Depende sa iyong device at sa pagiging tugma ng Delta Chat, maaari kang kumuha ng litrato o pumili ng file. Ibang paraan ito sa live na camera.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Hindi maipakita ang format ng larawang ito. Mangyaring i-save bilang PNG o JPEG at pumili muli (HEIC/HEIF ay hindi suportado depende sa kapaligiran)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Pumili para sa bawat device. Nalalapat ang paglipat sa display ng button at sa kasalukuyang pag-uuri ng tala, at hindi binabago ang mga nakaraang tala, ID ng tao, kabahayan, at kasaysayan ng pagtanggap ng materyal.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Ilagay ang industriya, kumpanya, departamento, titulo, pangalan, address, telepono, at email para awtomatikong bumuo ng arbitrary ID at mag-isyu ng QR gamit lang ang ID. I-print ito at ipamahagi sa tao.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Ang bilang ng mga admission ay tumutukoy sa bilang ng mga admission at return, at ang bilang ng mga exit ay tumutukoy sa bilang ng mga kaso na tradisyonal na naitala bilang mga paglabas, pansamantalang paglabas, at mga opisyal na paglabas. Pakisuri ang kasalukuyang katayuan ng evacuee sa ilalim ng \"Evacuate/Household\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Ang kaugnayan ng isang tao ay naka-save sa screen ng isyu ng QR. Kahit magkapareho ang pangalan, kung iba ang household ID, ibang household. Ang mga pagbabago sa affiliation ay ginawa para sa bawat tao. Ang impormasyon ng sambahayan sa nakaraang kasaysayan ay hindi muling isusulat.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Karaniwan, i-off ito at gumamit ng bagong device ID. Kung gusto mo itong i-on, mangyaring ihinto ang paggamit sa orihinal na device. Ang device ID mula sa nakaraang kasaysayan ay pinananatili sa parehong sitwasyon.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Hindi ito idadagdag sa bilang ng mga taong papasok/lalabas at dadalo. Ang aktwal na bilang ng mga tao ay kakalkulahin sa pamamagitan ng pagbubukod ng mga duplicate na person ID, at ang dami ay kakalkulahin ayon sa materyal/unit. Hindi magkakaroon ng awtomatikong pagpapasiya ng pagiging karapat-dapat, imbentaryo, o dobleng pamamahagi.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Ilagay ang industriya, kumpanya, departamento, titulo, pangalan, address, telepono, at email para awtomatikong bumuo ng arbitrary ID at mag-isyu ng QR gamit lang ang ID. I-print ito, ipamahagi, i-scan ito sa venue, at pamahalaan ang pagpasok at paglabas nang sabay-sabay.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Ibahagi ang listahan sa loob ng parehong naka-attach na app. Ang mga na-delete na item ay hindi maaaring bagong itala gamit ang nakalaang button, ngunit mananatili ang nakaraang paglahok at kasaysayan ng resibo. Sa isa pang device, ipapakita ang mga pagbabago pagkatapos matanggap ang mga ito.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Hanapin ang nakarehistrong tao sa pamamagitan ng pangalan, ID ng tao, pangalan ng sambahayan, kumpanya, telepono, at email, kumpirmahin ang pagkakakilanlan, at pindutin ang \"I-reissue muli ang QR na may parehong ID\". Ang personal na impormasyon, pagpasok/paglabas, paglahok, pagtanggap ng mga supply, at kasaysayan ng sambahayan ay mamamana.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Ang pag-access sa camera ay tinanggihan. Pakisuri ang mga pahintulot sa camera ng iyong device. Tatanggihan din ito dahil sa mga paghihigpit sa bahagi ng Delta Chat/Webxdc, kaya kung mayroon kang pahintulot, mangyaring subukang pumili ng larawan o kumuha ng larawan.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Ang graph ay nagpapakita ng hanggang 12 klasipikasyon at ang natitirang kabuuan. Ang lahat ng mga klasipikasyon ay nakalista sa talahanayan sa ibaba at sa naka-print na ulat. Ang label para sa bawat terminal graph ay ang huling 8 character ng terminal ID, at ang opisyal na ID at pangalan ng terminal ay makikita sa talahanayan sa ibaba. Hindi matukoy ng lumang rekord ang totoong terminal.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"NAKA-OFF ang paunang setting. Paki-on lang ito para sa mga nagkumpirma ng kanilang pahintulot na mag-publish. Alinsunod sa mga detalye ng paghatol ng nakalakip na CGI, kapag NAKA-OFF, ang mga salita ng pampublikong paghatol tulad ng mga tala ay iko-convert sa mga sanggunian ng character para ipakita, at kapag NAKA-ON, isang tahasang marka para sa publikasyon ay idinagdag.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Ang mga ID na may rekord ng pagpasok sa tinukoy na panahon/venue ay mabibilang bilang isang tao. Ang attribute ay ang huling entry point sa loob ng period. Ang kasaysayan kung saan ang edad at kasarian ay hindi nakarehistro ay ituturing na \"hindi nasagot\". Ang mga duplicate na numero para sa bawat venue at terminal ay hindi kasama. Hindi kasama ang mga hindi naka-synchronize na pag-record.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Ang mga tao, pagpasok/paglabas, paglahok/resibo, kasaysayan ng pagpaparehistro ng booth/supply/venue, hindi naipadalang impormasyon, pangalan ng device, mode ng paggamit, at mga setting ng nakalaang button ay naka-save sa JSON. Pakisuri ang mga destinasyon ng storage at pagbabahagi dahil naglalaman ang mga ito ng personal na impormasyon. Hindi kasama ang administratibong password at katayuan sa pag-login.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"Ang HXL CSV ay may UTF-8 BOM, ang unang linya ay ang pangalan ng column, at ang pangalawang linya ay ang HXL tag. Mag-import sa kategorya ng evacuee ng esbbs.cgi. Ang ZIP ay isang format para sa mga administrator ng server upang kunin at ilagay ang TXT sa karaniwang lokasyon ng imbakan ng evacuee para sa parehong mga CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"I-output ang mga bisita bilang mga evacuees. Sinusuportahan ang \"evacuee\" na HXL import at email na TXT na format ng storage ng esbbs.cgi na karaniwan sa sbbs.cgi at esbbs.cgi. Kasama sa mga tala ang lahat ng partisipasyon sa booth at kasaysayan ng pagtanggap ng materyal (petsa/oras, pangalan, dami, lugar, terminal) para sa bawat tao. Hindi ito awtomatikong ipapadala sa CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Dahil sinusuri ng panig ng CGI ang isang linya ng \"pangalan ng item: halaga\", ang mga line break sa mga tala para sa CGI ay pinagsama-sama sa \"/\". Ang mga espesyal na character ay ginawang ligtas para sa CGI display. Ang mga line break at mga string ng character sa orihinal na mga tala ay karaniwang pinananatili sa CSV at JSON. Ang HXL import ay walang duplicate na pag-aalis sa gilid ng CGI, kaya kung paulit-ulit mong i-import ang parehong CSV, ito ay mado-duplicate.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"Ang JSON ay isinama sa umiiral nang data sa pamamagitan ng ID, at ang karagdagang data ay ibinabahagi sa parehong naka-attach na app. Ang kasaysayan ay hindi tataas sa pamamagitan ng muling pag-import ng parehong file. Mangyaring pumili ng backup na may parehong operasyon. Ang pag-reset ng kasaysayan ay makikita rin. Ang lumang bersyon ng entry/exit CSV ay maaari lamang mag-import ng mga tao at entry/exit. Hindi maibabalik sa CSV ang mga setting ng device at mga listahan ng materyal.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Kasama sa bilang ng mga admission ang pagbabalik sa pasilidad, at ang bilang ng mga paglabas ay kinabibilangan ng mga pansamantalang pag-alis at mga opisyal na paglabas. Kalkulahin ang bilang ng mga tao sa pamamagitan ng pagbubukod ng mga duplicate na admission ID sa loob ng panahon. Ang mga katangian ay mula sa huling entry sa loob ng panahon. Kasama sa edad ang mga hindi nasasagot na tanong ayon sa pangkat ng edad. Ang bilang ng mga tao ayon sa lugar at device ay ang aktwal na bilang ng mga tao sa bawat isa. Ipinapakita ng bawat talahanayan ang lahat ng kategorya, at ipinapakita ng graph ang nangungunang 12 kategorya at ang natitirang kabuuan. Hindi kasama ang mga rekord bago ang pag-synchronize.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Suriin ang Mga Setting ng Android → Apps → Delta Chat → Mga Pahintulot → Camera. Kung gumagamit ka ng browser, tingnan ang mga pahintulot sa gilid ng browser. Kahit na payagan mo ang pahintulot, maaaring tanggihan ang live na camera dahil sa mga paghihigpit sa bersyon ng Delta Chat o bahagi ng Webxdc. Dahil hindi ito maaaring kanselahin mula sa app, mangyaring subukang pumili ng isang larawan o kumuha ng larawan.","女性":"Babae","男性":"Lalaki","その他":"Iba pa","会議室A":"Kwarto A","会議室B":"Kwarto B","80歳以上":"80 taong gulang at mas matanda","メイン会場":"Pangunahing venue","回答しない":"Mas piniling hindi sabihin","年齢（年代）":"pangkat ng edad","{0}〜{1}歳":"{0}–{1} taon","ブース・物資の登録画面へ":"Pumunta sa screen ng pagpaparehistro ng booth/supply","端末名・会場・音・利用モード・表示言語・専用ボタンの設定も引き継ぐ":"Ang mga setting para sa pangalan ng device, lugar, tunog, mode ng paggamit, wika ng pagpapakita, at mga nakalaang button ay dinadala din.","管理者に名称の登録を依頼し、同じ添付アプリで登録情報を受信してください。":"Hilingin sa tagapangasiwa na irehistro ang mga pangalan ng booth at suplay, at tanggapin ang datos sa parehong kalakip na app.","ブース・物資が未登録です。分類見出しは選択できません。管理者が名称を登録すると選べます。":"Hindi nakarehistro ang booth/supplies. Hindi mapipili ang mga heading ng kategorya. Maaari mo itong piliin kapag nairehistro ng administrator ang pangalan.","出力失敗:":"Nabigo ang output:","読取処理:":"Pagproseso ng pagbasa:","引き継ぎ完了：":"Nakumpleto ang paglipat:","画像出力失敗:":"Nabigo ang output ng larawan:","画像読取失敗：":"Nabigo ang pagbabasa ng larawan:","CGI出力失敗:":"Nabigo ang output ng CGI:","レポート出力失敗:":"Iulat ang pagkabigo sa output:","QRを解析しています（":"Pag-parse ng QR (","QR生成に失敗しました":"Nabigo ang pagbuo ng QR","バックアップ作成失敗:":"Nabigo ang paggawa ng backup:","QR再発行に失敗しました":"Nabigong muling magbigay ng QR","QR読取済み・記録なし：":"QR scan/walang record:","件の履歴イベントを追加しました":"Nagdagdag ng mga makasaysayang kaganapan","QRを確認しましたが記録できませんでした。":"Tiningnan ko ang QR, ngunit hindi ito ma-record.","既存の同じIDと内容が異なるため取り込めません:":"Hindi makapag-import dahil iba ang content sa kasalukuyang parehong ID:","さんのQRを同じIDで再発行しました。保存・印刷できます":"Muli naming naibigay ang iyong QR na may parehong ID. Maaaring i-save at i-print","性別":"Kasarian","取込できません:":"Hindi ma-import:","ファイルを確認しています":"Sinusuri ang file","CSVが空です":"Walang laman ang CSV","行目の列数が不正です":"Di-wasto ang bilang ng mga column sa row","CSVは10万行までです":"Ang CSV ay hanggang 100,000 row","CSVの人物情報が不正です":"Ang impormasyon ng tao sa CSV ay hindi tama","履歴イベントは10万件までです":"Hanggang 100,000 makasaysayang kaganapan","行目の日時・区分・氏名が不正です":"Ang petsa/oras/kategorya/pangalan sa linya ay hindi wasto","不正な履歴イベントが含まれています":"Naglalaman ng di-wastong kaganapan sa kasaysayan","同じIDに異なる記録が含まれています":"Ang parehong ID ay naglalaman ng iba't ibang mga tala","対応するバックアップ形式ではありません":"Hindi isang suportadong backup na format","ファイルの内容が破損または変更されています":"Ang mga nilalaman ng file ay sira o binago","入退場CSVではありません。参加・受取CSVの移行にはJSONバックアップを使ってください":"Hindi ito entry/exit CSV. Pakigamit ang JSON backup para i-migrate ang paglahok/pagtanggap ng CSV."},"fil":{"火":"Tue","管":"A","金":"Biyernes","月":"Mon","件":"mga tala","個":"mga bagay","人":"mga tao","水":"Wed","土":"Sab","日":"Araw","入":"SA","木":"Huwebes","1月":"Enero","1件":"1 record","2月":"Pebrero","3月":"Marso","4月":"Abril","5月":"maaaring","6月":"Hunyo","7月":"Hulyo","8月":"Agosto","9月":"september","なし":"wala","印刷":"paglilimbag","会社":"kumpanya","会場":"Venue","外す":"tanggalin","管理":"pamamahala","関係":"relasyon","帰所":"Pagbalik sa evacuation center","業種":"Industriya","今日":"ngayon","削除":"Tanggalin","参加":"Pakikilahok","氏名":"Buong pangalan","種類":"uri","受取":"Resibo","住所":"Address","状態 "世帯を選択するか、新しい世帯IDを作成してください":"Pumili ng sambahayan o gumawa ng bagong ID ng sambahayan","利用モードを保存できません。この画面内で適用します":"Hindi ma-save ang mode ng paggamit. Mag-apply sa loob ng screen na ito","{0} 〜 {1} ／ {2} ／ 読取端末：{3}":"{0} ~ {1} / {2} / Reading terminal: {3}","{0} ／ {1} ／ 読取端末：{2} [{3}]":"{0} / {1} / Reading terminal: {2} [{3}]","カメラで読取中です。QR全体を枠内に入れてください。":"Binabasa ito ng camera. Pakilagay ang buong QR sa loob ng frame.","元端末：{0} ／ 保存日時：{1} ／ 版：{2}":"Orihinal na device: {0} / I-save ang petsa at oras: {1} / Bersyon: {2}","{0} ／ 記録上の状態です。点呼と照合してください。":"{0} / Naitala na estado. Mangyaring suriin gamit ang roll call.","別画面を開けません。レポートHTMLを保存してください":"Hindi ko mabuksan ang isa pang screen. I-save ang HTML ng ulat","{0} ／ 在所 {1}・外出 {2}・正式退所 {3}":"{0} / Lokasyon: {1}, Outing: {2}, Opisyal na aalis: {3}","カメラを再試行しています。画像を選び直すこともできます。":"Sinusubukang muli ang camera. Maaari mo ring muling piliin ang larawan.","端末内保存に失敗しました。記録をCSVで退避してください":"Nabigong i-save sa device. Paki-save ang mga tala bilang CSV","端末名・会場・音・利用モード・専用ボタンの設定も引き継ぐ":"Ang mga setting para sa pangalan ng device, lugar, tunog, mode ng paggamit, at mga nakalaang button ay dinadala din.","登録 {0}人 ／ {1}世帯 ／ 世帯未設定 {2}人":"Mga nakarehistrong {0} tao / {1} na sambahayan / Sambahayan ay hindi nakatakda sa {2} na tao","カメラの許可・起動を待っています。画像選択も利用できます。":"Naghihintay ng pahintulot/pag-activate ng camera. Available din ang pagpili ng larawan.","画像が大きすぎます。QR周辺を切り抜いて選び直してください":"Masyadong malaki ang larawan. Mangyaring gupitin ang lugar sa paligid ng QR at muling piliin ito.","出力対象者全員をsbbs.cgiの氏名の公開検索対象にする":"Gawin ang lahat ng mga target na output na mga target ng pampublikong paghahanap para sa mga pangalan sa sbbs.cgi","世帯名を入力し「QRを生成」で人物と一緒に保存してください":"Ilagay ang pangalan ng sambahayan at i-click ang \"Bumuo ng QR\" para i-save ito kasama ng tao.","本人の「氏名」を入力してください。「世帯名」とは別の欄です":"Pakilagay ang \"pangalan\" ng tao. Ito ay isang hiwalay na field mula sa \"Pangalan ng sambahayan\"","来場者数：{0}人 ／ 入場：{1}回 ／ 退場：{2}回":"Bilang ng mga bisita: {0} tao / Pagpasok: {1} beses / Paglabas: {2} beses","イベント会場へ入る人は「入場」、会場を出る人は「退場」です。":"Ang mga papasok sa lugar ng kaganapan ay tinatawag na ``Enter,'' at ang mga aalis sa venue ay tinatawag na ``Exit.''","登録情報が見つかりません。同期やバックアップを確認してください":"Hindi nakita ang impormasyon sa pagpaparehistro. Suriin ang pag-sync at pag-backup","発行されたQRを枠内に。読み取ると同じチャット内で記録を共有。":"Ilagay ang ibinigay na QR sa frame. Magbasa at magbahagi ng mga recording sa loob ng parehong chat.","QR内は来場者IDのみ。個人情報は登録情報との照合で表示します。":"Ang QR ay naglalaman lamang ng ID ng bisita. Ang personal na impormasyon ay ipapakita sa pamamagitan ng paghahambing nito sa nakarehistrong impormasyon.","プレビューは先頭20人、ファイルには絞り込んだ全員を出力します。":"Ang unang 20 tao ay ipi-preview, at lahat ng pinakipot na tao ay ilalabas sa file.","ID方式のQRではありません。登録情報からQRを再発行してください":"Ito ay hindi isang ID-based na QR. Mangyaring ibigay muli ang QR mula sa impormasyon sa pagpaparehistro.","このブース・物資は削除されています。別の専用ボタンを選んでください":"Ang booth/supply na ito ay tinanggal. Mangyaring pumili ng isa pang nakalaang button","ライブカメラを開始できません。画面の説明と画像読取をご利用ください":"Hindi masimulan ang live na camera. Mangyaring gamitin ang paliwanag sa screen at pagbabasa ng larawan.","画像ファイルを読み込めません。別の場所に保存して選び直してください":"Hindi ma-load ang file ng imahe. Mangyaring i-save sa ibang lokasyon at subukang muli","送信サイズ上限により共有できません。バックアップを保存してください":"Hindi maibahagi dahil sa limitasyon sa laki ng pagpapadala. Mangyaring mag-save ng backup","編集中のID：{0}。選択した人物の変更は同じIDへ保存されます。":"Pag-edit ng ID: {0}. Ang mga pagbabago sa napiling tao ay ise-save sa parehong ID.","履歴の端末内保存に空きがありません。バックアップを保存してください":"Walang natitira pang espasyo sa storage ng history ng device. Mangyaring mag-save ng backup","履歴表示は最新200件、CSVとレポートには対象全件を出力します。":"Ang pinakabagong 200 item ay ipinapakita sa kasaysayan, at lahat ng mga item ay output sa CSV at mga ulat.","専用ボタンは未設定です。下の「専用ボタン設定」から追加してください。":"Walang nakatakdang dedikadong button. Pakidagdag ito mula sa \"Mga Setting ng Dedicated Button\" sa ibaba.","入退場者QR発行・スキャン • メンバ端末 • QR登録・入退場記録":"Pag-isyu/pag-scan ng taong pagpasok/paglabas QR • Terminal ng miyembro • Pagrehistro ng QR/pagpasok/paglabas","保存容量不足などにより取込を中止しました。既存データを保持しています":"Kinansela ang pag-import dahil sa hindi sapat na espasyo sa imbakan. Pinapanatili ang umiiral na data","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Kung plano mong bumalik. Isasama sila sa bilang ng mga taong patuloy na tatanggapin, at sa kanilang pagbabalik, sila ay maitatala bilang ``bumalik''.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Walang nakitang available na camera. Subukang pumili ng mga larawan at kumuha ng mga larawan.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Hindi masimulan ang camera. Pakisubukang muli o pumili ng larawan/kumuha ng larawan.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Ito ang mode para sa pagtanggap at pagpaparehistro. Maaaring gamitin ang pagsasama-sama at mga ulat mula sa terminal ng administrator.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Maglagay ng mga tala, industriya/kumpanya/kagawaran/posisyon/telepono/email, entry/exit classification at final reading terminal","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Nirehistro ko ang aking ID at nakabuo ng QR. Maaaring basahin ng ibang mga terminal ang impormasyon sa pagpaparehistro pagkatapos itong matanggap.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Mangyaring panatilihing mas mababa sa 50MB ang mga larawan. Ang pagputol sa lugar sa paligid ng QR ay gagawing mas madaling basahin.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Kung nais mong wakasan ang pagtanggap. Hindi sila isasama sa bilang ng mga taong patuloy na tatanggapin, at ilalabas sa petsa at oras ng pag-alis ng CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Hindi ko mabuksan ang print screen. Mangyaring buksan sa iyong browser mula sa Save/Share Report HTML","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Pumili ng isang QR na imahe gaya ng PNG o JPEG. Maaari mong piliin ang parehong larawan at subukang muli.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"Hindi available ang live na camera sa display environment na ito. Subukang pumili ng mga larawan at kumuha ng mga larawan.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Saklaw ng pagbabahagi: Lahat ng kalahok sa parehong chat. Ang management mode ay isang display switch sa loob ng terminal. Bilang ng mga hindi naipadalang item:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Ilagay ang pangalan ng tao sa field na \"Pangalan\" sa itaas. Isang QR ang ibibigay at itatala para sa bawat tao sa parehong sambahayan.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Hindi masimulan ang camera. Pakisara ang camera ng ibang app at subukang muli, o pumili ng larawan.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Hindi nakumpirma ang pag-uuri dahil sa karaniwang paglabas: {0} tao. Ito ang estado ng talaan. Mangyaring suriin gamit ang roll call at kumpirmasyon sa kaligtasan.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"Itinigil ang live camera para sa pagpili ng larawan. Kung gusto mong bumalik, pindutin ang \"Retry camera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Naghihintay ng tugon ng camera. Pakisuri ang screen ng pahintulot o gamitin ang pagpipilian sa pagpili ng larawan/pagkuha ng larawan sa ibaba.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Ibukod ang lahat ng mga tala mula sa pagpapakita sa kasaysayan ng pagbabahagi. Hindi made-delete ang dating data ng komunikasyon, storage ng device, at CSV.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Ang mga duplicate na numero ay hindi kasama ng person ID. Ang dami ay ang kabuuan para sa bawat item at yunit. Hindi kasama ang imbentaryo o pagpapasiya ng pagiging karapat-dapat.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Hindi nakita ang impormasyon sa pagpaparehistro. Pakitiyak na i-sync ang parehong naka-attach na app o i-restore ang JSON backup.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"Hindi nakita ang QR. Mangyaring i-crop ito upang ang buong QR at ang puting margin ay makikita, o kumuha ng mas maliwanag na larawan at pumili muli.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Itala ang pakikilahok sa booth at pagtanggap ng mga supply. Ang button na iyong pipiliin ay ise-save sa device na ito at ire-record nang hiwalay sa iyong pagpasok/paglabas.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Demo ng browser: ise-save ang mga recording sa browser na ito. Hindi ipapadala ang mga notification sa mga terminal ng Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Mga rehistradong tao: {0} / Pagpasok/paglabas: {1} / Paglahok/pagtanggap: {2} / Mga bagong kaganapan sa kasaysayan: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Sa pagpasok at paglabas ng venue, itala itong terminal ID, ang terminal name at venue sa oras na iyon. Ang pangalan ng terminal ay makikita sa tala pagkatapos ng pagsasaayos.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"Ang inisyu/naka-print na taong QR ay ini-scan at naitala bilang pagpasok/paglabas. Ibahagi sa loob ng parehong chat (maaaring mangyari ang mga pagkaantala depende sa status ng komunikasyon).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Ang ID na ito ay hindi nakarehistro o ang nakarehistrong impormasyon ay hindi naka-synchronize. Mangyaring basahin muli pagkatapos matanggap ang parehong impormasyon sa pagpaparehistro ng chat bilang ang nag-isyu na terminal.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Muling ipakita ang QR na may nakarehistrong impormasyon. Ang pag-edit ng mga pagbabago ay hindi mase-save. Ang isang nawawalang QR ay hindi mawawalan ng bisa kahit na ito ay muling ibigay.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Lugar: {2} / Terminal: {3} / Uri: {4} / Target: {5} / Paghahanap: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Maximum ng 12 piraso. Ang pagpaparehistro at pagtanggal ng mga uri ay maaaring gawin sa seksyong \"Booth/Supplies\" ng administrator. Para sa pakikilahok sa booth, ang isang pag-scan ay nagtatala ng pakikilahok ng isang tao.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Sa oras ng araw, buwan, at araw ng linggo, sinusunod din nito ang mga kondisyon ng panahon, lugar, at terminal ng pagbabasa. Ang mga buwanang graph para sa mga panahon na sumasaklaw sa mga taon ay nagsasama ng parehong buwan.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Depende sa iyong device at sa pagiging tugma ng Delta Chat, maaari kang kumuha ng litrato o pumili ng file. Ibang paraan ito sa live na camera.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Hindi maipakita ang format ng larawang ito. Mangyaring i-save bilang PNG o JPEG at pumili muli (HEIC/HEIF ay hindi suportado depende sa kapaligiran)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Pumili para sa bawat device. Nalalapat ang paglipat sa display ng button at sa kasalukuyang pag-uuri ng tala, at hindi binabago ang mga nakaraang tala, ID ng tao, kabahayan, at kasaysayan ng pagtanggap ng materyal.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Ilagay ang industriya, kumpanya, departamento, titulo, pangalan, address, telepono, at email para awtomatikong bumuo ng arbitrary ID at mag-isyu ng QR gamit lang ang ID. I-print ito at ipamahagi sa tao.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"Ang bilang ng mga admission ay tumutukoy sa bilang ng mga admission at return, at ang bilang ng mga exit ay tumutukoy sa bilang ng mga kaso na tradisyonal na naitala bilang mga paglabas, pansamantalang paglabas, at mga opisyal na paglabas. Pakisuri ang kasalukuyang katayuan ng evacuee sa ilalim ng \"Evacuate/Household\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"Ang kaugnayan ng isang tao ay naka-save sa screen ng isyu ng QR. Kahit magkapareho ang pangalan, kung iba ang household ID, ibang household. Ang mga pagbabago sa affiliation ay ginawa para sa bawat tao. Ang impormasyon ng sambahayan sa nakaraang kasaysayan ay hindi muling isusulat.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Karaniwan, i-off ito at gumamit ng bagong device ID. Kung gusto mo itong i-on, mangyaring ihinto ang paggamit sa orihinal na device. Ang device ID mula sa nakaraang kasaysayan ay pinananatili sa parehong sitwasyon.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Hindi ito idadagdag sa bilang ng mga taong papasok/lalabas at dadalo. Ang aktwal na bilang ng mga tao ay kakalkulahin sa pamamagitan ng pagbubukod ng mga duplicate na person ID, at ang dami ay kakalkulahin ayon sa materyal/unit. Hindi magkakaroon ng awtomatikong pagpapasiya ng pagiging karapat-dapat, imbentaryo, o dobleng pamamahagi.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Ilagay ang industriya, kumpanya, departamento, titulo, pangalan, address, telepono, at email para awtomatikong bumuo ng arbitrary ID at mag-isyu ng QR gamit lang ang ID. I-print ito, ipamahagi, i-scan ito sa venue, at pamahalaan ang pagpasok at paglabas nang sabay-sabay.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Ibahagi ang listahan sa loob ng parehong naka-attach na app. Ang mga na-delete na item ay hindi maaaring bagong itala gamit ang nakalaang button, ngunit mananatili ang nakaraang paglahok at kasaysayan ng resibo. Sa isa pang device, ipapakita ang mga pagbabago pagkatapos matanggap ang mga ito.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Hanapin ang nakarehistrong tao sa pamamagitan ng pangalan, ID ng tao, pangalan ng sambahayan, kumpanya, telepono, at email, kumpirmahin ang pagkakakilanlan, at pindutin ang \"I-reissue muli ang QR na may parehong ID\". Ang personal na impormasyon, pagpasok/paglabas, paglahok, pagtanggap ng mga supply, at kasaysayan ng sambahayan ay mamamana.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"Ang pag-access sa camera ay tinanggihan. Pakisuri ang mga pahintulot sa camera ng iyong device. Tatanggihan din ito dahil sa mga paghihigpit sa bahagi ng Delta Chat/Webxdc, kaya kung mayroon kang pahintulot, mangyaring subukang pumili ng larawan o kumuha ng larawan.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"Ang graph ay nagpapakita ng hanggang 12 klasipikasyon at ang natitirang kabuuan. Ang lahat ng mga klasipikasyon ay nakalista sa talahanayan sa ibaba at sa naka-print na ulat. Ang label para sa bawat terminal graph ay ang huling 8 character ng terminal ID, at ang opisyal na ID at pangalan ng terminal ay makikita sa talahanayan sa ibaba. Hindi matukoy ng lumang rekord ang totoong terminal.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"NAKA-OFF ang paunang setting. Paki-on lang ito para sa mga nagkumpirma ng kanilang pahintulot na mag-publish. Alinsunod sa mga detalye ng paghatol ng nakalakip na CGI, kapag NAKA-OFF, ang mga salita ng pampublikong paghatol tulad ng mga tala ay iko-convert sa mga sanggunian ng character para ipakita, at kapag NAKA-ON, isang tahasang marka para sa publikasyon ay idinagdag.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Ang mga ID na may rekord ng pagpasok sa tinukoy na panahon/venue ay mabibilang bilang isang tao. Ang attribute ay ang huling entry point sa loob ng period. Ang kasaysayan kung saan ang edad at kasarian ay hindi nakarehistro ay ituturing na \"hindi nasagot\". Ang mga duplicate na numero para sa bawat venue at terminal ay hindi kasama. Hindi kasama ang mga hindi naka-synchronize na pag-record.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Ang mga tao, pagpasok/paglabas, paglahok/resibo, kasaysayan ng pagpaparehistro ng booth/supply/venue, hindi naipadalang impormasyon, pangalan ng device, mode ng paggamit, at mga setting ng nakalaang button ay naka-save sa JSON. Pakisuri ang mga destinasyon ng storage at pagbabahagi dahil naglalaman ang mga ito ng personal na impormasyon. Hindi kasama ang administratibong password at katayuan sa pag-login.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"Ang HXL CSV ay may UTF-8 BOM, ang unang linya ay ang pangalan ng column, at ang pangalawang linya ay ang HXL tag. Mag-import sa kategorya ng evacuee ng esbbs.cgi. Ang ZIP ay isang format para sa mga administrator ng server upang kunin at ilagay ang TXT sa karaniwang lokasyon ng imbakan ng evacuee para sa parehong mga CGI.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"I-output ang mga bisita bilang mga evacuees. Sinusuportahan ang \"evacuee\" na HXL import at email na TXT na format ng storage ng esbbs.cgi na karaniwan sa sbbs.cgi at esbbs.cgi. Kasama sa mga tala ang lahat ng partisipasyon sa booth at kasaysayan ng pagtanggap ng materyal (petsa/oras, pangalan, dami, lugar, terminal) para sa bawat tao. Hindi ito awtomatikong ipapadala sa CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Dahil sinusuri ng panig ng CGI ang isang linya ng \"pangalan ng item: halaga\", ang mga line break sa mga tala para sa CGI ay pinagsama-sama sa \"/\". Ang mga espesyal na character ay ginawang ligtas para sa CGI display. Ang mga line break at mga string ng character sa orihinal na mga tala ay karaniwang pinananatili sa CSV at JSON. Ang HXL import ay walang duplicate na pag-aalis sa gilid ng CGI, kaya kung paulit-ulit mong i-import ang parehong CSV, ito ay mado-duplicate.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"Ang JSON ay isinama sa umiiral nang data sa pamamagitan ng ID, at ang karagdagang data ay ibinabahagi sa parehong naka-attach na app. Ang kasaysayan ay hindi tataas sa pamamagitan ng muling pag-import ng parehong file. Mangyaring pumili ng backup na may parehong operasyon. Ang pag-reset ng kasaysayan ay makikita rin. Ang lumang bersyon ng entry/exit CSV ay maaari lamang mag-import ng mga tao at entry/exit. Hindi maibabalik sa CSV ang mga setting ng device at mga listahan ng materyal.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"Kasama sa bilang ng mga admission ang pagbabalik sa pasilidad, at ang bilang ng mga paglabas ay kinabibilangan ng mga pansamantalang pag-alis at mga opisyal na paglabas. Kalkulahin ang bilang ng mga tao sa pamamagitan ng pagbubukod ng mga duplicate na admission ID sa loob ng panahon. Ang mga katangian ay mula sa huling entry sa loob ng panahon. Kasama sa edad ang mga hindi nasasagot na tanong ayon sa pangkat ng edad. Ang bilang ng mga tao ayon sa lugar at device ay ang aktwal na bilang ng mga tao sa bawat isa. Ipinapakita ng bawat talahanayan ang lahat ng kategorya, at ipinapakita ng graph ang nangungunang 12 kategorya at ang natitirang kabuuan. Hindi kasama ang mga rekord bago ang pag-synchronize.","Androidの設定 → アプリ → Delta Chat → 権限 → カメラを確認してください。ブラウザーで使う場合はブラウザー側の権限を確認します。権限を許可しても、Delta Chatの版やWebxdc側の制限でライブカメラが拒否される場合があります。アプリから解除はできないため、画像選択または写真撮影を試してください。":"Suriin ang Mga Setting ng Android → Apps → Delta Chat → Mga Pahintulot → Camera. Kung gumagamit ka ng browser, tingnan ang mga pahintulot sa gilid ng browser. Kahit na payagan mo ang pahintulot, maaaring tanggihan ang live na camera dahil sa mga paghihigpit sa bersyon ng Delta Chat o bahagi ng Webxdc. Dahil hindi ito maaaring kanselahin mula sa app, mangyaring subukang pumili ng isang larawan o kumuha ng larawan.","女性":"Babae","男性":"Lalaki","その他":"Iba pa","会議室A":"Kwarto A","会議 a • Terminal de membro • Registro QR/registro de entrada/saída","保存容量不足などにより取込を中止しました。既存データを保持しています":"A importação foi cancelada devido a espaço de armazenamento insuficiente. Mantém os dados existentes","戻る予定がある場合。受入継続人数に含め、戻ったら「帰所」で記録します。":"Se você planeja voltar. Eles serão incluídos no número de pessoas que continuarão a ser aceitas e, quando retornarem, serão registrados como ``retornando''.","利用できるカメラが見つかりません。画像選択・写真撮影を試してください。":"Nenhuma câmera disponível foi encontrada. Experimente selecionar imagens e tirar fotos.","カメラを開始できません。再試行または画像選択・写真撮影を試してください。":"Não foi possível iniciar a câmera. Por favor, tente novamente ou selecione uma imagem/tire uma foto.","受付・登録を行うモードです。集計・レポートは管理者端末から利用できます。":"Este é o modo de recepção e registro. Agregação e relatórios podem ser usados ​​no terminal do administrador.","備考入力、業種・会社・部署・役職・電話・メール、入退場区分と最終読取端末":"Insira notas, setor/empresa/departamento/cargo/telefone/e-mail, classificação de entrada/saída e terminal de leitura final","IDを登録しQRを生成しました。他の端末では登録情報の受信後に読取できます":"Cadastrei meu ID e gerei um QR. Outros terminais podem ler as informações de registro após recebê-las.","画像は50MB以下にしてください。QR周辺を切り抜くと読み取りやすくなります":"Por favor, mantenha as imagens com menos de 50 MB. Cortar a área ao redor do QR facilitará a leitura.","受入れを終了する場合。受入継続人数から外れ、CGIの退所日時に出力されます。":"Se você deseja encerrar a aceitação. Serão excluídos do número de pessoas que continuarão internadas e serão divulgados na data e hora de saída do CGI.","印刷画面を開けません。レポートHTML保存・共有からブラウザーで開いてください":"Não consigo abrir a tela de impressão. Abra em seu navegador em Salvar/Compartilhar HTML do relatório","PNG・JPEGなどのQR画像を選択します。同じ画像を選び直して再試行できます。":"Selecione uma imagem QR, como PNG ou JPEG. Você pode selecionar a mesma imagem e tentar novamente.","この表示環境ではライブカメラを利用できません。画像選択・写真撮影を試してください。":"A câmera ao vivo não está disponível neste ambiente de exibição. Experimente selecionar imagens e tirar fotos.","共有範囲：同じチャットの参加者全員。管理モードは端末内の表示切替です。未送信件数：":"Escopo de compartilhamento: Todos os participantes do mesmo chat. O modo de gerenciamento é uma chave de exibição dentro do terminal. Número de itens não enviados:","本人の氏名は上の「氏名」欄に入力します。同じ世帯でも1人ずつQRを発行・記録します。":"Digite o nome da pessoa no campo “Nome” acima. Um QR será emitido e registrado para cada pessoa do mesmo domicílio.","カメラを開始できません。他のアプリのカメラを閉じて再試行するか、画像を選んでください。":"Não foi possível iniciar a câmera. Feche a câmera do outro aplicativo e tente novamente ou selecione uma imagem.","従来の退場で区分未確認：{0}人。記録上の状態です。点呼・安否確認と照合してください。":"Classificação não confirmada devido à saída convencional: pessoas {0}. Este é o estado dos registros. Verifique a chamada e a confirmação de segurança.","画像選択のためライブカメラを停止しました。戻る場合は「カメラを再試行」を押してください。":"A câmera ao vivo foi parada para seleção de imagens. Se quiser voltar, pressione \"Repetir câmera\".","カメラの応答を待っています。許可画面を確認するか、下の画像選択・写真撮影を利用してください。":"Aguardando resposta da câmera. Verifique a tela de permissão ou use a opção de seleção de imagem/captura de foto abaixo.","共有履歴の表示対象から全記録を除外します。過去の通信データ・端末保存・CSVは消去されません":"Exclua todos os registros da exibição no histórico de compartilhamento. Dados de comunicação anteriores, armazenamento do dispositivo e CSV não serão excluídos.","人数は人物IDで重複除外。数量は項目と単位ごとの合計です。在庫や受給資格の判定は含みません。":"Números duplicados são excluídos por ID pessoal. Quantidade é o total de cada item e unidade. Não inclui inventário ou determinação de elegibilidade.","登録情報が見つかりません。同じ添付アプリの同期やJSONバックアップの復元を確認してください。":"Informações cadastrais não encontradas. Certifique-se de sincronizar o mesmo aplicativo anexado ou restaurar o backup JSON.","QRが見つかりません。QR全体と白い余白が写るように切り抜くか、明るく撮影して選び直してください":"QR não encontrado. Corte-o para que todo o QR e a margem branca fiquem visíveis ou tire uma foto mais clara e selecione novamente.","ブース参加・物資受取を記録します。選択したボタンはこの端末に保存され、入退場とは別に記録されます。":"Registre a participação no estande e o recebimento de suprimentos. O botão que você selecionar será salvo neste dispositivo e será gravado separadamente da sua entrada/saída.","ブラウザーデモ：記録はこのブラウザーに保存されます。Delta Chat端末への通知は行いません。":"Demonstração do navegador: as gravações serão salvas neste navegador. As notificações não serão enviadas aos terminais Delta Chat.","登録人物 {0}人 ／ 入退場 {1}件 ／ 参加・受取 {2}件 ／ 新規履歴イベント {3}件":"Pessoas cadastradas: {0} / Entrada/saída: {1} / Participantes/recebedores: {2} / Novos eventos históricos: {3}","入退場時にこの端末IDと、その時点の端末名・会場を記録します。端末名は設定後の記録に反映されます。":"Ao entrar e sair do local, registre o ID do terminal, o nome do terminal e o local naquele momento. O nome do terminal será refletido no registro após a configuração.","発行・印刷された人物QRをスキャンして入退場として記録。同じチャット内で共有（通信状況により遅延）。":"O QR emitido/impresso da pessoa é digitalizado e registrado como entrada/saída. Compartilhe no mesmo chat (podem ocorrer atrasos dependendo do status da comunicação).","未登録または登録情報が未同期のIDです。発行端末と同じチャットの登録情報を受信してから再読取してください":"Este ID não está registrado ou as informações registradas não estão sincronizadas. Por favor, releia depois de receber as mesmas informações de registro do chat do terminal emissor.","登録済み情報でQRを再表示します。編集中の変更は保存しません。再発行しても紛失したQRは無効になりません。":"Reexibir o QR com as informações cadastradas. As alterações de edição não serão salvas. Um QR perdido não será invalidado mesmo se for reemitido.","{0} 〜 {1} ／ 会場：{2} ／ 端末：{3} ／ 種類：{4} ／ 対象：{5} ／ 検索：{6}":"{0} ~ {1} / Local: {2} / Terminal: {3} / Tipo: {4} / Alvo: {5} / Pesquisa: {6}","最大12個。種類の登録・削除は管理者の「ブース・物資」で行います。ブース参加は1スキャンで1人分の参加記録です。":"Máximo de 12 peças. O cadastro e a exclusão dos tipos podem ser feitos na seção “Estande/Suprimentos” do administrador. Para participação no estande, uma varredura registra a participação de uma pessoa.","時間帯別・月別・曜日別も、期間・会場・読取端末の条件に従います。年をまたぐ期間の月別グラフは同じ月を合算します。":"Por horário, mês e dia da semana, segue também as condições do período, local e terminal de leitura. Os gráficos mensais para períodos que abrangem anos somam os mesmos meses.","端末やDelta Chatの対応状況により、写真撮影またはファイル選択が開きます。ライブカメラとは別の方法です。":"Dependendo do seu dispositivo e da compatibilidade do Delta Chat, você poderá tirar uma foto ou selecionar um arquivo. Este é um método diferente da câmera ao vivo.","この画像形式を表示できません。PNGまたはJPEGで保存して選び直してください（HEIC/HEIFは環境により非対応）":"Este formato de imagem não pode ser exibido. Salve como PNG ou JPEG e selecione novamente (HEIC/HEIF não é compatível dependendo do ambiente)","端末ごとに選びます。切替はボタン表示と今回の記録区分に適用し、過去の記録・人物ID・世帯・物資受取履歴は変更しません。":"Selecione para cada dispositivo. A mudança se aplica à exibição do botão e à classificação de registro atual e não altera registros anteriores, IDs de pessoas, famílias e histórico de recebimento de materiais.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して本人に配布。":"Insira o setor, empresa, departamento, cargo, nome, endereço, telefone e e-mail para gerar automaticamente um ID arbitrário e emitir um QR apenas com o ID. Imprima e distribua para a pessoa.","入場回数は入場・帰所、退場回数は従来退場・一時外出・正式退所の記録件数です。現在の避難者状態は「避難者・世帯」で確認してください。":"O número de internações refere-se ao número de admissões e retornos, e o número de saídas refere-se ao número de casos tradicionalmente registrados como saídas, saídas temporárias e saídas oficiais. Verifique o status atual do evacuado em \"Evacuar/Família\".","人物の所属はQR発行画面で保存します。同じ名前でも世帯IDが違えば別世帯です。所属変更は人物ごとに行います。過去の履歴の世帯情報は書き換えません。":"A afiliação de uma pessoa é salva na tela de emissão do QR. Mesmo que o nome seja o mesmo, se o ID do agregado familiar for diferente, trata-se de um agregado familiar diferente. As alterações na afiliação são feitas para cada pessoa. As informações domésticas na história passada não serão reescritas.","通常はOFFで新しい端末IDを使います。ONにする場合は元端末の利用を終了してください。過去の履歴の端末IDは、どちらの場合も元のまま保持します。":"Normalmente, desligue-o e use um novo ID de dispositivo. Se você quiser ligá-lo, pare de usar o dispositivo original. O ID do dispositivo do histórico passado é mantido como estava em ambos os casos.","入退場・在場人数には加算しません。実人数は人物IDの重複を除き、数量は物資・単位ごとに集計します。受給資格・在庫・重複配布の自動判定は行いません。":"Não será somado o número de pessoas entrando/saindo e participando. O número real de pessoas será calculado excluindo IDs de pessoas duplicadas e a quantidade será calculada por material/unidade. Não haverá determinação automática de elegibilidade, inventário ou distribuição duplicada.","業種・会社・部署・役職・氏名・住所・電話・メールを入力して任意IDを自動生成し、IDだけのQRを発行。印刷して配布し、会場でスキャンして入退場を一括管理。":"Insira o setor, empresa, departamento, cargo, nome, endereço, telefone e e-mail para gerar automaticamente um ID arbitrário e emitir um QR apenas com o ID. Imprima, distribua, digitalize no local e gerencie a entrada e a saída de uma só vez.","リストは同じ添付アプリ内で共有します。削除した項目は専用ボタンから新たに記録できなくなりますが、過去の参加・受取履歴は残ります。別端末では変更の受信後に反映されます。":"Compartilhe a lista no mesmo aplicativo anexado. Os itens excluídos não podem ser registrados novamente usando o botão dedicado, mas a participação anterior e o histórico de recebimento permanecerão. Em outro dispositivo, as alterações serão refletidas após serem recebidas.","氏名・人物ID・世帯名・会社・電話・メールで登録人物を検索し、本人を確認して「同じIDでQRを再発行」を押します。人物情報・入退所・参加・物資受取・世帯の履歴を引き継ぎます。":"Procure a pessoa cadastrada por nome, ID da pessoa, nome do domicílio, empresa, telefone e e-mail, confirme a identidade e pressione “Reemitir QR com o mesmo ID”. Informações pessoais, entrada/saída, participação, recebimento de suprimentos e histórico familiar serão herdados.","カメラへのアクセスが拒否されました。端末のカメラ権限を確認してください。Delta Chat/Webxdc側の制限でも拒否されるため、許可済みなら画像選択・写真撮影を試してください。":"O acesso à câmera foi negado. Verifique as permissões da câmera do seu dispositivo. Isso também será negado devido a restrições do lado Delta Chat/Webxdc, portanto, se você tiver permissão, tente selecionar uma imagem ou tirar uma foto.","グラフは最大12分類と残りの合計。下表と印刷レポートには全分類を記載します。端末別グラフのラベルは端末ID末尾8文字、正式なIDと端末名は下表で確認できます。旧記録は実端末を識別できません。":"O gráfico mostra até 12 classificações e o total restante. Todas as classificações estão listadas na tabela abaixo e no relatório impresso. O rótulo para cada gráfico de terminal contém os últimos 8 caracteres do ID do terminal, e o ID oficial e o nome do terminal podem ser encontrados na tabela abaixo. O registro antigo não consegue identificar o terminal real.","初期設定はOFFです。本人の公開許諾を確認した対象者に限ってONにしてください。添付CGIの判定仕様に合わせ、OFFでは備考などの公開判定語を表示用の文字参照へ変換し、ONでは明示的な公開用の印を付けます。":"A configuração inicial está DESLIGADA. Ative-o apenas para aqueles que confirmaram sua permissão para publicar. De acordo com as especificações de julgamento do CGI anexo, quando DESLIGADO, palavras de julgamento público, como notas, são convertidas em referências de caracteres para exibição e, quando LIGADO, é adicionada uma marca explícita para publicação.","指定期間・会場で入場記録のあるIDを1人として集計。属性は期間内の最終入場時点です。年齢・性別が未登録の履歴は「未回答」として扱います。会場別・端末別人数はそれぞれの中で重複を除きます。未同期記録は含まれません。":"Identificações com registro de admissão no período/local especificado serão contadas como uma pessoa. O atributo é o último ponto de entrada dentro do período. O histórico para o qual não há registro de idade e sexo será tratado como “sem resposta”. Números duplicados para cada local e terminal são excluídos. Não inclui gravações não sincronizadas.","人物、入退場、参加・受取、ブース・物資・会場の登録履歴、未送信分、端末名・利用モード・専用ボタン設定をJSONに保存します。個人情報を含むため保存先と共有先を確認してください。管理パスワードとログイン状態は含みません。":"Pessoas, entrada/saída, participação/recebimento, histórico de registro de estande/abastecimento/local, informações não enviadas, nome do dispositivo, modo de uso e configurações de botão dedicado são salvos em JSON. Verifique os destinos de armazenamento e compartilhamento, pois eles contêm informações pessoais. Não inclui senha administrativa e status de login.","HXL CSVはUTF-8 BOM付き、1行目が列名・2行目がHXLタグです。esbbs.cgiの避難者カテゴリで取り込みます。ZIPはサーバー管理者が展開し、TXTを両CGIの共通の避難者保存先へ配置するための形式です。":"HXL CSV tem BOM UTF-8, a primeira linha é o nome da coluna e a segunda linha é a tag HXL. Importe na categoria evacuado de esbbs.cgi. ZIP é um formato para administradores de servidor extrair e colocar TXT no local de armazenamento comum de evacuados para ambos os CGIs.","来場者を避難者として出力します。esbbs.cgiの「避難者」HXL取込と、sbbs.cgi・esbbs.cgi共通のメールTXT保存形式に対応します。備考には人物ごとの全ブース参加・物資受取履歴（日時・名称・数量・会場・端末）も含めます。CGIへ自動送信はしません。":"Saída de visitantes como evacuados. Suporta importação HXL \"evacuado\" de esbbs.cgi e formato de armazenamento TXT de e-mail comum a sbbs.cgi e esbbs.cgi. As notas incluirão toda a participação no estande e histórico de recebimento de materiais (data/hora, nome, quantidade, local, terminal) de cada pessoa. Não será enviado automaticamente para o CGI.","CGI側は1行の「項目名:値」を解析するため、CGI向けの備考の改行は「 ／ 」にまとめます。特殊文字はCGI表示用に安全化します。元の備考の改行・文字列は通常CSVとJSONで保持します。HXL取込にはCGI側の重複除去がないため、同じCSVを繰り返し取り込むと重複します。":"Como o lado CGI analisa uma única linha de \"nome do item: valor\", as quebras de linha nas notas para CGI são agrupadas em \"/\". Caracteres especiais são protegidos para exibição CGI. Quebras de linha e sequências de caracteres nas notas originais geralmente são retidas em CSV e JSON. A importação HXL não possui remoção de duplicatas no lado CGI, portanto, se você importar o mesmo CSV repetidamente, ele será duplicado.","JSONは既存データとIDで統合し、追加分を同じ添付アプリへ共有します。同じファイルの再取込で履歴を増やしません。同じ運用のバックアップを選んでください。リセット履歴も反映されます。旧版の入退場CSVは人物と入退場のみ取り込めます。CSVでは端末設定や物資リストは復元できません。":"JSON é integrado aos dados existentes por ID e os dados adicionais são compartilhados no mesmo aplicativo anexado. O histórico não será aumentado pela reimportação do mesmo arquivo. Selecione um backup com a mesma operação. O histórico de redefinição também é refletido. A versão antiga do CSV de entrada/saída só pode importar pessoas e entrada/saída. As configurações do dispositivo e as listas de materiais não podem ser restauradas com CSV.","入場回数には帰所、退場回数には一時外出と正式退所を含みます。期間内の入場IDを重複除外して人数を計算。属性は期間内の最終入場時点。年齢は年代別で未回答を含みます。会場別・端末別人数はそれぞれの中の実人数です。各表は全分類、グラフは上位12分類と残り合計。同期前の記録は含みません。":"O número de admissões inclui o retorno às instalações e o número de saídas inclui as saídas temporárias e as saídas oficiais. Calcule o número de pessoas excluindo IDs de admissão duplicados no período. Os atributos são da última entrada do período. A idade inclui perguntas não respondidas por faixa etária. O número de pessoas por local e dispositivo é o número real de pessoas em c
